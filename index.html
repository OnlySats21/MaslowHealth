piración cada 6 segundos", "Pausar para 5 respiraciones cada minuto"], "a": 2, "w": "Las compresiones se vuelven continuas y la ventilación corre de forma independiente a una respiración cada 6 segundos."}, {"q": "¿A qué fracción de compresión torácica debe aspirar un equipo?", "o": ["Al menos 30 por ciento", "Más del 60 por ciento, idealmente 80 por ciento", "Exactamente 50 por ciento", "No importa"], "a": 1, "w": "La fracción de compresión — la parte del tiempo del código que se pasa comprimiendo — debe superar el 60 por ciento, y los equipos de alto desempeño llegan al 80 por ciento."}, {"q": "¿Dónde se verifica el pulso en un bebé?", "o": ["Carótida", "Braquial", "Radial", "Solo femoral"], "a": 1, "w": "Arteria braquial en bebés; carótida en niños y adultos."}, {"q": "Dos rescatadores reaniman a un bebé de 8 meses. ¿Qué proporción usan?", "o": ["30 por 2", "15 por 2", "10 por 1", "Compresiones continuas"], "a": 1, "w": "Dos o más rescatadores usan 15 por 2 en bebés y niños. Un solo rescatador usa 30 por 2."}, {"q": "¿Cuál es la causa más común de ventilación inefectiva con bolsa-mascarilla?", "o": ["Comprimir la bolsa demasiado despacio", "No lograr un buen sello de la mascarilla", "Usar una bolsa demasiado pequeña", "Comprimir a la frecuencia equivocada"], "a": 1, "w": "La mayoría de las fallas con bolsa-mascarilla son fallas de sello. La técnica de dos rescatadores, con una persona usando ambas manos en la mascarilla, resuelve casi todas."}, {"q": "Un residente no responde, tiene respiración agónica y pulso palpable, y se sospecha sobredosis de opioides. ¿Cuál es la prioridad?", "o": ["Dar naloxona y esperar", "Iniciar compresiones torácicas", "Dar respiraciones de rescate, administrar naloxona y activar la respuesta de emergencia", "Solo estimulación esternal"], "a": 2, "w": "Con pulso presente, el tratamiento es ventilación más naloxona. Si no hay pulso, la RCP tiene prioridad — la naloxona no reinicia un corazón."}, {"q": "¿Qué es la comunicación de circuito cerrado?", "o": ["El líder del equipo solo le habla al enfermero", "Se da una orden específica a una persona nombrada, ella la repite y avisa cuando está hecha", "La comunicación se queda dentro de la habitación", "Solo habla quien registra"], "a": 1, "w": "La comunicación dirigida, confirmada y verificada evita tareas duplicadas u olvidadas durante un código."}, {"q": "¿Cada cuánto deben rotar los compresores y por qué se coordina con la verificación del ritmo?", "o": ["Cada 5 minutos, por comodidad", "Cada 2 minutos, para que el cambio ocurra en la pausa que ya existe y no cueste tiempo extra", "Solo cuando se agoten", "Nunca durante un código"], "a": 1, "w": "Rotar cada 2 minutos conserva la profundidad de las compresiones, y hacerlo durante la pausa de verificación del ritmo evita agregar una interrupción."}, {"q": "Se rescata de una piscina a una víctima de ahogamiento en paro cardíaco. ¿Qué se enfatiza?", "o": ["Drenar primero el agua de los pulmones", "Solo compresiones", "Ventilación temprana junto con las compresiones, sin demora", "Esperar a los paramédicos"], "a": 2, "w": "El paro por ahogamiento es hipóxico, así que la ventilación es importante. Nunca retrase la RCP para intentar drenar agua."}, {"q": "¿Aproximadamente qué tan rápido empiezan a deteriorarse las destrezas de BLS después de un curso?", "o": ["Después de cinco años", "Dentro de tres a seis meses", "No se deterioran", "Solo después de que vence la tarjeta"], "a": 1, "w": "El deterioro medible ocurre dentro de tres a seis meses, mucho antes de que venza la tarjeta de dos años, y por eso importa la práctica breve y frecuente en maniquí."}]}, "hivaids": {"body": [{"t": "h", "v": "1. Por qué se exige este curso"}, {"t": "p", "v": "La sección 455.222 de los Estatutos de Florida exige que los trabajadores de la salud regulados por el Departamento de Salud completen educación sobre el VIH y el SIDA, y Florida sigue siendo uno de los estados con mayor número de nuevos diagnósticos del país, con el sur de Florida entre las áreas metropolitanas más afectadas. Para quien trabaja en cuidado residencial esto no es teórico: cada vez más residentes que viven con VIH llegan a la edad de la vida asistida, y los procedimientos de exposición ocupacional de este curso son los mismos que lo protegen de la hepatitis B y C."}, {"t": "h", "v": "2. El virus y la enfermedad"}, {"t": "p", "v": "El VIH — virus de inmunodeficiencia humana — es un retrovirus que infecta los linfocitos T CD4, las células que coordinan la respuesta inmunitaria. Sin tratamiento se replica de forma continua y destruye esas células, y con los años el sistema inmunitario pierde la capacidad de controlar infecciones y ciertos cánceres."}, {"t": "p", "v": "El VIH y el SIDA no son lo mismo. El SIDA — síndrome de inmunodeficiencia adquirida — es una etapa de la infección por VIH, definida por un conteo de CD4 por debajo de 200 células por microlitro o por la presencia de una enfermedad oportunista específica, como neumonía por Pneumocystis, candidiasis esofágica, sarcoma de Kaposi, meningitis criptocócica o complejo Mycobacterium avium diseminado. Una persona con tratamiento efectivo puede nunca progresar a SIDA, y una persona que alguna vez cumplió la definición de SIDA puede recuperar una función inmunitaria considerable con tratamiento."}, {"t": "ul", "v": ["<strong>Infección aguda</strong> — de dos a cuatro semanas después de la exposición, muchas personas desarrollan una enfermedad parecida a la gripe o a la mononucleosis: fiebre, dolor de garganta, erupción, ganglios inflamados, dolores musculares. La carga viral es extremadamente alta y el riesgo de transmisión está en su punto máximo. Muchas personas, y muchos clínicos, confunden esto con un virus común.", "<strong>Infección crónica</strong> — el virus continúa replicándose, con frecuencia sin síntomas, durante años. Sin tratamiento, el tiempo medio hasta el SIDA es de cerca de una década.", "<strong>SIDA</strong> — inmunodeficiencia avanzada, con infecciones oportunistas y tumores malignos."]}, {"t": "h", "v": "3. Cómo se transmite el VIH"}, {"t": "p", "v": "Solo ciertos líquidos corporales transmiten el VIH: sangre, semen, líquido preseminal, líquidos rectales, líquidos vaginales y leche materna. Para que haya transmisión, uno de esos líquidos de una persona con carga viral detectable debe llegar a una membrana mucosa, a tejido lesionado o directamente al torrente sanguíneo."}, {"t": "ul", "v": ["Sexo anal o vaginal sin condón o sin una prevención efectiva. El sexo anal receptivo conlleva el mayor riesgo sexual por acto.", "Compartir agujas, jeringas u otro equipo de inyección.", "Transmisión perinatal durante el embarazo, el parto o la lactancia — hoy prevenible en casi todos los casos con tratamiento.", "Exposición ocupacional: una punción o lesión con objeto punzante, o una salpicadura de sangre u otro material infeccioso a los ojos, la nariz, la boca o piel no intacta.", "Transfusión o trasplante, hoy extremadamente raro en Estados Unidos por el tamizaje de donantes."]}, {"t": "h", "v": "4. Cómo NO se transmite el VIH"}, {"t": "p", "v": "Esto importa tanto como la lista de transmisión, porque las creencias falsas son lo que provoca el maltrato de residentes y compañeros:"}, {"t": "ul", "v": ["No por abrazar, dar la mano ni compartir una cama o un baño.", "No por saliva, lágrimas, sudor, orina ni heces que no contengan sangre visible.", "No por compartir platos, cubiertos, comida ni vasos.", "No por asientos de inodoro, manijas de puertas, ropa de cama ni piscinas.", "No por mosquitos, garrapatas ni ningún otro insecto.", "No por toser, estornudar ni respirar el mismo aire.", "No por besos con la boca cerrada. El beso profundo conlleva un riesgo solo teórico si ambas personas tienen sangrado importante en la boca."]}, {"t": "h", "v": "5. Las pruebas"}, {"t": "ul", "v": ["<strong>Prueba de laboratorio de antígeno y anticuerpos</strong> — la prueba estándar de cuarta generación, que detecta tanto el antígeno p24 como los anticuerpos; normalmente resulta positiva de 18 a 45 días después de la exposición.", "<strong>Prueba de ácido nucleico (NAT)</strong> — detecta el virus mismo, positiva desde los 10 a 33 días; se usa para infección aguda y para confirmar resultados indeterminados.", "<strong>Pruebas rápidas de anticuerpos</strong> — sangre o líquido oral, con resultados en minutos; las de líquido oral tardan más en volverse positivas. Una prueba rápida reactiva es un resultado preliminar y debe confirmarse.", "<strong>Período de ventana</strong> — el intervalo después de la infección en que la prueba puede seguir siendo negativa aunque la persona esté infectada y pueda ser muy contagiosa. Un resultado negativo no descarta una exposición reciente; se requiere repetir la prueba."]}, {"t": "p", "v": "Los CDC recomiendan que toda persona de 13 a 64 años se haga la prueba al menos una vez como parte de su atención de rutina, y que quienes tienen riesgo continuo se la hagan al menos cada año. Bajo la ley de Florida, la prueba de VIH en un entorno de atención de salud puede realizarse con el consentimiento general del paciente para su atención, después de informarle que se planea la prueba y de su derecho a rechazarla — ya no se requiere un formulario de consentimiento específico para VIH en ese entorno."}, {"t": "h", "v": "6. Tratamiento: lo que realmente ha cambiado"}, {"t": "p", "v": "La terapia antirretroviral (TAR) — normalmente una sola pastilla diaria que combina varios medicamentos, y cada vez más una inyección de acción prolongada cada uno o dos meses — suprime la replicación del VIH. Con tratamiento constante la carga viral de la persona se vuelve indetectable, el sistema inmunitario se recupera y la expectativa de vida se acerca a la de las personas sin VIH. Hoy el tratamiento se recomienda para toda persona con VIH, de inmediato al diagnóstico, sin importar el conteo de CD4."}, {"t": "p", "v": "<strong>Indetectable equivale a intransmisible.</strong> Una persona que mantiene una carga viral indetectable de forma sostenida no transmite el VIH por vía sexual. Esto es ciencia establecida, no un consuelo, y es una de las razones por las que apoyar la adherencia es una prioridad clínica. Omitir dosis, en cambio, permite que el virus rebote y puede permitir que se desarrolle resistencia a los medicamentos."}, {"t": "p", "v": "En un centro residencial, su papel en el tratamiento es la adherencia y la privacidad: dosis a tiempo, nunca dejar que se acaben los surtidos, reportar los efectos secundarios y nunca hablar del estado del residente donde otros puedan oír."}, {"t": "h", "v": "7. Prevención"}, {"t": "ul", "v": ["<strong>Condones</strong>, usados de forma consistente y correcta.", "<strong>PrEP</strong> — profilaxis previa a la exposición: una pastilla diaria o una inyección de acción prolongada para personas sin VIH con riesgo continuo, que reduce la adquisición sexual cerca del 99 por ciento cuando se toma como se indica.", "<strong>PEP</strong> — profilaxis posterior a la exposición: un curso antirretroviral de 28 días iniciado lo antes posible después de una posible exposición y <strong>no más tarde de 72 horas</strong>. Antes es mejor; las horas cuentan.", "<strong>Tratamiento como prevención</strong> — la supresión viral en una persona con VIH previene la transmisión sexual posterior.", "<strong>Acceso a jeringas estériles</strong> y nunca compartir equipo de inyección.", "<strong>Profilaxis perinatal</strong> — la TAR materna más la profilaxis del recién nacido reducen la transmisión a menos del uno por ciento."]}, {"t": "h", "v": "8. Exposición ocupacional — qué hacer"}, {"t": "p", "v": "Un incidente de exposición es una punción u otra lesión con objeto punzante, una salpicadura de sangre u otro material potencialmente infeccioso al ojo, la nariz o la boca, o el contacto con piel no intacta. El riesgo promedio de transmisión del VIH por una punción percutánea con sangre infectada es de cerca del 0.3 por ciento — aproximadamente 1 en 300 — y menor en la exposición de membranas mucosas. En el caso de la hepatitis B, en un trabajador no vacunado, el riesgo es mucho más alto, hasta cerca del 30 por ciento."}, {"t": "ul", "v": ["<strong>De inmediato</strong> lave la herida con agua y jabón; enjuague las membranas mucosas con agua o solución salina por 15 minutos. No apriete la herida y no aplique cloro ni sustancias cáusticas.", "<strong>Repórtelo enseguida</strong> a su supervisor y siga el plan de control de exposición del centro. El tiempo es la variable que usted todavía puede cambiar.", "<strong>Busque evaluación médica el mismo día.</strong> El clínico que lo evalúe decide sobre la PEP para VIH, que debe iniciarse en horas y no más tarde de 72 horas, y sobre la inmunoglobulina y la vacuna de hepatitis B según corresponda.", "<strong>Las pruebas a la persona fuente</strong> se gestionan según la ley y la política — usted no le hace pruebas ni la interroga por su cuenta.", "<strong>Las pruebas de seguimiento</strong> normalmente son al inicio, a las seis semanas, a las doce semanas y a los seis meses (los esquemas varían según la generación de prueba usada y el juicio del clínico).", "La evaluación, la PEP y el seguimiento se brindan <strong>sin costo para usted</strong> bajo la norma de patógenos sanguíneos de OSHA, y su expediente médico es confidencial.", "La lesión se registra en el registro de lesiones por objetos punzantes del centro y, cuando corresponde, en el registro OSHA 300."]}, {"t": "note", "v": "La razón más común por la que un trabajador no recibe la PEP a tiempo es que no reportó la exposición el día que ocurrió. No hay castigo por reportar. No hay forma de deshacer una demora."}, {"t": "h", "v": "9. Ley de Florida: confidencialidad de la información de VIH"}, {"t": "p", "v": "La sección 381.004 de los Estatutos de Florida otorga a los resultados de la prueba de VIH y al estado de VIH un nivel de protección superior a la confidencialidad médica ordinaria. La identidad de la persona a quien se le hace una prueba de VIH y el resultado no pueden divulgarse salvo en lo específicamente autorizado por la ley — en general se requiere una <strong>autorización escrita específica y por separado</strong> de la persona, que nombre la divulgación de información de VIH. Una autorización general de expedientes médicos no es suficiente. Existen excepciones limitadas para los proveedores que tratan al paciente, ciertos reportes de salud pública y circunstancias legales específicas."}, {"t": "ul", "v": ["No puede decírselo a otro residente, a un familiar del residente, a su propia familia, ni a un compañero que no participe en el cuidado de ese residente.", "No puede publicarlo, enviarlo por mensaje, ni comentarlo en un pasillo, la sala de descanso o el estacionamiento.", "La divulgación no autorizada es una violación de la ley de Florida que puede conllevar sanciones penales y acciones disciplinarias contra una licencia profesional, además de las consecuencias de HIPAA.", "La misma disciplina aplica a la hepatitis y a cualquier otro diagnóstico: si repetirlo no sirve al cuidado del residente, no lo repita."]}, {"t": "h", "v": "10. Estigma, derechos y buen cuidado"}, {"t": "p", "v": "El VIH es una discapacidad bajo la Ley de Estadounidenses con Discapacidades. Negar la admisión, negarse a atender, aislar socialmente o asignar platos o baños separados a un residente por su estado de VIH es discriminación, y además no tiene sentido clínico — las precauciones estándar ya lo protegen a usted. Los residentes que envejecen con VIH suelen cargar décadas de experiencia de ser tratados como contagiosos; la calidad de su cuidado ordinario y sin aspavientos es la intervención."}, {"t": "p", "v": "Desde lo clínico, vigile las comorbilidades que acompañan al VIH de larga duración y al envejecimiento: enfermedad cardiovascular, pérdida de masa ósea y riesgo de fractura, enfermedad renal, diabetes, cambios neurocognitivos, depresión e interacciones por polifarmacia con los antirretrovirales. Tamice y reporte como lo haría con cualquier residente."}, {"t": "h", "v": "11. Coinfecciones que debe conocer"}, {"t": "ul", "v": ["<strong>Tuberculosis</strong> — la principal causa de muerte a nivel mundial entre las personas con VIH. Una tos nueva, sudores nocturnos, fiebre o pérdida de peso en un residente con VIH justifican evaluación pronta y precauciones por vía aérea hasta descartar tuberculosis.", "<strong>Hepatitis B</strong> — comparte vías de transmisión; existe vacuna y su empleador debe ofrecérsela sin costo.", "<strong>Hepatitis C</strong> — comparte la transmisión por sangre, es común en personas que se inyectan drogas y hoy se cura en la mayoría de los casos con antivirales de acción directa."]}], "quiz": [{"q": "¿Cuál de los siguientes transmite el VIH?", "o": ["Saliva sin sangre visible", "Sangre, semen, líquidos rectales y vaginales, y leche materna", "Sudor y lágrimas", "Picaduras de mosquito"], "a": 1, "w": "Solo la sangre, el semen y el líquido preseminal, el líquido rectal, el líquido vaginal y la leche materna transmiten el VIH. La saliva, el sudor, las lágrimas y los insectos no."}, {"q": "¿Qué define un diagnóstico de SIDA?", "o": ["Cualquier prueba de VIH positiva", "Un conteo de CD4 por debajo de 200, o una enfermedad oportunista específica", "Síntomas que duran más de un año", "Una carga viral detectable"], "a": 1, "w": "El SIDA es una etapa de la infección por VIH definida por un conteo de CD4 menor a 200 células/µL o la presencia de una condición oportunista que define SIDA."}, {"q": "Sufre una punción con la lanceta de un residente. ¿Qué es lo PRIMERO que hace?", "o": ["Apretar la herida para sacar sangre", "Lavar la herida con agua y jabón", "Aplicar cloro en el sitio", "Terminar el turno y reportarlo mañana"], "a": 1, "w": "Lave de inmediato con agua y jabón — no apriete ni aplique cáusticos — luego reporte enseguida y busque evaluación médica el mismo día."}, {"q": "¿Cuál es el límite de tiempo para iniciar la profilaxis posterior a la exposición al VIH?", "o": ["Dentro de 2 semanas", "Dentro de 7 días", "Lo antes posible y no más tarde de 72 horas", "No hay límite de tiempo"], "a": 2, "w": "La PEP debe iniciarse lo antes posible y no más tarde de 72 horas después de la exposición. Cada hora de demora reduce su efectividad."}, {"q": "¿Cuál es aproximadamente el riesgo de transmisión del VIH por una sola punción con sangre infectada?", "o": ["Cerca del 30 por ciento", "Cerca del 0.3 por ciento", "Cerca del 50 por ciento", "Prácticamente 100 por ciento"], "a": 1, "w": "Cerca del 0.3 por ciento, o aproximadamente 1 en 300. El riesgo de hepatitis B en un trabajador no vacunado es mucho mayor, hasta cerca del 30 por ciento."}, {"q": "La hija de una residente le pregunta directamente si su madre tiene VIH. ¿Qué es correcto bajo la ley de Florida?", "o": ["Responder con honestidad porque es familia", "Confirmarlo solo si la residente no está en la habitación", "No divulgarlo; la información de VIH requiere autorización escrita específica de la residente", "Remitirla a otra residente que quizá sepa"], "a": 2, "w": "La sección 381.004 exige autorización escrita específica para divulgar información de VIH. El parentesco por sí solo no autoriza la divulgación."}, {"q": "¿Qué significa 'indetectable equivale a intransmisible'?", "o": ["La persona está curada del VIH", "Una persona con carga viral indetectable sostenida no transmite el VIH por vía sexual", "Las pruebas de VIH ahora saldrán negativas", "El tratamiento se puede suspender con seguridad"], "a": 1, "w": "La supresión viral sostenida previene la transmisión sexual. La persona sigue teniendo VIH y debe continuar el tratamiento."}, {"q": "El 'período de ventana' significa:", "o": ["El tiempo que tiene para iniciar la PEP", "El intervalo después de la infección en que la prueba puede seguir siendo negativa", "El tiempo que el VIH sobrevive en una superficie", "El período en que la TAR debe tomarse cada día"], "a": 1, "w": "Durante el período de ventana la persona está infectada — con frecuencia con carga viral muy alta — pero la prueba puede no ser aún positiva, así que un resultado negativo no descarta una exposición reciente."}, {"q": "¿Cuál es el cuidado adecuado para un residente que vive con VIH en un ALF?", "o": ["Platos separados y un baño exclusivo", "Exclusión del comedor y las actividades en grupo", "Precauciones estándar y el mismo cuidado que cualquier otro residente", "Poner el diagnóstico en la puerta para que el personal lo sepa"], "a": 2, "w": "Las precauciones estándar son suficientes. Los platos separados, la exclusión social y poner un diagnóstico a la vista son discriminatorios y, en el caso del aviso en la puerta, también una divulgación ilegal."}, {"q": "La PrEP es:", "o": ["Tratamiento para alguien que ya tiene VIH", "Medicamento que toma una persona sin VIH para evitar adquirirlo", "Una vacuna contra el VIH", "El curso de 28 días que se toma después de una exposición"], "a": 1, "w": "La PrEP es profilaxis previa a la exposición, para personas sin VIH con riesgo continuo. El curso de 28 días posterior a una exposición es la PEP."}, {"q": "Un residente con VIH desarrolla tos nueva, sudores nocturnos y pérdida de peso. ¿Qué debe considerar y hacer?", "o": ["Nada — eso es normal en el VIH", "Posible tuberculosis; reportar de inmediato y aplicar precauciones por vía aérea hasta descartarla", "Animarlo a tomar más líquidos y revisarlo en un mes", "Suponer que es un efecto secundario de la TAR"], "a": 1, "w": "La tuberculosis es la principal causa de muerte a nivel mundial entre personas con VIH. Estos síntomas requieren evaluación pronta y precauciones por vía aérea hasta excluirla."}, {"q": "¿Quién paga su evaluación médica y las pruebas de seguimiento después de una exposición ocupacional?", "o": ["El empleado, con su seguro de salud", "El empleador, sin costo para el empleado, bajo la norma de patógenos sanguíneos de OSHA", "La familia del residente", "Nadie; el seguimiento es opcional"], "a": 1, "w": "La norma de patógenos sanguíneos de OSHA exige que el empleador brinde evaluación confidencial posterior a la exposición, profilaxis y seguimiento sin costo para el empleado."}]}, "osha": {"body": [{"t": "h", "v": "1. Qué es OSHA y qué le garantiza a usted"}, {"t": "p", "v": "La Ley de Seguridad y Salud Ocupacional de 1970 creó OSHA y le dio a todo trabajador cubierto el derecho a un lugar de trabajo libre de peligros reconocidos. Dos disposiciones importan más en el día a día:"}, {"t": "ul", "v": ["La <strong>Cláusula de Deber General</strong> exige que los empleadores mantengan el lugar de trabajo libre de peligros reconocidos que puedan causar la muerte o daño físico grave, incluso donde no exista una norma específica.", "Las normas específicas, como la norma de patógenos transmitidos por la sangre en 29 CFR 1910.1030, imponen requisitos detallados."]}, {"t": "p", "v": "Sus derechos como empleado incluyen: capacitación en un idioma y vocabulario que usted entienda, sin costo y en horario de trabajo; acceso a sus propios expedientes de exposición y médicos; acceso a las hojas de datos de seguridad; el derecho a ver el cartel de OSHA y los registros de lesiones; el derecho a presentar una queja y solicitar una inspección; y protección contra represalias por hacer cualquiera de esas cosas. La represalia por reportar un peligro o una lesión es en sí una violación, y la queja puede presentarse ante OSHA dentro de 30 días."}, {"t": "h", "v": "2. Alcance de la norma de patógenos sanguíneos"}, {"t": "p", "v": "La norma cubre a los empleados con exposición ocupacional razonablemente anticipada a sangre o a otros materiales potencialmente infecciosos (OPIM). Los OPIM incluyen semen, secreciones vaginales, líquido cefalorraquídeo, sinovial, pleural, pericárdico, peritoneal y amniótico, saliva en procedimientos dentales, cualquier líquido corporal visiblemente contaminado con sangre, cualquier líquido corporal en que sea imposible distinguir uno de otro, y tejido humano no fijado."}, {"t": "p", "v": "Las heces, las secreciones nasales, el esputo, el sudor, las lágrimas, la orina y el vómito <em>no</em> son OPIM bajo la norma salvo que contengan sangre visible — aunque las precauciones estándar y el control de infecciones básico igual exigen guantes e higiene de manos para todos ellos."}, {"t": "h", "v": "3. El Plan de Control de Exposición"}, {"t": "p", "v": "Todo empleador cubierto debe tener un Plan de Control de Exposición por escrito. Debe:"}, {"t": "ul", "v": ["Estar accesible a los empleados durante el horario de trabajo — usted puede pedirlo y se le debe mostrar.", "Revisarse y actualizarse al menos una vez al año, y siempre que nuevas tareas o procedimientos cambien el riesgo de exposición.", "Ser específico sobre la <strong>determinación de exposición</strong>: qué clasificaciones de puesto y qué tareas implican exposición ocupacional, hecha sin tomar en cuenta el equipo de protección personal.", "Documentar que el empleador consideró e implementó dispositivos médicos más seguros, solicitando la opinión de los empleados de primera línea, no gerenciales, que usan esos dispositivos — un requisito añadido por la Ley de Seguridad y Prevención de Pinchazos de Aguja del año 2000.", "Incluir el procedimiento para evaluar un incidente de exposición."]}, {"t": "h", "v": "4. Los tres patógenos que motivan la norma"}, {"t": "ul", "v": ["<strong>Hepatitis B (VHB)</strong> — el más infeccioso de los tres. Puede sobrevivir en sangre seca sobre una superficie por al menos siete días. El riesgo de una sola punción con una fuente infectada en un trabajador no vacunado va de cerca del 6 al 30 por ciento según el estado antigénico de la fuente. Además es el único de los tres prevenible con vacuna.", "<strong>Hepatitis C (VHC)</strong> — el riesgo de transmisión por punción es de cerca del 1.8 por ciento. No existe vacuna, pero la infección se cura en la mayoría de los casos con antivirales de acción directa.", "<strong>VIH</strong> — el riesgo de transmisión por punción es de cerca del 0.3 por ciento, y menor en exposición de membranas mucosas. La profilaxis posterior a la exposición es muy efectiva cuando se inicia pronto."]}, {"t": "h", "v": "5. Vacuna contra la hepatitis B — su derecho"}, {"t": "ul", "v": ["Debe <strong>ofrecerse sin costo</strong> a todo empleado con exposición ocupacional, dentro de los 10 días hábiles de la asignación inicial, después de la capacitación.", "La serie es de tres dosis (o dos dosis de la vacuna adyuvada más nueva) a lo largo de varios meses.", "Se brinda prueba de anticuerpos posterior a la vacunación cuando está indicada.", "Si usted la rechaza, debe firmar la declaración de rechazo exigida por OSHA — y puede cambiar de opinión y recibir la vacuna sin costo en cualquier momento posterior mientras siga empleado en un puesto cubierto.", "El empleador no puede exigirle usar su propio seguro ni pagar una parte."]}, {"t": "h", "v": "6. Controles de ingeniería"}, {"t": "p", "v": "Los controles de ingeniería eliminan o aíslan el peligro, y tienen prioridad sobre depender del comportamiento individual:"}, {"t": "ul", "v": ["Recipientes para objetos punzantes que se puedan cerrar, resistentes a perforación, a prueba de fugas, etiquetados o con código de color, en posición vertical y reemplazados antes de llenarse — nunca llenados por encima de la línea de llenado, y nunca metiendo la mano dentro.", "Dispositivos más seguros: agujas retráctiles o con protector, conectores sin aguja, lancetas de seguridad, agujas de carga sin filo.", "Instalaciones para lavado de manos fácilmente accesibles, o limpiador antiséptico de manos y toallas donde la plomería no sea factible.", "Protectores contra salpicaduras, recipientes con etiqueta de bioriesgo para muestras y contención secundaria sellada."]}, {"t": "h", "v": "7. Controles de prácticas de trabajo"}, {"t": "ul", "v": ["<strong>Nunca vuelva a tapar, doble, corte ni rompa una aguja usada</strong>, y nunca retire una aguja de una jeringa con la mano.", "Deseche los objetos punzantes de inmediato en el recipiente que esté en el punto de uso. No camine con un punzante descubierto y no lo deje sobre una mesa “por un segundo”.", "No comer, beber, fumar, aplicarse cosméticos o bálsamo labial, ni manipular lentes de contacto en áreas donde se anticipa exposición de forma razonable.", "No guardar alimentos ni bebidas en refrigeradores, congeladores, gabinetes, estantes ni mostradores donde se guarde sangre u OPIM.", "Nada de pipeteo ni succión con la boca, de ningún tipo.", "Realice los procedimientos que puedan salpicar de modo que se minimicen las salpicaduras, los rocíos y la generación de aerosoles.", "Lávese las manos de inmediato después de quitarse los guantes y lo antes posible después de cualquier contacto de la piel con sangre u OPIM."]}, {"t": "h", "v": "8. Equipo de protección personal bajo la norma"}, {"t": "p", "v": "El equipo debe ser provisto por el empleador <strong>sin costo</strong>, en tallas adecuadas, fácilmente accesible y con alternativas para empleados alérgicos — por ejemplo, guantes sin látex y forros de guante sin talco. El empleador es responsable de la limpieza, el lavado, la reparación, el reemplazo y la eliminación. A usted nunca se le puede cobrar, y nunca puede llevarse a su casa equipo o ropa contaminada para lavarla."}, {"t": "ul", "v": ["Cambie los guantes en cuanto estén rotos, perforados o comprometidos, y nunca lave ni descontamine guantes desechables para reutilizarlos.", "Los guantes de uso general pueden descontaminarse y reutilizarse hasta que muestren grietas, descascarado, desgarros o perforaciones.", "Quítese todo el equipo antes de salir del área de trabajo y colóquelo en el recipiente designado.", "Si una prenda es penetrada por sangre, quítesela de inmediato, o lo antes posible."]}, {"t": "h", "v": "9. Limpieza, etiquetas y desecho regulado"}, {"t": "ul", "v": ["Debe haber un programa escrito de limpieza y descontaminación, basado en la ubicación, el tipo de superficie, el tipo de suciedad y las tareas realizadas.", "Descontamine las superficies de trabajo con un desinfectante adecuado al terminar los procedimientos, de inmediato después de cualquier derrame y al final del turno si pudo haber contaminación.", "Las cubiertas protectoras como plástico o papel aluminio se retiran y se reemplazan cuando se contaminan.", "Nunca recoja vidrio roto con la mano: use cepillo y recogedor, pinzas o fórceps.", "Las etiquetas de advertencia de bioriesgo — naranja fluorescente o naranja rojizo con el símbolo de bioriesgo — van en los recipientes de desecho regulado, en refrigeradores y congeladores con sangre u OPIM, y en los recipientes usados para almacenar, transportar o enviar ese material. Las bolsas o recipientes rojos pueden sustituir las etiquetas.", "<strong>Desecho regulado</strong> significa sangre u OPIM líquido o semilíquido, artículos impregnados de sangre seca capaces de liberarla, objetos punzantes contaminados, y desecho patológico o microbiológico. Un pañal de incontinencia sucio generalmente es desecho ordinario bajo la norma, salvo que esté saturado de sangre; siga la política de su centro.", "La ropa contaminada se embolsa o se coloca en un recipiente en el lugar de uso, se manipula lo menos posible, nunca se clasifica ni se enjuaga en el área del residente, y se etiqueta o se identifica por color."]}, {"t": "h", "v": "10. Responder a un incidente de exposición"}, {"t": "p", "v": "Un incidente de exposición es el contacto específico del ojo, la boca, otra membrana mucosa, piel no intacta o por vía parenteral con sangre u OPIM. El empleador debe poner a disposición una evaluación médica confidencial y seguimiento de inmediato, sin costo, y debe incluir:"}, {"t": "ul", "v": ["Documentación de la vía de exposición y de las circunstancias.", "Identificación y prueba de la persona fuente, cuando sea factible y lo permita la ley, con los resultados entregados a usted según lo permitido.", "Toma y análisis de su sangre para el estado serológico de VHB y VIH, con su consentimiento.", "Profilaxis posterior a la exposición según indicación médica — la PEP para VIH iniciada en horas y no más tarde de 72 horas; inmunoglobulina y vacuna de hepatitis B según el esquema vigente.", "Consejería y evaluación de cualquier enfermedad reportada.", "Una opinión escrita del profesional de salud que lo evaluó, entregada a usted dentro de 15 días.", "Registro en el <strong>Registro de Lesiones por Objetos Punzantes</strong>, que anota el tipo y la marca del dispositivo, el departamento o área de trabajo y cómo ocurrió el incidente, mantenido de forma que proteja su identidad — y, cuando la lesión cumple los criterios, en el registro OSHA 300."]}, {"t": "note", "v": "Reporte toda exposición el día que ocurre, aunque parezca insignificante. La profilaxis, las pruebas a la fuente y sus propias protecciones legales dependen de que exista el reporte."}, {"t": "h", "v": "11. Comunicación de Peligros y químicos"}, {"t": "p", "v": "La Norma de Comunicación de Peligros, 29 CFR 1910.1200, alineada con el Sistema Globalmente Armonizado, aplica a los desinfectantes, el cloro, el oxígeno, el glutaraldehído, los químicos de limpieza y los pesticidas de su edificio. Exige:"}, {"t": "ul", "v": ["Un programa escrito de comunicación de peligros y un inventario de químicos.", "Una <strong>Hoja de Datos de Seguridad</strong> para cada químico peligroso, en el formato estándar de 16 secciones, accesible a usted en todo momento durante su turno — no guardada bajo llave en una oficina.", "Etiquetas en los recipientes con el identificador del producto, la palabra de advertencia (Peligro o Atención), las indicaciones de peligro, los consejos de prudencia, los pictogramas y la información del proveedor. Todo recipiente secundario en el que usted vierta también debe estar etiquetado.", "Capacitación sobre los peligros, las etiquetas, los pictogramas y las medidas de protección, antes de la exposición y siempre que se introduzca un peligro nuevo.", "Nunca mezcle cloro con amoníaco ni con limpiadores ácidos — el resultado es gas cloro o cloramina, y esto ha matado a personal de limpieza."]}, {"t": "h", "v": "12. Otros requisitos de OSHA que aplican en cuidado residencial"}, {"t": "ul", "v": ["<strong>Protección respiratoria (1910.134)</strong> — si usted debe usar un N95, el empleador le debe una evaluación médica, prueba de ajuste y capacitación. Una mascarilla quirúrgica no exige ninguna de esas cosas porque no es un respirador.", "<strong>Plan de acción de emergencia (1910.38)</strong> — rutas de evacuación, puntos de reunión, sistema de alarma y funciones asignadas.", "<strong>Ergonomía y manejo seguro de residentes</strong> — mover residentes es la principal causa de lesión musculoesquelética en esta industria. Las grúas mecánicas, los cinturones de marcha, los traslados de dos personas y el personal suficiente son los controles.", "<strong>Violencia en el lugar de trabajo</strong> — los trabajadores de salud y servicios sociales sufren una gran parte de todas las lesiones por violencia laboral. Reporte cada incidente, incluidas las amenazas verbales y la agresión de un residente.", "<strong>Tuberculosis</strong> — tamizaje, precauciones por vía aérea y protección respiratoria donde se sospeche tuberculosis.", "<strong>Conservación de registros</strong> — los registros de capacitación se guardan 3 años; los expedientes médicos y de exposición del empleado se guardan durante el empleo más 30 años; el registro OSHA 300 se mantiene y el resumen anual se publica del 1 de febrero al 30 de abril."]}, {"t": "h", "v": "13. Frecuencia de la capacitación"}, {"t": "p", "v": "La capacitación sobre patógenos sanguíneos se exige al momento de la asignación inicial a tareas con exposición ocupacional, <strong>al menos una vez al año después de eso</strong>, y además siempre que cambios en las tareas o los procedimientos afecten la exposición. La capacitación debe ser interactiva — usted debe tener oportunidad de hacer preguntas a una persona con conocimiento — y debe brindarse sin costo en horario de trabajo."}], "quiz": [{"q": "¿Cuál patógeno sanguíneo se puede prevenir con vacuna?", "o": ["VIH", "Hepatitis C", "Hepatitis B", "Los tres"], "a": 2, "w": "Solo la hepatitis B tiene vacuna, y el empleador debe ofrecerla sin costo dentro de los 10 días hábiles de la asignación inicial."}, {"q": "Su empleador le ofrece la vacuna de hepatitis B y usted la rechaza. ¿Qué pasa?", "o": ["Pierde el derecho a ella para siempre", "Firma un formulario de rechazo y aún puede recibirla sin costo después, mientras siga en un puesto cubierto", "Debe pagarla si cambia de opinión", "Debe renunciar"], "a": 1, "w": "El rechazo se documenta en el formulario exigido por OSHA, y la vacuna sigue disponible sin costo si usted cambia de opinión."}, {"q": "¿Cómo debe manejarse una aguja usada?", "o": ["Volver a taparla con cuidado con una mano", "Doblarla para que no se pueda reutilizar", "Colocarla de inmediato en un recipiente para punzantes en el punto de uso", "Retirarla de la jeringa con fórceps y desecharla por separado"], "a": 2, "w": "Volver a tapar, doblar, cortar o romper agujas usadas está prohibido. Deséchelas de inmediato en el punto de uso."}, {"q": "¿Quién paga el equipo de protección personal exigido por la norma de patógenos sanguíneos?", "o": ["El empleado", "El empleador, sin costo para el empleado", "A partes iguales", "El seguro del residente"], "a": 1, "w": "El empleador debe proveer, limpiar, reparar, reemplazar y desechar el equipo sin costo para el empleado, incluidas alternativas sin látex para empleados alérgicos."}, {"q": "¿Cuál de estos se considera OPIM bajo la norma?", "o": ["Orina sin sangre visible", "Sudor", "Líquido cefalorraquídeo", "Secreciones nasales sin sangre visible"], "a": 2, "w": "El líquido cefalorraquídeo es OPIM de forma explícita. La orina, el sudor, las lágrimas, las heces, el vómito y las secreciones nasales no lo son, salvo que estén visiblemente contaminados con sangre — aunque igual se requieren guantes e higiene de manos."}, {"q": "Se derrama sangre de un residente en el piso y hay vidrio roto dentro. ¿Cómo recoge el vidrio?", "o": ["Con las manos enguantadas, con cuidado", "Con cepillo y recogedor, pinzas o fórceps", "Con una toalla de papel", "Barriéndolo a la basura común"], "a": 1, "w": "El vidrio roto que pueda estar contaminado nunca se recoge directamente con la mano, ni siquiera con guantes. Use medios mecánicos."}, {"q": "¿Cuánto tiempo debe conservar el empleador sus expedientes médicos y de exposición?", "o": ["Un año", "Tres años", "Durante el empleo más 30 años", "Hasta que usted deje el trabajo"], "a": 2, "w": "Los expedientes médicos y de exposición se guardan durante el empleo más 30 años; los registros de capacitación se guardan 3 años."}, {"q": "Su Plan de Control de Exposición debe revisarse y actualizarse:", "o": ["Solo cuando OSHA inspecciona", "Al menos una vez al año y siempre que las tareas o procedimientos cambien el riesgo de exposición", "Cada cinco años", "Solo después de un incidente de exposición"], "a": 1, "w": "La revisión anual es obligatoria, además de las actualizaciones por tareas y procedimientos nuevos o modificados, incluida la consideración de dispositivos médicos más seguros."}, {"q": "¿Qué empleados deben opinar en la selección de dispositivos médicos más seguros?", "o": ["Solo la gerencia", "Solo quien presida el comité de seguridad", "Los empleados de primera línea, no gerenciales, que usan los dispositivos", "Solo los enfermeros licenciados"], "a": 2, "w": "La Ley de Seguridad y Prevención de Pinchazos exige que se documente la solicitud de opinión de los empleados de primera línea, no gerenciales, responsables del cuidado directo."}, {"q": "¿Dónde deben guardarse las Hojas de Datos de Seguridad?", "o": ["Bajo llave en la oficina del administrador", "Accesibles a los empleados en todo momento durante su turno", "En el almacén del proveedor del químico", "Solo en el cuarto de mantenimiento"], "a": 1, "w": "Las hojas deben estar fácilmente accesibles a los empleados en cada turno. Guardarlas bajo llave es una violación común y citable."}, {"q": "Usted usa un respirador N95 con un residente en precauciones por vía aérea. ¿Qué le debe su empleador?", "o": ["Nada adicional", "Una evaluación médica, prueba de ajuste y capacitación bajo la norma de protección respiratoria", "Solo una mascarilla quirúrgica de respaldo", "Una exoneración firmada"], "a": 1, "w": "Un respirador activa la 29 CFR 1910.134: evaluación médica, prueba de ajuste y capacitación. Una mascarilla quirúrgica no, porque no es un respirador."}, {"q": "¿Con qué frecuencia se exige la capacitación sobre patógenos sanguíneos?", "o": ["Una vez al contratarse", "Al asignarse inicialmente y al menos una vez al año después", "Cada tres años", "Solo después de una exposición"], "a": 1, "w": "La capacitación se exige al asignarse inicialmente, al menos una vez al año, y siempre que cambios en las tareas o procedimientos afecten la exposición ocupacional."}]}, "amsa6": {"body": [{"t": "h", "v": "1. La ley detrás de este curso"}, {"t": "p", "v": "Florida permite que el personal sin licencia de un centro de vida asistida <em>asista</em> a un residente con la autoadministración de medicamentos. Ese permiso es estrecho, condicionado y está definido en tres lugares: las secciones 429.255 y 429.256 de los Estatutos de Florida, y las Reglas 59A-36.008 y 59A-36.011 del Código Administrativo de Florida."}, {"t": "ul", "v": ["La capacitación debe brindarla un enfermero registrado, un enfermero práctico licenciado, un farmacéutico licenciado o un médico.", "El requisito es un <strong>curso inicial de 6 horas</strong> seguido de una <strong>actualización de 2 horas cada año</strong>.", "La finalización debe documentarse en el expediente de personal del empleado, con la fecha, las horas, el tema y el nombre y número de licencia del instructor. Un inspector va a pedir esto.", "La capacitación no lo convierte en enfermero y no amplía su alcance. Autoriza un conjunto específico de actos enumerados y nada más allá de ellos."]}, {"t": "p", "v": "La sección 429.256 también lo protege: una persona sin licencia que asiste con la autoadministración conforme al estatuto no se considera que esté administrando medicamentos, ni ejerciendo la enfermería sin licencia. Esa protección existe solo mientras usted se mantenga dentro de los límites que describe este curso. Si se sale de ellos, la protección desaparece."}, {"t": "h", "v": "2. Tres actividades, tres conjuntos de reglas distintos"}, {"t": "p", "v": "Antes de tocar un medicamento debe saber cuál de tres cosas está haciendo. Confundirlas es la causa más común de violaciones en esta área."}, {"t": "ul", "v": ["<strong>Autoadministración.</strong> El residente toma su propio medicamento de forma independiente. Puede guardarlo en su propia habitación si el centro evaluó que eso es seguro. El personal puede guardarlo de forma central y puede recordarle que es la hora. Nada más se requiere.", "<strong>Asistencia con la autoadministración.</strong> El residente es <em>capaz de entender</em> qué es el medicamento y <em>capaz de indicar</em> que se le dé, pero necesita ayuda física. El personal capacitado sin licencia puede asistir. El residente conserva la decisión.", "<strong>Administración.</strong> El medicamento se da a un residente que no puede dirigir su propio cuidado, o por una vía o método que requiere juicio clínico. Solo un enfermero licenciado, u otro profesional licenciado dentro de su propio alcance, puede administrar."]}, {"t": "p", "v": "La línea divisoria es la capacidad del residente de dirigir el acto, no su capacidad física de realizarlo. Una residente con artritis severa que no puede abrir un frasco pero sabe exactamente qué toma y para qué es candidata para la asistencia. Una residente con demencia avanzada que abre la boca cuando se le ofrece una pastilla pero no puede nombrar ni un medicamento no está siendo asistida; se le está administrando, y eso requiere un enfermero."}, {"t": "h", "v": "3. Cómo juzgar si un residente puede dirigir el acto"}, {"t": "p", "v": "Pregúntese, en ese momento, ese día:"}, {"t": "ul", "v": ["¿Puede la residente reconocer el medicamento, o al menos entender que es su medicamento?", "¿Puede indicar que quiere tomarlo ahora?", "¿Puede decirle, más o menos, para qué es o que un médico lo prescribió?", "¿Puede decirle si algo anda mal — un síntoma nuevo, una reacción, una negativa?"]}, {"t": "p", "v": "La capacidad fluctúa. Una residente puede ser capaz de dirigir sus medicamentos de la mañana y no los de la noche; puede estar bien normalmente y confundida durante una infección. Asista cuando pueda dirigir, y reporte cuando no pueda. No tome la decisión de forma permanente por su cuenta — reporte el cambio para que el enfermero reevalúe. Un residente que de forma constante no puede dirigir puede necesitar una actualización de la evaluación de salud (Formulario AHCA 1823), un cambio en el plan de cuidado, Cuidado Congregado Extendido (ECC) o Servicios de Enfermería Limitados (LNS), o un nivel de cuidado distinto."}, {"t": "h", "v": "4. Derechos del residente que usted no puede pasar por alto"}, {"t": "ul", "v": ["La sección 429.28 garantiza a los residentes trato cortés, privacidad, participación en su propio cuidado y el derecho a negarse.", "<strong>Una negativa debe respetarse.</strong> Puede preguntar por qué, intentar más tarde, ofrecerlo con comida o cambiar el enfoque. No puede insistir, discutir, amenazar ni insinuar consecuencias.", "<strong>Nunca disfrace un medicamento</strong> en comida o bebida sin una orden del médico y un plan de cuidado documentado. Esconder una pastilla en compota de manzana para lograr que la tragüe es administración encubierta, y con un residente que se está negando puede constituir abuso.", "<strong>Nunca use la fuerza.</strong> Abrir una boca a la fuerza, sujetar las manos de alguien o apretarle la nariz es agresión, no cuidado.", "Una negativa persistente es información clínica y debe reportarse — con frecuencia señala dolor al tragar, náusea, un efecto secundario que el residente detesta, depresión, creencias delirantes sobre el medicamento, o un cambio cognitivo nuevo.", "La privacidad también aplica aquí. No anuncie medicamentos en una sala común ni hable de las prescripciones de un residente donde otros puedan oír."]}, {"t": "h", "v": "5. Leer una etiqueta de medicamento"}, {"t": "p", "v": "La etiqueta de la farmacia es su única autoridad. Todo lo que necesita está en ella, y lo que no esté en ella no le corresponde decidirlo. Una etiqueta contiene:"}, {"t": "ul", "v": ["El nombre completo del residente.", "El nombre del medicamento — con frecuencia el genérico y el de marca. Metoprolol y Lopressor son el mismo medicamento; furosemida y Lasix son el mismo medicamento. Nunca suponga que dos frascos con nombres distintos son medicamentos distintos, y nunca suponga que son el mismo.", "La concentración — por ejemplo 25 mg — y la forma: tableta, cápsula, líquido, parche, crema, gotas, inhalador.", "Las indicaciones: cuánto, cada cuánto, por qué vía y cualquier condición como con comida, con el estómago vacío, o a la hora de dormir.", "El nombre del prescriptor, la farmacia, la fecha de surtido, la cantidad, la fecha de vencimiento y el número de surtidos restantes.", "Las calcomanías auxiliares de advertencia — no triturar, tomar con comida, puede causar somnolencia, evitar el sol, agitar bien."]}, {"t": "p", "v": "Indicaciones comunes que verá: <strong>PO</strong> por la boca, <strong>PRN</strong> según necesidad, <strong>BID</strong> dos veces al día, <strong>TID</strong> tres veces al día, <strong>QID</strong> cuatro veces al día, <strong>QD</strong> una vez al día, <strong>HS</strong> a la hora de dormir, <strong>AC</strong> antes de las comidas, <strong>PC</strong> después de las comidas, <strong>SL</strong> sublingual (debajo de la lengua), <strong>GTT</strong> gotas. Si una indicación en una etiqueta no está clara, es ilegible o contradice el registro de medicamentos, <strong>deténgase y pregunte al enfermero</strong>. Nunca interprete."}, {"t": "note", "v": "Si la etiqueta y el registro de medicamentos no coinciden, no asista hasta que una persona licenciada lo resuelva. Una discrepancia significa que uno de los dos está equivocado, y adivinar cuál es la forma en que los residentes sufren daño."}, {"t": "h", "v": "6. Qué incluye la asistencia — los actos permitidos"}, {"t": "p", "v": "La Regla 59A-36.008 enumera qué significa la asistencia con la autoadministración. Después de esta capacitación usted puede:"}, {"t": "ul", "v": ["Tomar el medicamento de donde está guardado y llevarlo al residente.", "En presencia del residente, leer la etiqueta en voz alta y confirmar que el residente es la persona nombrada en ella.", "Sacar una dosis prescrita del envase.", "Colocar la dosis en la mano del residente, o en otro recipiente, y ayudarle a llevarlo a la boca.", "Medir una dosis líquida prescrita tal como indica la etiqueta, usando un dispositivo graduado adecuado — una jeringa oral o un vasito calibrado, nunca una cuchara de cocina.", "Partir una tableta ranurada por su línea de ranura cuando la etiqueta indique media tableta.", "Aplicar un medicamento tópico — crema, ungüento, loción — sobre piel intacta.", "Sostener la mano del residente para gotas oftálmicas u óticas, un inhalador o un atomizador, cuando el residente dirige el acto y la política del centro lo permite.", "Devolver el medicamento al almacenamiento seguro y documentar lo que hizo.", "Pedir y recibir surtidos de la farmacia, y comparar la etiqueta del surtido entregado con el registro."]}, {"t": "h", "v": "7. Qué NO incluye la asistencia — los actos prohibidos"}, {"t": "p", "v": "Estos están fuera de su alcance. Realizarlos es una violación de la regla, puede reportarse a la Junta de Enfermería o a AHCA, y hace perder la protección legal descrita en la sección 1."}, {"t": "ul", "v": ["<strong>Mezclar, preparar, convertir o calcular una dosis.</strong> Medir lo que la etiqueta ya indica está permitido; decidir cuánto no lo está. Si la etiqueta dice 5 mg y el frasco tiene tabletas de 10 mg, usted no la corta — el enfermero o la farmacia lo resuelven.", "<strong>Triturar, partir, disolver o abrir una cápsula</strong> salvo que el medicamento esté ranurado y etiquetado para eso o que una persona licenciada lo haya indicado. Muchas tabletas son de liberación prolongada o con capa entérica, y triturarlas entrega la dosis de todo un día de una sola vez. Eso ha matado personas.", "<strong>Inyecciones de cualquier tipo, incluida la insulina.</strong> Puede entregar una pluma o jeringa precargada, preparada por una persona licenciada, a un residente que se inyecta a sí mismo. Usted no inyecta.", "<strong>Administrar medicamento por vía rectal o vaginal</strong>, incluidos supositorios y enemas.", "<strong>Operar un tratamiento con nebulizador, administrar por sonda de alimentación</strong>, o cualquier vía parenteral o intravenosa.", "<strong>Decidir si un medicamento PRN está justificado.</strong> El residente debe pedirlo y poder decir el síntoma. No puede juzgar que alguien se ve ansioso, agitado o con dolor y dar el medicamento según necesidad por esa razón.", "<strong>Aplicar un medicamento sobre piel lesionada, una herida abierta o una lesión por presión.</strong> Eso es tratamiento.", "<strong>Alterar una etiqueta de farmacia</strong>, escribir sobre ella, tachar algo o reetiquetar un envase. Nunca.", "<strong>Transcribir o cambiar una orden.</strong> Una orden telefónica de un prescriptor la toma una persona licenciada, no usted.", "<strong>Asistir a un residente que se niega, se resiste, está dormido o no puede participar.</strong>", "<strong>Tomar, prestar o compartir medicamento entre residentes</strong>, ni en una emergencia, ni aunque el medicamento y la dosis parezcan idénticos. Eso es desvío."]}, {"t": "h", "v": "8. Los seis correctos y el flujo de trabajo que los hace cumplir"}, {"t": "ul", "v": ["<strong>Residente correcto</strong> — lea el nombre de la etiqueta en voz alta, frente al residente. Nunca se base en una cara, un número de habitación ni en la confirmación de otro residente.", "<strong>Medicamento correcto</strong> — compare la etiqueta con el registro, letra por letra.", "<strong>Dosis correcta</strong> — tal como está impresa. Cuéntela; no la estime.", "<strong>Vía correcta</strong> — por la boca, debajo de la lengua, en la piel, en el ojo. Las gotas oftálmicas y las óticas no son intercambiables.", "<strong>Hora correcta</strong> — dentro del margen que permite su política, normalmente una hora antes a una hora después de la hora programada.", "<strong>Documentación correcta</strong> — en el momento de la asistencia."]}, {"t": "p", "v": "Flujo práctico, en cada pase: lávese las manos. Reúna los medicamentos de un solo residente a la vez — nunca de varios residentes al mismo tiempo. Compare la etiqueta con el registro. Vaya al residente. Salúdela y explíquele. Lea la etiqueta en voz alta y confirme su nombre. Confirme que quiere tomarlo. Saque la dosis sin tocar el medicamento, hacia la tapa o un vasito limpio, y de ahí a su mano o su vasito. Ofrezca un vaso completo de agua salvo que la etiqueta indique lo contrario. Quédese y observe que lo tome. Verifique que lo tragó. Devuelva el medicamento al almacenamiento bajo llave. Documente. Después pase al siguiente residente."}, {"t": "p", "v": "Quédese y observe. Un residente que se guarda, escupe o deja caer una pastilla no la ha tomado, y “se la dejé en la mesa” es a la vez una falsedad en el registro y una falla de seguridad. Un medicamento suelto sobre una mesa también es un peligro para cualquier residente que pase por ahí."}, {"t": "h", "v": "9. Registros y documentación"}, {"t": "ul", "v": ["El registro de observación de medicamentos (MOR) es un documento legal y la evidencia principal de que el cuidado se brindó. Se revisa en cada inspección y en cada demanda.", "Anote en el momento en que asiste — nunca por adelantado, nunca en grupo al final del turno. Anotar una dosis antes de que se tome es falsificación.", "Use tinta, ponga sus iniciales en cada entrada y asegúrese de que sus iniciales y su firma completa aparezcan en la clave.", "<strong>Nunca deje un casillero en blanco.</strong> Use los códigos de su centro y explique al reverso o en las notas: se negó, suspendido por orden, sin medicamento, en una cita, hospitalizado, residente dormido. Un casillero en blanco se lee como una dosis perdida sin explicación.", "Corrija un error trazando una sola línea sobre él, escribiendo la corrección y agregando sus iniciales y la fecha. Nunca borronee, nunca use corrector, nunca escriba encima de una entrada.", "Solo una persona licenciada establece o transcribe el registro a partir de una orden.", "Las sustancias controladas requieren un conteo continuo en un registro aparte, reconciliado al cambio de turno por dos personas donde la política lo exija. Una discrepancia se reporta de inmediato — no al final del turno, no mañana.", "Los registros son información de salud confidencial. HIPAA y la sección 456.057 aplican a cada página."]}, {"t": "h", "v": "10. Almacenamiento, surtidos y desecho"}, {"t": "ul", "v": ["El medicamento de almacenamiento central se guarda en un gabinete, carro o cuarto cerrado con llave, accesible solo al personal autorizado. Las llaves se controlan, no se dejan en un cajón.", "Los medicamentos de cada residente se guardan físicamente separados y en el envase original con etiqueta de la farmacia. Nunca los combine, nunca los transfiera a otro frasco.", "Los medicamentos refrigerados van en un recipiente designado, etiquetado y a prueba de fugas, separado de los alimentos, con la temperatura del refrigerador monitoreada y registrada.", "Guarde en un lugar fresco y seco, lejos de la luz del sol. Un baño es un mal lugar para los medicamentos.", "Revise las fechas de vencimiento cuando manipule un envase. Vencido significa no utilizable, incluidos los artículos multidosis abiertos con fechas de uso más cortas, como la insulina y las gotas oftálmicas.", "Pida los surtidos antes de que a un residente se le acabe el medicamento — una dosis perdida porque el frasco está vacío es un error de medicación prevenible y una deficiencia citable.", "Revise las entregas contra el registro: residente correcto, medicamento correcto, concentración correcta, indicaciones correctas. Reporte cualquier discrepancia al enfermero antes de guardarlo.", "Los medicamentos descontinuados, vencidos y de residentes fallecidos se separan, se resguardan y se desechan según la política del centro, con dos testigos y documentación — incluidas las sustancias controladas, que requieren procedimientos específicos de destrucción."]}, {"t": "h", "v": "11. Clases de medicamentos que verá todos los días"}, {"t": "p", "v": "No necesita ser farmacéutico. Sí necesita reconocer cuándo algo va mal, porque usted es quien ve al residente."}, {"t": "ul", "v": ["<strong>Medicamentos para la presión</strong> — lisinopril, losartán, amlodipino, metoprolol, carvedilol. Vigile mareo al ponerse de pie, caídas, pulso muy lento, desmayos. Una tos seca persistente es un efecto conocido de los medicamentos que terminan en “-pril”.", "<strong>Diuréticos</strong> — furosemida, hidroclorotiazida. Vigile deshidratación, mareo, debilidad, calambres musculares, confusión y caídas camino al baño. Se dan por la mañana por una razón.", "<strong>Anticoagulantes y antiagregantes</strong> — warfarina, apixabán, rivaroxabán, clopidogrel, aspirina. Reporte cualquier moretón inusual, sangrado de encías, sangrado nasal, sangre en la orina o las heces, heces negras y alquitranadas, y <strong>cualquier</strong> caída o golpe en la cabeza, por menor que parezca.", "<strong>Medicamentos para la diabetes</strong> — metformina, glipizida, insulina. Vigile temblores, sudoración, confusión, irritabilidad, habla arrastrada y hambre, que indican azúcar baja. Tenga presente que un residente que se salta una comida pero toma el medicamento corre riesgo real.", "<strong>Analgésicos opioides</strong> — oxicodona, hidrocodona, tramadol, morfina. Vigile somnolencia excesiva, respiración lenta o superficial, confusión y estreñimiento. Son sustancias controladas que requieren conteo.", "<strong>Benzodiacepinas, somníferos y antipsicóticos</strong> — lorazepam, alprazolam, zolpidem, quetiapina, risperidona. Vigile sedación, inestabilidad, caídas, confusión y rigidez o temblor nuevos. Los antipsicóticos en residentes con demencia conllevan riesgos graves y requieren una justificación documentada, no conveniencia.", "<strong>Levotiroxina</strong> — se toma con el estómago vacío, separada del calcio, el hierro y los antiácidos por varias horas.", "<strong>Antibióticos</strong> — el curso completo se termina aunque el residente se sienta mejor. Reporte erupción, diarrea o candidiasis oral.", "<strong>Gotas oftálmicas para el glaucoma</strong> — el horario importa; una dosis perdida puede significar pérdida de visión.", "<strong>Nitroglicerina</strong> — sublingual, para dolor de pecho, según la etiqueta y el plan de cuidado. Un dolor de pecho que no cede es una llamada al 911."]}, {"t": "h", "v": "12. Medicamentos de alto riesgo"}, {"t": "p", "v": "Algunos medicamentos causan daño grave cuando algo sale un poco mal. Vaya despacio con estos y verifique dos veces la etiqueta contra el registro: <strong>warfarina y los anticoagulantes orales más nuevos, insulina, opioides, digoxina, metotrexato, suplementos de potasio, y cualquier medicamento con un margen estrecho entre la dosis terapéutica y la tóxica.</strong> Si algo en la dosis, el envase o la condición del residente le parece raro, deténgase y busque al enfermero antes de asistir, no después."}, {"t": "h", "v": "13. Efectos secundarios, interacciones y polifarmacia"}, {"t": "ul", "v": ["Un <strong>efecto secundario</strong> es una consecuencia conocida, esperada y normalmente tolerable — somnolencia, boca seca, náusea.", "Una <strong>reacción adversa</strong> es dañina y no intencionada y requiere la atención del prescriptor.", "Una <strong>reacción alérgica</strong> involucra el sistema inmunitario: erupción, ronchas, picazón, hinchazón, sibilancias, opresión en la garganta. La hinchazón de la cara, los labios o la lengua, o la dificultad para respirar, es anafilaxia — llame al 911 primero, después avise.", "Una <strong>intolerancia</strong> no es una alergia. El malestar estomacal por un antibiótico no es una alergia a la penicilina, y registrarlo como tal puede privar a un residente de un medicamento importante de por vida. Reporte lo que realmente ocurrió y deje que el enfermero lo clasifique.", "Los adultos mayores metabolizan los medicamentos más despacio, tienen menos agua corporal y son más sensibles a la sedación y a los efectos sobre la presión. Una dosis sin importancia en alguien de 40 años puede causar una caída a los 85.", "Los residentes con muchos medicamentos tienen mayor riesgo de interacciones entre ellos. La warfarina interactúa con las verduras de hoja verde, muchos antibióticos y los antiinflamatorios. El jugo de toronja interactúa con una larga lista de medicamentos. Los antiácidos bloquean la absorción de varios medicamentos.", "<strong>Los productos de venta libre y los suplementos herbales son medicamentos.</strong> Si la hija de un residente trae ibuprofeno, melatonina, hierba de San Juan o aceite de pescado, debe reportarse para que se revise y se agregue al registro. Nada entra a un residente que no esté en el registro."]}, {"t": "h", "v": "14. Oxígeno y otros artículos especiales"}, {"t": "ul", "v": ["El oxígeno es un medicamento prescrito con un flujo ordenado. Usted no cambia los litros por minuto. Reporte un tanque vacío, una línea doblada, un residente que se quita la cánula, o falta de aire nueva.", "Nada de fumar, nada de llama abierta, nada de productos a base de petróleo cerca del oxígeno. Asegure los tanques para que no caigan.", "Parches transdérmicos: verifique que el parche de ayer se retiró antes de poner uno nuevo — los parches duplicados de fentanilo o nitroglicerina son una causa conocida de muerte. Rote los sitios y anote la fecha y la hora en el parche si la política lo exige.", "Las plumas y los frascos de insulina pertenecen a un solo residente y están etiquetados con su nombre. Compartir una pluma de insulina entre residentes ha causado brotes de hepatitis."]}, {"t": "h", "v": "15. Cuando algo sale mal"}, {"t": "p", "v": "Un error de medicación es cualquier desviación de la orden: residente equivocado, medicamento equivocado, dosis equivocada, vía equivocada, hora equivocada o una dosis omitida. Un cuasi error — un error que usted detectó antes de que llegara al residente — también se reporta, porque muestra dónde el sistema está débil."}, {"t": "ul", "v": ["Quédese con el residente. Mírelo: respiración, color, estado de alerta, molestias.", "Avise a su supervisor y al enfermero del centro de inmediato. “Se ve bien” no es una evaluación que usted esté calificado para hacer.", "El enfermero o el supervisor contacta al prescriptor, y al Centro de Control de Envenenamiento al <strong>1-800-222-1222</strong> si corresponde.", "Llame al 911 ante cualquier señal grave: dificultad para respirar, hinchazón de la cara o la garganta, dolor de pecho, falta de respuesta, convulsión, o un cambio súbito en el nivel de conciencia.", "Documente de forma objetiva: qué estaba ordenado, qué pasó, qué observó, a quién avisó y cuándo. Complete un reporte de incidente.", "Nunca altere un registro después del hecho, nunca anote una dosis que no se tomó y nunca oculte un error. Ocultarlo convierte un error manejable en un despido, una acción disciplinaria y una posible exposición penal.", "La sospecha de desvío — sustancias controladas faltantes, un conteo que no cuadra, un residente que reporta dolor no aliviado a pesar de dosis documentadas — se reporta de inmediato."]}, {"t": "note", "v": "La mayoría de los errores de medicación vienen de condiciones del sistema, no de malas personas: interrupciones, nombres parecidos, prisa, falta de personal, mala iluminación, registros ilegibles. Reporte las condiciones además de los eventos. Así se previene el siguiente error."}, {"t": "h", "v": "16. Qué reportar sobre el residente"}, {"t": "p", "v": "Usted ve a los residentes con más frecuencia que cualquier enfermero o médico. Reporte el mismo día:"}, {"t": "ul", "v": ["Confusión, somnolencia o un cambio en el estado de alerta nuevos.", "Una caída, inestabilidad o mareo nuevo.", "Dolor nuevo o que empeora, o dolor que un medicamento ya no alivia.", "Náusea, vómito, diarrea, estreñimiento o pérdida del apetito.", "Erupción, picazón, hinchazón o dificultad para respirar.", "Moretones o sangrado, especialmente con un anticoagulante.", "Dificultad para tragar, o pastillas encontradas en la boca o en la habitación.", "Negativas, o un residente que de pronto no puede identificar sus medicamentos.", "Cualquier residente que pida más de algo, o que parezca estar quedándose sin medicamento antes de tiempo."]}, {"t": "h", "v": "17. Reporte obligatorio"}, {"t": "p", "v": "Bajo la ley de Florida, toda persona es un reportante obligatorio de sospecha de abuso, negligencia o explotación de un adulto vulnerable. Retener un medicamento prescrito, dar medicamento de forma encubierta o por la fuerza, falsificar un registro de medicamentos y desviar las sustancias controladas de un residente son todos reportables. La Línea de Abuso de Florida es <strong>1-800-96-ABUSE (1-800-962-2873)</strong>. Reportar no exige certeza, no requiere el permiso de su supervisor y está protegido contra represalias."}, {"t": "h", "v": "18. Casos aplicados"}, {"t": "ul", "v": ["<em>La etiqueta de una residente dice tomar media tableta y la tableta está ranurada.</em> Puede partirla por la ranura. Si no estuviera ranurada, no lo haría.", "<em>Una residente con demencia abre la boca cuando le acerca el vasito pero no puede nombrar nada de lo que toma.</em> Esto es administración. Repórtelo; no proceda.", "<em>Una hija le entrega un frasco de melatonina y le pide que se la dé a la hora de dormir.</em> Nada llega a un residente sin una orden en el registro. Entrégueselo al enfermero.", "<em>Nota que el MOR dice metoprolol 25 mg y el frasco dice 50 mg.</em> No asista. Busque al enfermero antes de que pase la hora programada.", "<em>Una residente dice que la pastilla la hace sentir mal y se niega.</em> Respete la negativa, documéntela, repórtela.", "<em>Lo interrumpen a media entrega por un timbre de llamada.</em> Asegure el medicamento primero. Un vasito de pastillas sin vigilancia es a la vez un error esperando ocurrir y un peligro para otro residente.", "<em>A las 3 PM se da cuenta de que una dosis del mediodía nunca se dio.</em> Reporte de inmediato, documente la omisión y deje que el enfermero decida si la dosis todavía se da.", "<em>Una residente toma warfarina y tiene una caída leve sin lesión visible.</em> Repórtelo y asegúrese de que sea evaluada. El riesgo es el sangrado tardío por el anticoagulante, no el moretón que usted puede ver."]}], "quiz": [{"q": "¿Cuáles son los requisitos de capacitación para asistir con la autoadministración de medicamentos en un ALF de Florida?", "o": ["Un curso de 2 horas, una sola vez", "Un curso inicial de 6 horas y una actualización de 2 horas cada año", "Un curso de 8 horas cada tres años", "Ninguna capacitación si hay un enfermero de guardia"], "a": 1, "w": "Florida exige un curso inicial de 6 horas seguido de una actualización anual de 2 horas, impartida por un RN, LPN, farmacéutico licenciado o médico."}, {"q": "¿Qué determina si un residente puede recibir asistencia en lugar de administración?", "o": ["Si puede abrir el frasco físicamente", "Si es capaz de entender el medicamento e indicar que se le dé", "Su edad", "Si la familia da su consentimiento"], "a": 1, "w": "La línea divisoria es la capacidad de dirigir el acto. La limitación física es precisamente para lo que existe la asistencia; no poder dirigir significa que un enfermero debe administrar."}, {"q": "La etiqueta de un residente dice 5 mg y el frasco contiene tabletas de 10 mg sin ranura. ¿Qué hace?", "o": ["Partirla lo más parejo que pueda", "Dar la tableta completa", "No asistir — avisar al enfermero para que la farmacia o el prescriptor lo resuelvan", "Triturarla y dar la mitad del polvo"], "a": 2, "w": "Partir una tableta sin ranura es alterar una dosis, lo cual está fuera de su alcance. El enfermero o la farmacia corrigen la discrepancia."}, {"q": "¿Cuál acto está permitido al personal capacitado sin licencia?", "o": ["Inyectar insulina en el abdomen", "Medir 10 mL de líquido como indica la etiqueta con una jeringa oral", "Insertar un supositorio rectal", "Dar el lorazepam PRN porque un residente parece agitado"], "a": 1, "w": "Medir una dosis que la etiqueta ya especifica está permitido. Las inyecciones, la vía rectal y juzgar si un PRN corresponde no lo están."}, {"q": "¿Por qué nunca debe triturar una tableta de liberación prolongada sin indicación?", "o": ["Sabe mal", "Destruye el mecanismo de liberación y entrega la dosis de todo un día de una sola vez", "Anula la garantía de la farmacia", "Solo importa con los antibióticos"], "a": 1, "w": "Triturar productos de liberación prolongada o con capa entérica libera la dosis completa de inmediato, lo que ha causado sobredosis fatales."}, {"q": "Una residente se niega a su medicamento de la noche por tercera vez. ¿Qué es correcto?", "o": ["Esconderlo en su postre", "Insistir hasta que lo tome", "Respetar la negativa, documentarla y reportar el patrón al enfermero", "Anotarlo como dado para que el registro quede limpio"], "a": 2, "w": "La negativa debe respetarse. La administración encubierta sin una orden es abuso, y una negativa repetida es información clínica que hay que reportar."}, {"q": "¿Qué se anota en el registro cuando una dosis no se toma?", "o": ["Dejar el casillero en blanco", "Poner las iniciales como dado", "Usar el código del centro y documentar la razón y el aviso", "Escribir 'incumplidor' sin detalle"], "a": 2, "w": "Nunca deje un casillero en blanco ni anote una dosis no tomada. Marque la entrada con el código, explique la razón y avise según la política."}, {"q": "¿Cuándo debe documentar que asistió con un medicamento?", "o": ["En el momento en que asiste", "Al inicio del turno, para todo el turno", "Al final del turno, de memoria", "Cuando el enfermero se lo pida"], "a": 0, "w": "La documentación se hace en el momento de la asistencia. Anotar por adelantado es falsificación; hacerlo todo al final del turno produce errores."}, {"q": "Una residente que toma warfarina tiene una caída leve sin lesión visible. ¿Qué debe hacer?", "o": ["Nada, porque no hay lesión", "Aplicar hielo y revisarla mañana", "Reportarlo y asegurarse de que sea evaluada", "Reportarlo solo si se queja de dolor"], "a": 2, "w": "La anticoagulación hace que el sangrado interno tardío sea un riesgo real. Cualquier caída o golpe en la cabeza con un anticoagulante requiere evaluación, se vea como se vea."}, {"q": "¿Cómo se debe hacer una corrección en un registro de medicamentos?", "o": ["Usar corrector", "Borronear la entrada", "Una sola línea encima, escribir la corrección, agregar iniciales y fecha", "Reescribir toda la página"], "a": 2, "w": "Una sola línea, la corrección, sus iniciales y la fecha preservan la entrada original. Borrar por completo una entrada parece encubrimiento."}, {"q": "La hija de una residente trae ibuprofeno y le pide que lo guarde en la habitación de su mamá para los dolores. ¿Qué hace?", "o": ["Ponerlo en la mesa de noche", "Darlo según necesidad", "Reportarlo al enfermero — nada llega a un residente sin estar en el registro", "Agregarlo usted mismo al registro de medicamentos"], "a": 2, "w": "Los productos de venta libre son medicamentos. Deben revisarse y ordenarse antes de usarse, y solo una persona licenciada agrega algo al registro."}, {"q": "¿Cuál conjunto de síntomas sugiere azúcar baja en una residente que toma glipizida?", "o": ["Sed y orinar con frecuencia", "Temblores, sudoración, confusión e irritabilidad", "Tos seca y erupción", "Estreñimiento y somnolencia"], "a": 1, "w": "Temblores, sudoración, palidez, confusión, irritabilidad, habla arrastrada y hambre indican hipoglucemia, sobre todo si se saltó una comida."}, {"q": "Está a media entrega de medicamentos y suena un timbre de llamada. ¿Qué hace con el medicamento?", "o": ["Dejar el vasito en la mesa del residente", "Asegurar el medicamento antes de responder", "Dárselo a otro residente para que lo sostenga", "Guardarlo en el bolsillo"], "a": 1, "w": "El medicamento sin vigilancia es un riesgo de error y un peligro para otros residentes. Asegúrelo primero."}, {"q": "¿Cuál de estos es un medicamento de alto riesgo que exige cuidado adicional?", "o": ["Un multivitamínico", "Warfarina", "Lágrimas artificiales", "Acetaminofén de 325 mg"], "a": 1, "w": "La warfarina, la insulina, los opioides, la digoxina, el metotrexato y el potasio son de alto riesgo: errores pequeños causan daño grave."}, {"q": "Una residente dice que un antibiótico le causó malestar estomacal hace años. ¿Cómo debe registrarse eso?", "o": ["Como alergia a la penicilina", "Reportar exactamente qué ocurrió y dejar que el enfermero lo clasifique", "Como que no hubo ninguna reacción", "Decirle que evite todos los antibióticos"], "a": 1, "w": "El malestar estomacal es una intolerancia, no una alergia. Etiquetarlo mal como alergia puede privarla de un medicamento importante de por vida."}, {"q": "¿Qué se requiere para los medicamentos de almacenamiento central?", "o": ["Un gabinete o carro cerrado con llave, accesible solo al personal autorizado, con los medicamentos de cada residente separados y en sus envases originales etiquetados", "Un solo recipiente compartido ordenado por hora del día", "Almacenamiento en el comedor por comodidad", "Almacenamiento con los alimentos refrigerados para ahorrar espacio"], "a": 0, "w": "Los medicamentos deben estar resguardados, separados por residente y en sus envases originales con etiqueta de farmacia. Los refrigerados van en un recipiente separado y etiquetado, no con la comida."}, {"q": "Toca poner un parche transdérmico. ¿Qué debe verificar primero?", "o": ["Nada — solo aplicarlo", "Que el parche anterior se haya retirado", "Que combine con el color de la camisa del residente", "Que se aplique sobre el anterior para mejor absorción"], "a": 1, "w": "Los parches duplicados de fentanilo o nitroglicerina han causado muertes. Confirme que se retiró el parche anterior y rote el sitio."}, {"q": "Una residente tiene falta de aire y se le hinchan los labios poco después de un medicamento nuevo. ¿Cuál es su primera acción?", "o": ["Documentarlo y avisar al siguiente turno", "Llamar al 911 y quedarse con ella, después avisar a su supervisor", "Buscar el medicamento en internet", "Darle agua y esperar"], "a": 1, "w": "La hinchazón facial o de la garganta con dificultad para respirar es anafilaxia. Llame al 911 primero, quédese con ella, luego avise y documente."}, {"q": "El conteo de sustancias controladas no cuadra al cambio de turno. ¿Cuándo lo reporta?", "o": ["Al final del turno", "De inmediato", "Solo si pasa dos veces", "Solo si un residente se queja"], "a": 1, "w": "Una discrepancia de sustancias controladas se reporta de inmediato. La demora hace más difícil rastrear un desvío y lo implica a usted."}, {"q": "Bajo la ley de Florida, ¿quién es reportante obligatorio de sospecha de abuso o negligencia de un residente?", "o": ["Solo los enfermeros licenciados", "Solo el administrador", "Toda persona, sin requisito de certeza ni de aprobación del supervisor", "Solo el personal que lo presenció directamente"], "a": 2, "w": "Florida hace de toda persona un reportante obligatorio. La Línea de Abuso es 1-800-96-ABUSE, y el reporte de buena fe está protegido contra represalias."}]}}}</script>

/* BRAND: paste your logo as a data URI (or a same-folder file name if you host this

const esPack  = c => (lang === "es" && ES.courses ? ES.courses[c.id] : null);
const CBODY   = c => { const e = esPack(c); return (e && e.body) ? e.body : c.body; };
const CQUIZ   = c => { const e = esPack(c); return (e && e.quiz) ? e.quiz : c.quiz; };
const translated = c => { const e = esPack(c); return !!(e && e.body); };
