ization if family asks", "Specific written authorization for HIV information", "Only the administrator's approval"], "a": 2, "w": "Section 381.004 requires specific written authorization. A general medical release does not cover HIV information."}, {"q": "A visitor overhears part of a quiet conversation between you and the nurse at the medication cart. This is:", "o": ["An automatic reportable breach", "Likely an incidental disclosure, permitted if reasonable safeguards were in place", "Grounds for immediate termination", "Never a concern"], "a": 1, "w": "Incidental disclosures that occur despite reasonable safeguards are permitted. The test is whether reasonable precautions were taken."}, {"q": "Which is a technical safeguard under the Security Rule?", "o": ["Locking the file room", "Staff training", "Unique user IDs, automatic logoff, and encryption", "Posting the Notice of Privacy Practices"], "a": 2, "w": "Unique identification, automatic logoff, encryption, and audit controls are technical safeguards. Locked storage is physical; training is administrative."}, {"q": "You accidentally email a resident's care plan to the wrong address. What should you do?", "o": ["Delete the sent message and say nothing", "Report it to your supervisor or privacy officer immediately", "Wait to see if anyone responds", "Ask the recipient to delete it and consider it resolved"], "a": 1, "w": "Report immediately. The breach clock starts at discovery, and self-reported errors are handled far better than concealed ones. Retaliation for good-faith reporting is itself a violation."}], "group": "alf", "skills": false}, {"id": "cpr", "group": "bls", "skills": true, "title": "CPR — Adult, Child and Infant", "short": "CPR", "hours": 2, "certPre": "has completed 2 contact hrs. of cardiopulmonary resuscitation instruction for adults, children and infants, including written examination and hands-on skills demonstration verified by the instructor", "certTitle": ["Cardiopulmonary Resuscitation (CPR)"], "certNote": "Documents course attendance and instructor-verified skills. Not an American Heart Association course completion card.", "blurb": "High-quality compressions, rescue breaths, and the chain of survival for every age group.", "body": [{"t": "h", "v": "1. Why compressions decide the outcome"}, {"t": "p", "v": "Cardiac arrest means the heart has stopped moving blood. Brain cells begin dying within minutes, and survival falls roughly seven to ten percent for every minute that passes without CPR. Bystander CPR can double or triple survival. Nothing else you learn in this course matters as much as pushing hard, pushing fast, and not stopping."}, {"t": "p", "v": "The adult out-of-hospital chain of survival: recognize the arrest and activate emergency response, begin immediate high-quality CPR, use a defibrillator as soon as one is available, provide advanced resuscitation, deliver post-arrest care, and support recovery. For infants and children the chain begins earlier, with prevention, because most pediatric arrests start as a breathing problem rather than a heart rhythm problem."}, {"t": "h", "v": "2. Recognizing cardiac arrest"}, {"t": "ul", "v": ["Check for responsiveness — tap and shout. In a resident, use their name.", "Scan for normal breathing for no more than 10 seconds while you check for a pulse if you are trained to do so.", "<strong>Agonal gasping is not breathing.</strong> Occasional noisy gasps, snoring, or gurgling sounds in an unresponsive person mean cardiac arrest. This is the single most common reason CPR is delayed.", "If the person is unresponsive and not breathing normally, they are in cardiac arrest. Act. You will not hurt someone who does not need CPR nearly as much as you will hurt someone who needed it and did not get it."]}, {"t": "h", "v": "3. Getting help"}, {"t": "ul", "v": ["Alone with a phone: put it on speaker, call 911, and start compressions. Do not leave to find a phone.", "Alone without a phone and an adult collapses: activate emergency response first, get the AED if it is nearby, then start CPR.", "Alone with an unwitnessed infant or child collapse: give about two minutes of CPR first, then call 911 and get the AED — because the cause is usually respiratory and early ventilation and compressions matter most.", "In a facility: send a specific person. “You, in the blue shirt, call 911 and bring the AED from the front lobby” works. “Somebody call 911” does not."]}, {"t": "h", "v": "4. High-quality compressions"}, {"t": "ul", "v": ["<strong>Position</strong> — center of the chest, lower half of the sternum. Adults: heel of one hand with the second hand on top, arms straight, shoulders directly over the hands. Children: one or two hands depending on size. Infants: two fingers just below the nipple line, or two thumbs encircling the chest if two rescuers are present.", "<strong>Rate</strong> — 100 to 120 compressions per minute, all ages. Faster is not better; above 120 the chest does not refill.", "<strong>Depth</strong> — at least 2 inches (5 cm) in an adult and no more than 2.4 inches. About one third of the chest depth in a child, roughly 2 inches, and about 1.5 inches in an infant.", "<strong>Full recoil</strong> — let the chest come all the way back up between compressions. Leaning on the chest is the most common technique error and it is what stops blood from returning to the heart.", "<strong>Minimize interruptions</strong> — keep any pause under 10 seconds. Aim to be compressing more than 60 percent of the time.", "<strong>Surface</strong> — firm and flat. Move the resident off a soft mattress to the floor if you can do it quickly, or use a backboard.", "<strong>Switch rescuers every 2 minutes</strong>, or sooner if you tire, and make the swap in under 5 seconds. Compression quality falls measurably within a minute or two even when you do not feel tired."]}, {"t": "h", "v": "5. Rescue breaths and ratios"}, {"t": "ul", "v": ["Open the airway with a head tilt–chin lift. If trauma is suspected, use a jaw thrust.", "Each breath lasts about one second and is just enough to make the chest visibly rise. Over-ventilating pushes air into the stomach, causes vomiting, and raises pressure in the chest so that less blood returns to the heart.", "<strong>Adult, one or two rescuers: 30 compressions to 2 breaths.</strong>", "<strong>Child or infant, one rescuer: 30 to 2. Two rescuers: 15 to 2.</strong>", "Use a barrier device — pocket mask or bag-mask — whenever one is available. In a facility it always should be.", "Compression-only CPR is acceptable and strongly encouraged for an untrained or unwilling rescuer with an adult collapse. For infants, children, drowning, and drug overdose, breaths matter, because the problem started with oxygen."]}, {"t": "h", "v": "6. Choking"}, {"t": "ul", "v": ["<strong>Mild obstruction</strong> — the person can cough, speak, or make sound. Stand by and encourage coughing. Do not intervene.", "<strong>Severe obstruction in a responsive adult or child</strong> — silence, clutching the throat, no air movement. Ask “are you choking?”, then give abdominal thrusts just above the navel. Use chest thrusts instead for a pregnant person or someone too large to reach around.", "<strong>Responsive infant</strong> — alternate 5 back slaps and 5 chest thrusts, supporting the head and neck, face down along your forearm.", "<strong>If they go unresponsive</strong> — lower them to the ground and begin CPR. Look in the mouth each time you open the airway for breaths and remove an object only if you can see it. Never sweep blindly.", "Anyone who receives abdominal thrusts should be medically evaluated."]}, {"t": "h", "v": "7. Special situations in residential care"}, {"t": "ul", "v": ["<strong>Check for a DNRO before beginning.</strong> A valid Florida DH 1896 on yellow paper means no CPR. No form immediately available means start CPR.", "Dentures usually stay in place; they help a mask seal. Remove them only if they are loose and obstructing.", "An implanted pacemaker or defibrillator does not change compressions; place AED pads at least one inch away from the device.", "Ribs can fracture during correct CPR, particularly in older adults. That is an accepted consequence, not a reason to compress shallowly.", "Vomiting is common. Turn the person as a unit, clear the mouth, and resume.", "Stop only when the person shows clear signs of life, an AED tells you to stand clear, EMS takes over, or you are physically unable to continue."]}, {"t": "note", "v": "After any resuscitation, document the time of collapse, when compressions began, what was done, and who was notified. Debriefing matters too: this work is hard on the people who do it, and your facility should offer support."}], "quiz": [{"q": "A resident is unresponsive and making occasional loud gasping sounds. What does this mean?", "o": ["He is breathing, so monitor him", "This is agonal gasping — treat it as cardiac arrest and start CPR", "Roll him on his side and wait", "Give rescue breaths only"], "a": 1, "w": "Agonal gasps are not effective breathing. An unresponsive person with gasping is in cardiac arrest, and mistaking gasps for breathing is the most common cause of delayed CPR."}, {"q": "What is the correct compression rate for all ages?", "o": ["60 to 80 per minute", "80 to 100 per minute", "100 to 120 per minute", "As fast as possible"], "a": 2, "w": "100 to 120 per minute for adults, children, and infants. Above 120 the chest cannot refill between compressions."}, {"q": "How deep should adult compressions be?", "o": ["About 1 inch", "At least 2 inches and no more than 2.4 inches", "At least 3 inches", "Whatever feels comfortable"], "a": 1, "w": "At least 2 inches (5 cm), not exceeding 2.4 inches. About one third of chest depth in children (roughly 2 inches) and 1.5 inches in infants."}, {"q": "Two rescuers are giving CPR to a 4-year-old. What compression-to-ventilation ratio should they use?", "o": ["30 to 2", "15 to 2", "5 to 1", "Compressions only"], "a": 1, "w": "Two-rescuer child and infant CPR uses 15 to 2. A single rescuer uses 30 to 2 for all ages."}, {"q": "What is the most common compression technique error?", "o": ["Compressing too fast", "Leaning on the chest and not allowing full recoil", "Standing on the wrong side", "Using two hands on a child"], "a": 1, "w": "Incomplete chest recoil prevents blood from returning to the heart. Let the chest come all the way back up between compressions."}, {"q": "You are alone with an unresponsive adult resident and you have your phone. What do you do?", "o": ["Leave to find help", "Put the phone on speaker, call 911, and start compressions", "Give two minutes of CPR before calling", "Look for the nurse first"], "a": 1, "w": "For an adult, activate emergency response immediately — speakerphone lets you do both — and begin compressions without delay."}, {"q": "How often should rescuers switch during CPR, and how long should the switch take?", "o": ["Every 10 minutes, taking as long as needed", "Every 2 minutes, in under 5 seconds", "Only when exhausted", "Never — switching interrupts CPR"], "a": 1, "w": "Switch about every 2 minutes and keep the changeover under 5 seconds. Compression quality declines within the first couple of minutes."}, {"q": "A responsive resident is clutching her throat and cannot make any sound. What do you do?", "o": ["Encourage her to cough", "Give abdominal thrusts above the navel", "Give a blind finger sweep", "Lay her down and start compressions"], "a": 1, "w": "Silence and no air movement mean severe obstruction. Give abdominal thrusts; use chest thrusts if she is pregnant or too large to reach around."}, {"q": "How long should each rescue breath take, and how much volume?", "o": ["Two seconds, as much as possible", "About one second, just enough for visible chest rise", "Three quick puffs", "Until you feel resistance"], "a": 1, "w": "One second per breath, enough to see the chest rise. Over-ventilation causes gastric inflation, vomiting, and reduced blood return to the heart."}, {"q": "You find a resident in cardiac arrest and no DNRO is immediately available. What do you do?", "o": ["Wait until the chart is located", "Start CPR and activate 911", "Assume he is a DNR because of his age", "Ask family first"], "a": 1, "w": "The default is always to resuscitate. CPR is withheld only when a valid DNRO is immediately confirmed."}]}, {"id": "aed", "group": "bls", "skills": true, "title": "Automated External Defibrillator (AED)", "short": "AED / Defibrillator", "hours": 1, "certPre": "has completed 1 contact hr. of automated external defibrillator instruction, including written examination and hands-on skills demonstration verified by the instructor", "certTitle": ["Automated External Defibrillator (AED)"], "certNote": "Documents course attendance and instructor-verified skills. Not an American Heart Association course completion card.", "blurb": "Operating an AED safely, pad placement, and the situations that change what you do.", "body": [{"t": "h", "v": "1. What defibrillation does"}, {"t": "p", "v": "Most sudden cardiac arrest in adults begins with a disorganized electrical rhythm — ventricular fibrillation or pulseless ventricular tachycardia. The heart muscle is quivering rather than pumping. A defibrillator delivers a shock that stops all electrical activity for an instant so the heart's own pacemaker can restart an organized rhythm. CPR keeps the brain and heart perfused until that shock arrives; the shock is what restores a rhythm."}, {"t": "p", "v": "Time is everything. Survival from a shockable arrest is highest in the first few minutes and falls roughly seven to ten percent per minute. An AED used within three to five minutes of collapse, together with immediate CPR, produces survival rates as high as fifty to seventy percent. After ten minutes, survival is rare."}, {"t": "h", "v": "2. Using an AED — the sequence"}, {"t": "ul", "v": ["<strong>Turn it on.</strong> Some units power on when you open the lid. Then do what the device says; every AED talks you through it.", "<strong>Bare the chest.</strong> Cut or tear away clothing, including a bra with an underwire. Dry the chest if it is wet.", "<strong>Attach the pads</strong> to bare skin: one below the right collarbone, one on the left side of the chest below and to the side of the left nipple, on the ribs. Pad diagrams are printed on the pads.", "<strong>Clear everyone</strong> while it analyzes. Nobody touches the person, including you. Say it out loud and look.", "<strong>Shock if advised.</strong> Confirm everyone is clear, press the button, or, on a fully automatic unit, stay clear while it delivers.", "<strong>Resume compressions immediately</strong> after the shock — do not stop to check a pulse. Continue CPR for two minutes until the AED prompts the next analysis.", "If no shock is advised, resume CPR immediately. “No shock advised” does not mean the person is fine.", "<strong>Leave the pads on and the AED attached</strong> until EMS takes over."]}, {"t": "h", "v": "3. Pad placement variations"}, {"t": "ul", "v": ["<strong>Children under 8 or under about 55 pounds</strong> — use pediatric pads or a pediatric setting if the unit has one. If it does not, <strong>use adult pads rather than no defibrillation</strong>. Place them so they do not touch or overlap; front and back placement works.", "<strong>Infants</strong> — a manual defibrillator is preferred, then an AED with a dose attenuator, then a standard AED. Never withhold a shock for lack of pediatric equipment.", "<strong>Implanted pacemaker or defibrillator</strong> — visible as a hard lump, usually under the left collarbone. Place the pad at least one inch away from it.", "<strong>Medication patch</strong> — remove it with a gloved hand and wipe the skin before placing a pad over that area. A nitroglycerin patch can arc and burn.", "<strong>Very hairy chest</strong> — press the pads down firmly. If the unit says to check pads, pull the pads off sharply to remove hair and apply the spare set.", "<strong>Breast tissue</strong> — place the left pad lateral to or beneath the breast, on the chest wall, not on the breast itself."]}, {"t": "h", "v": "4. Safety situations"}, {"t": "ul", "v": ["<strong>Water</strong> — move the person out of standing water and dry the chest. A small amount of sweat or rain is not a reason to delay. Snow and a damp surface are safe.", "<strong>Metal surfaces</strong> — the person may lie on metal; just ensure nobody is touching them.", "<strong>Oxygen</strong> — move a mask or nasal cannula at least three to four feet away from the chest before shocking, because of fire risk.", "<strong>Pregnancy</strong> — defibrillate normally. Saving the mother is how you save the fetus.", "<strong>Trauma or visible jewelry</strong> — avoid placing pads over metal jewelry, but do not waste time removing necklaces.", "The AED will not shock someone who does not need a shock. It analyzes the rhythm and refuses if the rhythm is not shockable."]}, {"t": "h", "v": "5. Keeping the AED ready"}, {"t": "ul", "v": ["Check the status indicator on schedule, usually weekly, and document it. A green light or check mark means ready; a chirp or red light means service it now.", "Track the expiration dates on pads and battery. Expired adhesive pads do not conduct reliably.", "Keep a spare set of pads, a razor, trauma shears, a towel, and gloves with the unit.", "Know where every AED in the building is without having to think about it, and make sure it is unlocked and unobstructed.", "After any use, replace the pads, check the battery, and report the event so the data can be downloaded for the EMS and medical review."]}, {"t": "note", "v": "Florida's Good Samaritan Act and Cardiac Arrest Survival Act provide immunity protections for lay rescuers who use an AED in good faith. Hesitation is a greater legal and human risk than acting."}], "quiz": [{"q": "Immediately after the AED delivers a shock, what do you do?", "o": ["Check for a pulse", "Resume chest compressions right away", "Wait for the AED to reanalyze", "Remove the pads"], "a": 1, "w": "Resume compressions immediately without a pulse check. The AED will prompt the next analysis after about two minutes of CPR."}, {"q": "Where do the adult AED pads go?", "o": ["Both on the left side of the chest", "Below the right collarbone and on the left chest below and lateral to the nipple", "On the back only", "Over the stomach and the neck"], "a": 1, "w": "One pad below the right collarbone, the other on the lower left chest wall, lateral to the nipple. Diagrams are printed on the pads."}, {"q": "A 5-year-old is in cardiac arrest and only adult pads are available. What do you do?", "o": ["Do not use the AED", "Use the adult pads, positioned so they do not overlap", "Cut the adult pads in half", "Wait for EMS to bring pediatric pads"], "a": 1, "w": "Never withhold defibrillation for lack of pediatric equipment. Use adult pads without letting them touch each other; front-and-back placement works."}, {"q": "The AED says 'no shock advised.' What does that mean?", "o": ["The person has recovered", "Stop CPR", "The rhythm is not shockable — resume CPR immediately", "The machine is broken"], "a": 2, "w": "A non-shockable rhythm still requires CPR. Resume compressions at once and let the AED reanalyze on its schedule."}, {"q": "A resident in arrest has a nitroglycerin patch where a pad needs to go. What do you do?", "o": ["Place the pad directly over the patch", "Remove the patch with a gloved hand, wipe the skin, then place the pad", "Skip that pad", "Do not use the AED"], "a": 1, "w": "A medication patch can arc, burn the skin, and block energy delivery. Remove it, wipe the area, then apply the pad."}, {"q": "A resident collapses in a bathroom with water on the floor. What is correct?", "o": ["Never use an AED near water", "Move him out of standing water, dry the chest, then defibrillate", "Shock him where he lies", "Wait for the floor to dry"], "a": 1, "w": "Move the person clear of standing water and dry the chest. A little sweat or rain is not a reason to delay."}, {"q": "Oxygen is running by mask when the AED advises a shock. What must you do?", "o": ["Leave it in place", "Move the oxygen at least three to four feet from the chest", "Turn the flow up", "Nothing — oxygen is not a concern"], "a": 1, "w": "Free-flowing oxygen near the pads is a fire hazard during a shock. Move the delivery device several feet away before shocking."}, {"q": "A resident has an implanted defibrillator under the left collarbone. How does that change pad placement?", "o": ["Do not defibrillate", "Place the pad at least one inch away from the device", "Place the pad directly over the device", "Only use pediatric pads"], "a": 1, "w": "Keep the pad about an inch clear of an implanted device so energy is not shunted through it, then defibrillate normally."}]}, {"id": "firstaid", "group": "bls", "skills": true, "title": "First Aid", "short": "First Aid", "hours": 2, "certPre": "has completed 2 contact hrs. of first aid instruction, including written examination and hands-on skills demonstration verified by the instructor", "certTitle": ["First Aid"], "certNote": "Documents course attendance and instructor-verified skills. Not an American Heart Association course completion card.", "blurb": "Bleeding, falls, burns, stroke, seizures, diabetic emergencies, allergic reactions, and when to call 911.", "body": [{"t": "h", "v": "1. Before you touch anyone"}, {"t": "ul", "v": ["<strong>Scene safety first.</strong> You cannot help from the floor. Look for spills, electricity, fire, an aggressive person, traffic.", "<strong>Standard precautions.</strong> Gloves every time, eye protection if blood may splash, hand hygiene after.", "<strong>Get help early.</strong> In a facility, send a named person for the nurse and the emergency kit. Call 911 for anything you are unsure about; nobody is ever criticized for calling.", "<strong>Do not move someone</strong> unless they are in danger where they are, or you must move them to provide care.", "<strong>Stay with them and keep talking</strong>, even if they cannot answer. Then document what you saw and did."]}, {"t": "p", "v": "Call 911 without hesitating for: unresponsiveness, difficulty breathing, chest pain or pressure, signs of stroke, uncontrolled bleeding, a seizure lasting more than five minutes or a first-ever seizure, a serious burn, a suspected broken hip or spine injury, a severe allergic reaction, or any head injury with confusion, vomiting, or blood thinners on board."}, {"t": "h", "v": "2. Bleeding"}, {"t": "ul", "v": ["Apply firm direct pressure with a gloved hand and a clean dressing, right on the wound.", "Do not lift the dressing to look. Add layers on top and keep pressing.", "If bleeding is life-threatening and will not stop from a limb, apply a tourniquet high and tight above the wound, tighten until bleeding stops, and write the time. A tourniquet hurts; that is expected.", "Do not remove an impaled object. Stabilize it in place and pad around it.", "A nosebleed: sit upright, lean slightly forward, pinch the soft part of the nose for 10 to 15 minutes without releasing to check. Leaning back sends blood into the stomach.", "Residents on anticoagulants bleed far longer from minor wounds. Escalate early."]}, {"t": "h", "v": "3. Falls, bones, and head injury"}, {"t": "ul", "v": ["Do not lift a fallen resident until they have been assessed. Ask what happened and whether anything hurts; look for a shortened or outwardly rotated leg, which suggests a hip fracture.", "Keep them still and warm, support the injury in the position found, and apply cold to a closed injury for about 20 minutes.", "Suspect a spine injury after any fall from height, a diving injury, or any fall with neck pain or numbness. Do not move the head or neck.", "For a head injury, watch for and report: worsening headache, repeated vomiting, drowsiness, confusion, unequal pupils, clear fluid from the nose or ear, weakness, or a seizure. Anyone on a blood thinner with a head strike needs evaluation even if they look fine.", "Every unwitnessed fall is treated as a possible head injury. Every fall is documented and reported."]}, {"t": "h", "v": "4. Stroke — time is brain"}, {"t": "p", "v": "Use <strong>BE FAST</strong>: <strong>B</strong>alance, sudden loss of balance or coordination; <strong>E</strong>yes, sudden vision loss or double vision; <strong>F</strong>ace, one side droops when they smile; <strong>A</strong>rms, one arm drifts down when both are raised; <strong>S</strong>peech, slurred, wrong words, or cannot repeat a simple sentence; <strong>T</strong>ime, note the exact time symptoms began, or when the person was last known well."}, {"t": "ul", "v": ["Call 911 immediately. Clot-busting treatment and clot retrieval are time-limited, and the time of onset determines what the hospital can offer.", "Give nothing by mouth — no food, water, or medication. Swallowing is often impaired.", "Do not let anyone “wait and see if it passes.” Symptoms that resolve were still a warning of a much larger stroke to come.", "Note the time and tell EMS. That single fact is the most valuable thing you will hand over."]}, {"t": "h", "v": "5. Chest pain, breathing, and allergic reaction"}, {"t": "ul", "v": ["<strong>Heart attack</strong> — pressure, squeezing, or fullness in the chest, possibly spreading to the arm, jaw, or back, with shortness of breath, sweating, nausea, or lightheadedness. Women, older adults, and people with diabetes often have no chest pain at all, presenting instead with fatigue, nausea, or breathlessness. Call 911, keep them still and calm, loosen tight clothing, and assist with their own prescribed nitroglycerin if policy allows.", "<strong>Asthma or COPD distress</strong> — sit them upright, coach slow breathing, assist with their own prescribed inhaler per policy, call 911 if they cannot speak in full sentences, are using neck and shoulder muscles to breathe, or are turning blue.", "<strong>Anaphylaxis</strong> — hives, swelling of the lips, tongue, or throat, wheezing, tightness in the throat, vomiting, dizziness, or collapse. Call 911, and give the person's own prescribed epinephrine auto-injector without delay: outer mid-thigh, hold in place as the device directs, note the time. Epinephrine wears off; a second dose may be needed and the person must go to the hospital even if they improve."]}, {"t": "h", "v": "6. Seizures, diabetes, and temperature"}, {"t": "ul", "v": ["<strong>Seizure</strong> — protect the head, clear hard objects away, do not restrain, and <strong>never put anything in the mouth</strong>. Time it. When the shaking stops, roll them onto their side. Call 911 if it lasts more than five minutes, repeats, is a first seizure, occurs in water, follows a head injury, or the person does not wake up.", "<strong>Low blood sugar</strong> — shakiness, sweating, pallor, confusion, irritability, slurred speech, hunger. If they are awake and can swallow safely, give 15 grams of fast sugar: half a cup of juice or regular soda, glucose gel or tablets, or a tablespoon of honey. Recheck in 15 minutes and repeat if needed, then give a snack with protein. <strong>Never give anything by mouth to someone who is not fully awake</strong> — call 911.", "<strong>High blood sugar</strong> — thirst, frequent urination, fruity breath, deep rapid breathing, drowsiness. Call 911.", "<strong>Heat stroke</strong> — hot skin, confusion, collapse, often without sweating. Call 911 and cool aggressively: move to shade or air conditioning, remove clothing, apply cold water and ice packs to the neck, armpits, and groin.", "<strong>Hypothermia</strong> — move them somewhere warm, remove wet clothing, wrap them, and handle gently. Older adults become hypothermic indoors."]}, {"t": "h", "v": "7. Burns, poisoning, and wounds"}, {"t": "ul", "v": ["<strong>Burns</strong> — cool with clean cool running water for 10 to 20 minutes. No ice, no butter, no ointment. Cover loosely with a clean non-stick dressing. Remove rings and watches before swelling starts. Call 911 for burns that are large, deep, or white or charred, or that involve the face, hands, feet, genitals, or a joint, and for any electrical or inhalation burn.", "<strong>Chemical exposure</strong> — brush off dry powder first, then flush with running water for at least 20 minutes, removing contaminated clothing. Check the Safety Data Sheet.", "<strong>Eye injury</strong> — flush from the inner corner outward for 15 to 20 minutes for chemicals. Never remove an embedded object; cover both eyes and get them seen.", "<strong>Poisoning or medication error</strong> — call Poison Control at <strong>1-800-222-1222</strong>. Do not induce vomiting.", "<strong>Amputation or avulsed tissue</strong> — control bleeding, wrap the part in clean damp gauze, seal it in a bag, and place that bag on ice. Never put tissue directly on ice.", "<strong>Tooth knocked out</strong> — handle by the crown, keep it moist in milk or saline, and get dental care within the hour."]}], "quiz": [{"q": "A resident is having a seizure. What should you do?", "o": ["Put a spoon between her teeth", "Hold her still", "Protect her head, clear objects away, time it, and turn her on her side afterward", "Splash cold water on her face"], "a": 2, "w": "Never restrain someone or place anything in their mouth. Protect the head, clear the area, time the seizure, and recovery-position them afterward."}, {"q": "What does the T in BE FAST stand for?", "o": ["Temperature", "Time — note exactly when symptoms began", "Tremor", "Talking"], "a": 1, "w": "The time of onset, or when the person was last known well, determines which stroke treatments the hospital can still offer."}, {"q": "A resident with signs of stroke asks for a glass of water. What do you do?", "o": ["Give small sips", "Give nothing by mouth and call 911", "Give water with her morning pills", "Let her decide"], "a": 1, "w": "Swallowing is frequently impaired in stroke. Nothing by mouth, including medication, and call 911 immediately."}, {"q": "How should you treat a burn?", "o": ["Apply butter or ointment", "Pack it in ice", "Cool with clean cool running water for 10 to 20 minutes, then cover loosely", "Leave it uncovered and dry"], "a": 2, "w": "Cool running water for 10 to 20 minutes. Ice causes further tissue damage, and greasy products trap heat."}, {"q": "A resident with diabetes is confused, sweaty, and shaky but awake and able to swallow. What do you give?", "o": ["Nothing until the nurse arrives", "About 15 grams of fast sugar, such as half a cup of juice", "A protein bar", "Insulin"], "a": 1, "w": "Treat with roughly 15 grams of fast-acting sugar, recheck in 15 minutes, then follow with a protein-containing snack."}, {"q": "A resident is found unresponsive and you suspect low blood sugar. Should you put glucose gel in her mouth?", "o": ["Yes, it absorbs through the cheek", "No — nothing by mouth for someone not fully awake; call 911", "Yes, with a little water", "Only if family consents"], "a": 1, "w": "Anything given by mouth to a person who is not fully awake risks aspiration. Call 911 and let EMS treat."}, {"q": "Blood is soaking through the dressing on a deep forearm wound. What do you do?", "o": ["Remove the dressing to look at the wound", "Add more dressings on top and maintain firm direct pressure", "Wash the wound with alcohol", "Elevate only and wait"], "a": 1, "w": "Lifting the dressing disrupts clot formation. Add layers and keep pressing; escalate to a tourniquet if bleeding is life-threatening."}, {"q": "A resident has swelling of the lips and tongue, hives, and wheezing after lunch. What is the priority?", "o": ["Give an antihistamine and watch", "Call 911 and give her prescribed epinephrine auto-injector without delay", "Have her lie flat and rest", "Offer water"], "a": 1, "w": "This is anaphylaxis. Epinephrine into the outer mid-thigh is the treatment, and she must be transported even if she improves, because the reaction can return."}, {"q": "A resident falls and her right leg looks shorter and rotated outward. What do you do?", "o": ["Help her up and into a chair", "Keep her still and warm, support the leg as found, and call 911", "Pull the leg straight", "Have her walk it off"], "a": 1, "w": "That presentation suggests a hip fracture. Do not move or straighten the limb; immobilize as found and get EMS."}, {"q": "A resident on a blood thinner hits his head but says he feels fine. What is correct?", "o": ["No action needed since he feels fine", "He needs medical evaluation anyway, and must be monitored and reported", "Just apply ice and document it", "Recheck him tomorrow"], "a": 1, "w": "Anticoagulation makes delayed intracranial bleeding a real risk. Any head strike on a blood thinner needs evaluation even without symptoms."}]}, {"id": "bls", "group": "bls", "skills": true, "title": "Basic Life Support (BLS) for Healthcare Providers", "short": "BLS Provider", "hours": 4, "certPre": "has completed 4 contact hrs. of Basic Life Support instruction for healthcare providers, including written examination and hands-on skills demonstration verified by the instructor", "certTitle": ["Basic Life Support (BLS) for Healthcare Providers"], "certNote": "Documents course attendance and instructor-verified skills. Not an American Heart Association course completion card.", "blurb": "Provider-level assessment, team resuscitation, bag-mask ventilation, and airway management for all ages.", "body": [{"t": "h", "v": "1. What separates provider BLS from lay rescuer CPR"}, {"t": "p", "v": "A healthcare provider is expected to do four things a lay rescuer is not: assess a pulse, ventilate with a bag-mask device, work as a coordinated team, and measure the quality of the resuscitation as it happens. The compression mechanics are identical. The difference is assessment, equipment, and teamwork."}, {"t": "h", "v": "2. The provider assessment sequence"}, {"t": "ul", "v": ["<strong>Verify scene safety.</strong>", "<strong>Check responsiveness</strong> — tap and shout.", "<strong>Activate the emergency response system</strong> and get the AED or crash cart. In a facility, call the code and send a named person.", "<strong>Assess breathing and pulse simultaneously, for no more than 10 seconds.</strong> Carotid in adults and children, brachial in infants.", "<strong>Decide:</strong> no pulse, no normal breathing → start CPR beginning with compressions. Pulse present but not breathing normally → give rescue breaths, one every 6 seconds (10 per minute), and recheck the pulse every 2 minutes. Pulse and breathing present → monitor, position, and treat the underlying problem.", "<strong>Attach the defibrillator</strong> as soon as it arrives and follow its prompts, minimizing interruption to compressions."]}, {"t": "note", "v": "If you are not certain whether there is a pulse within 10 seconds, begin compressions. Delayed CPR causes far more harm than compressions given to someone with a weak pulse."}, {"t": "h", "v": "3. High-quality CPR metrics you are accountable for"}, {"t": "ul", "v": ["Rate 100 to 120 per minute.", "Depth at least 2 inches (5 cm) in adults, about one third of the chest in children and infants.", "Full chest recoil; no leaning.", "Chest compression fraction greater than 60 percent — ideally 80 percent — of the total code time.", "Interruptions under 10 seconds, including for rhythm analysis and intubation.", "Avoid excessive ventilation.", "Rotate compressors every 2 minutes, coordinated with the rhythm check so the swap costs no extra time.", "Use feedback devices and capnography where available. Use the monitor, not your impression, to judge quality."]}, {"t": "h", "v": "4. Ratios and airway"}, {"t": "ul", "v": ["<strong>Adult, single or two rescuers: 30 compressions to 2 breaths.</strong>", "<strong>Child or infant, single rescuer: 30 to 2. Two or more rescuers: 15 to 2.</strong>", "<strong>With an advanced airway in place</strong> (endotracheal tube, supraglottic airway): continuous compressions without pauses, with one breath every 6 seconds.", "<strong>Bag-mask technique</strong> — use the E-C clamp with one rescuer, or, better, two-rescuer technique: one holds the mask with both hands for a seal while the other squeezes. Squeeze over about one second, just to visible chest rise. Two-thirds of bag-mask failures are seal failures, not squeeze failures.", "Consider an oropharyngeal or nasopharyngeal airway for an unresponsive person with no gag reflex to relieve soft-tissue obstruction.", "Do not hyperventilate. Excess breaths raise intrathoracic pressure and reduce coronary and cerebral perfusion."]}, {"t": "h", "v": "5. Working as a team"}, {"t": "ul", "v": ["Every effective code has clear roles: compressor, ventilator, defibrillator operator, timer and recorder, medication and IV access, and a team leader.", "Use <strong>closed-loop communication</strong>: the leader gives a specific instruction to a named person, that person repeats it back, and reports when it is done.", "Anyone may and should speak up about a safety concern or a quality problem. “Your compressions are getting shallow, let me take over” is good care, not criticism.", "The recorder calls out the 2-minute intervals so that rhythm checks, compressor swaps, and medication timing stay on schedule.", "Debrief after every event. What went well, what was slow, what we will change."]}, {"t": "h", "v": "6. Special resuscitation situations"}, {"t": "ul", "v": ["<strong>Opioid overdose</strong> — if unresponsive with abnormal breathing but a pulse, give rescue breaths and naloxone, and activate emergency response. If there is no pulse, CPR takes priority; naloxone does not restart a heart.", "<strong>Drowning</strong> — the arrest is hypoxic, so ventilation matters. Give breaths early and do not delay CPR to drain water from the lungs.", "<strong>Pregnancy</strong> — compress in the standard position, and where possible relieve pressure on the great vessels with manual displacement of the uterus to the woman's left. Prioritize resuscitating the mother.", "<strong>Foreign-body airway obstruction that becomes unresponsive</strong> — begin CPR, and look in the mouth each time you open the airway, removing an object only if you can see it.", "<strong>Hypothermic arrest</strong> — continue resuscitation; rewarming is part of the treatment and outcomes can be good after prolonged efforts.", "<strong>Trauma</strong> — control catastrophic bleeding as you resuscitate; compressions alone cannot compensate for an empty circulation."]}, {"t": "h", "v": "7. Post-arrest and documentation"}, {"t": "ul", "v": ["If a rhythm and pulse return, support the airway, give oxygen, position the person on their side if breathing is adequate, monitor continuously, and prepare for transfer.", "Do not remove the defibrillator pads.", "Document the time of collapse, time CPR began, time of first shock, number of shocks, medications, who was present, and the outcome. Times are what quality review depends on.", "In a residential setting, verify code status before and document what was found. A valid Florida DNRO on yellow paper directs that CPR be withheld; absent confirmation, resuscitate."]}, {"t": "h", "v": "8. Keeping skills"}, {"t": "p", "v": "BLS skills decay measurably within three to six months, well before the two-year certification interval expires. Brief, frequent practice on a manikin with a feedback device holds skills far better than a single annual class. Ask for practice time; it is the cheapest quality intervention in the building."}], "quiz": [{"q": "How long may a provider spend checking breathing and pulse?", "o": ["No more than 10 seconds", "At least 30 seconds", "Until certain", "Two full minutes"], "a": 0, "w": "Check breathing and pulse simultaneously for no more than 10 seconds. If you are uncertain, start compressions."}, {"q": "An adult has a pulse but is not breathing normally. What do you do?", "o": ["Start compressions", "Give one rescue breath every 6 seconds and recheck the pulse every 2 minutes", "Give 30 to 2", "Nothing but monitor"], "a": 1, "w": "With a pulse and inadequate breathing, ventilate at about 10 breaths per minute — one every 6 seconds — and reassess the pulse every 2 minutes."}, {"q": "With an advanced airway in place, how is CPR delivered?", "o": ["30 to 2 as usual", "15 to 2", "Continuous compressions with one breath every 6 seconds", "Pause for 5 breaths every minute"], "a": 2, "w": "Compressions become continuous and ventilation runs independently at one breath every 6 seconds."}, {"q": "What chest compression fraction should a team aim for?", "o": ["At least 30 percent", "Greater than 60 percent, ideally 80 percent", "Exactly 50 percent", "It does not matter"], "a": 1, "w": "Compression fraction — the share of code time spent compressing — should exceed 60 percent, and high-performing teams reach 80 percent."}, {"q": "Where do you check a pulse on an infant?", "o": ["Carotid", "Brachial", "Radial", "Femoral only"], "a": 1, "w": "Brachial artery in infants; carotid in children and adults."}, {"q": "Two rescuers are resuscitating an 8-month-old. What ratio do they use?", "o": ["30 to 2", "15 to 2", "10 to 1", "Continuous compressions"], "a": 1, "w": "Two or more rescuers use 15 to 2 for infants and children. A single rescuer uses 30 to 2."}, {"q": "What is the most common cause of ineffective bag-mask ventilation?", "o": ["Squeezing too slowly", "Failure to obtain a good mask seal", "Using too small a bag", "Compressing at the wrong rate"], "a": 1, "w": "Most bag-mask failures are seal failures. Two-rescuer technique, with one person using both hands on the mask, solves most of them."}, {"q": "A resident is unresponsive with agonal breathing and a palpable pulse, and opioid overdose is suspected. What is the priority?", "o": ["Give naloxone and wait", "Start chest compressions", "Give rescue breaths, administer naloxone, and activate emergency response", "Sternal rub only"], "a": 2, "w": "With a pulse present, ventilation plus naloxone is the treatment. If there is no pulse, CPR takes priority — naloxone does not restart a heart."}, {"q": "What is closed-loop communication?", "o": ["The team leader speaks only to the nurse", "A named person is given a specific order, repeats it back, and reports completion", "Communication stays within the room", "Only the recorder speaks"], "a": 1, "w": "Directed, acknowledged, and confirmed communication prevents duplicated and missed tasks during a code."}, {"q": "How often should compressors rotate, and why is it coordinated with rhythm checks?", "o": ["Every 5 minutes, for convenience", "Every 2 minutes, so the swap happens during the existing pause and costs no extra time", "Only when exhausted", "Never during a code"], "a": 1, "w": "Rotating every 2 minutes preserves compression depth, and doing it during the rhythm-check pause avoids adding an interruption."}, {"q": "A drowning victim is pulled from a pool in cardiac arrest. What is emphasized?", "o": ["Drain water from the lungs first", "Compressions only", "Early ventilation along with compressions, without delay", "Wait for EMS"], "a": 2, "w": "Drowning arrest is hypoxic, so ventilation is important. Never delay CPR to attempt to drain water."}, {"q": "Roughly how quickly do BLS skills begin to decay after a course?", "o": ["After five years", "Within three to six months", "They do not decay", "Only after the card expires"], "a": 1, "w": "Measurable decay occurs within three to six months, well before the two-year card expires, which is why brief frequent manikin practice matters."}]}]</script>

{course} se firma y emite una vez verificadas las destrezas.", "refNo": "Referencia {id}.", "another": "Tomar otro curso", "notSentH": "Resultado no enviado", "notSentBody": "Aprobó, pero el resultado no se pudo guardar ({code}). Tome una captura de pantalla de esta página y envíela al instructor, o intente de nuevo.", "theEmail": "el correo registrado", "backendDb": "Los registros se guardan en el almacenamiento compartido de esta página.", "backendRemote": "Los registros se envían a su servidor.", "backendLocal": "Los registros se guardan solo en este navegador.", "toLight": "Cambiar a modo claro", "toDark": "Cambiar a modo oscuro", "contactH": "Contacto", "contactNote": "Llame o escriba con cualquier pregunta sobre un curso, para programar una prueba práctica en persona, o sobre un certificado que está esperando.", "rights": "Todos los derechos reservados.", "howH": "Cómo funciona", "how1": "Elija solo los cursos que su trabajo realmente exige.", "how2": "Lea el material y apruebe el examen con {pct}% o más. Puede repetirlo cuantas veces necesite.", "how3": "Armando Alba, RN revisa su resultado y firma su certificado.", "progH": "Su progreso", "hrsWord": "horas", "progDone": "{n} de {t} cursos terminados", "nextUp": "SIGUIENTE", "continueBtn": "Continuar", "progAllDone": "Todos los cursos seleccionados están terminados. Buen trabajo.", "statsLine": "{n} cursos · {hrs} horas de contacto · English y Español · se aprueba con {pct}%", "errFac": "Escriba el centro o el empleador para el que es esta capacitación.", "facHint": "El centro o empleador para el que es esta capacitación. Esto se imprime en el certificado.", "copy": "Copiar", "copied": "Copiado", "copyFail": "Presione para seleccionar", "startFresh": "Borrar y empezar de nuevo", "startFreshHint": "Use esto si otra persona usó este dispositivo antes que usted.", "aboutNav": "Acerca de", "seeCourses": "Ver los cursos", "aboutLink": "Acerca del instructor"}, "meta": {"amsa6": {"title": "Asistencia con la Autoadministración de Medicamentos — Inicial de 6 Horas", "short": "Medicamentos (Inicial)", "blurb": "El curso inicial completo para personal que no ha sido capacitado antes: alcance de la práctica, los seis correctos, registros, almacenamiento, clases de medicamentos, medicamentos de alto riesgo y respuesta ante errores."}, "amsa": {"title": "Asistencia con la Autoadministración de Medicamentos — Actualización Anual de 2 Horas", "short": "Medicamentos (Actualización)", "blurb": "El repaso anual para el personal que ya completó el curso inicial de 6 horas."}, "infection": {"title": "Control de Infecciones / Precauciones Universales y de Barrera / Covid-19", "short": "Control de Infecciones", "blurb": "Precauciones estándar, higiene de manos, equipo de protección, precauciones por vía de transmisión y control de virus respiratorios en un centro residencial."}, "personalcare": {"title": "Cuidado Personal / Higiene", "short": "Cuidado Personal", "blurb": "Baño, cuidado bucal, cuidado perineal, vigilancia de la piel, aseo y traslados, hechos con seguridad y con dignidad."}, "hivaids": {"title": "Seminario de VIH/SIDA", "short": "VIH/SIDA", "blurb": "Transmisión y prevención, tratamiento actual, respuesta a la exposición ocupacional y la ley de confidencialidad del VIH en Florida."}, "dnro": {"title": "Órdenes de No Resucitar / Directivas Anticipadas", "short": "DNRO / Directivas", "blurb": "El formulario DNRO de Florida, los tipos de directivas anticipadas, qué debe hacer el personal en la admisión y qué hacer en una emergencia."}, "osha": {"title": "Normas de OSHA / Patógenos Transmitidos por la Sangre", "short": "OSHA / Patógenos", "blurb": "La norma de patógenos sanguíneos, el plan de control de exposición, la vacuna contra la hepatitis B, seguridad con objetos punzantes, comunicación de peligros y sus derechos como empleado."}, "hipaa": {"title": "Ley de Portabilidad y Responsabilidad del Seguro de Salud (HIPAA)", "short": "HIPAA", "blurb": "Información de salud protegida, divulgaciones permitidas, salvaguardas, redes sociales, respuesta ante una filtración y las protecciones adicionales de Florida."}, "cpr": {"title": "RCP — Adultos, Niños y Bebés", "short": "RCP", "blurb": "Compresiones de alta calidad, respiraciones de rescate y la cadena de supervivencia para toda edad."}, "aed": {"title": "Desfibrilador Externo Automático (DEA)", "short": "DEA / Desfibrilador", "blurb": "Uso seguro del DEA, colocación de los parches y las situaciones que cambian lo que usted hace."}, "firstaid": {"title": "Primeros Auxilios", "short": "Primeros Auxilios", "blurb": "Sangrado, caídas, quemaduras, derrame cerebral, convulsiones, emergencias diabéticas, reacciones alérgicas y cuándo llamar al 911."}, "bls": {"title": "Soporte Vital Básico (BLS) para Profesionales de la Salud", "short": "BLS Proveedor", "blurb": "Evaluación a nivel de proveedor, reanimación en equipo, ventilación con bolsa-mascarilla y manejo de la vía aérea en toda edad."}}, "courses": {"amsa": {"body": [{"t": "h", "v": "1. Por qué existe esta capacitación"}, {"t": "p", "v": "Florida permite que el personal sin licencia de un centro de vida asistida <em>asista</em> a un residente con la autoadministración de medicamentos, pero solo después de haber sido capacitado por un enfermero registrado, un enfermero práctico licenciado, un farmacéutico licenciado o un médico. La autoridad y los límites provienen de las secciones 429.255 y 429.256 de los Estatutos de Florida y de la Regla 59A-36.008 del Código Administrativo de Florida."}, {"t": "p", "v": "El requisito es un curso inicial de seis horas seguido de una actualización de dos horas cada año. Este es la actualización anual de dos horas y asume que usted ya completó la capacitación inicial. El propósito no es el papeleo: los medicamentos son la causa más común de daño en la vida asistida, y la línea entre “asistir” y “administrar” es la línea entre una ayuda legal y ejercer la enfermería sin licencia."}, {"t": "h", "v": "2. Tres actividades distintas — sepa cuál está haciendo"}, {"t": "ul", "v": ["<strong>Autoadministración.</strong> El residente toma sus propios medicamentos sin ayuda. El personal puede guardarlos y puede recordarle que es la hora. Nada más se requiere.", "<strong>Asistencia con la autoadministración.</strong> El residente es capaz de entender qué es el medicamento y de indicar que se le dé, pero necesita ayuda física. El personal capacitado sin licencia puede asistir. La decisión sigue siendo del residente.", "<strong>Administración.</strong> El medicamento se da a un residente que no puede dirigir su propio cuidado, o por una vía que requiere juicio clínico. Solo un enfermero licenciado (u otro profesional licenciado dentro de su alcance) puede administrar."]}, {"t": "note", "v": "Si el residente no puede decirle qué es el medicamento, no lo reconoce, o no puede indicarle que se lo dé, usted ya no está asistiendo — está administrando. Deténgase y busque al enfermero."}, {"t": "h", "v": "3. Qué incluye legalmente la “asistencia”"}, {"t": "p", "v": "Según la Regla 59A-36.008, la asistencia con la autoadministración incluye todo lo siguiente, y usted puede hacerlo después de capacitarse:"}, {"t": "ul", "v": ["Tomar el medicamento de donde está guardado y llevarlo al residente.", "En presencia del residente, leer la etiqueta en voz alta y confirmar que el residente es la persona nombrada en ella.", "Sacar una dosis prescrita del envase y colocarla en la mano del residente, o en otro recipiente, y ayudarle a llevarlo a la boca.", "Aplicar medicamentos tópicos — cremas, ungüentos, lociones — sobre piel intacta.", "Devolver el medicamento al almacenamiento seguro.", "Mantener un registro escrito de la asistencia que usted brindó.", "Pedir y recibir los surtidos de la farmacia, y comparar la etiqueta con el registro cuando llegue el surtido.", "Ayudar con una dosis líquida prescrita midiéndola tal como indica la etiqueta, o partir una tableta ranurada por su línea de ranura como indica la etiqueta."]}, {"t": "h", "v": "4. Qué NO incluye la asistencia"}, {"t": "p", "v": "Estos actos están fuera del alcance del personal sin licencia. Hacer cualquiera de ellos es una violación y puede reportarse a la junta de licencias:"}, {"t": "ul", "v": ["Mezclar, preparar, convertir o calcular una dosis. Medir una dosis que la etiqueta ya indica está permitido; decidir cuánto dar no lo está.", "Triturar, partir o alterar un medicamento que no esté ranurado y etiquetado para eso, o disolver una tableta en comida o líquido, salvo que un enfermero licenciado o la etiqueta de la farmacia lo indique.", "Administrar cualquier medicamento por inyección, incluida la insulina. Se le puede entregar una pluma o jeringa precargada, preparada por una persona licenciada, a un residente que se inyecta a sí mismo, pero usted no inyecta.", "Administrar medicamento en el ojo, oído, nariz, recto o vagina, ni por inhalador o nebulizador, más allá de entregar el dispositivo a un residente que dirige su uso — revise la política del centro y el plan de cuidado.", "Decidir si un medicamento PRN (según necesidad) es apropiado. El residente debe pedirlo y poder decir el síntoma; si no puede, avise al enfermero.", "Asistir a un residente que se niega, se resiste o no puede participar. Nunca force, esconda ni disfrace un medicamento."]}, {"t": "h", "v": "5. Los seis correctos, cada vez"}, {"t": "ul", "v": ["<strong>Residente correcto</strong> — lea el nombre de la etiqueta en voz alta frente al residente.", "<strong>Medicamento correcto</strong> — la etiqueta, no su memoria.", "<strong>Dosis correcta</strong> — tal como está impresa en la etiqueta.", "<strong>Vía correcta</strong> — tal como está impresa en la etiqueta.", "<strong>Hora correcta</strong> — dentro del margen que permite la política del centro, normalmente una hora antes a una hora después de la hora programada.", "<strong>Documentación correcta</strong> — registrada en el momento en que usted asiste, nunca por adelantado y nunca en grupo al final del turno."]}, {"t": "h", "v": "6. Registros"}, {"t": "p", "v": "El registro de observación de medicamentos (MOR) es un documento legal. Anote el medicamento, la dosis, la vía, la fecha, la hora y sus iniciales en el momento en que asiste. Si una dosis no se toma, no deje el casillero en blanco: márquelo con el código correspondiente y escriba por qué, ya sea al reverso o en las notas — se negó, suspendido por orden, sin medicamento, residente en una cita, hospitalizado. Un casillero en blanco lo lee un inspector como una dosis perdida sin explicación."}, {"t": "p", "v": "Solo una persona licenciada puede cambiar o transcribir una orden. Si un médico cambia una dosis por teléfono, el enfermero toma esa orden. Usted no escribe sobre una etiqueta de farmacia ni la altera — nunca. La etiqueta la cambia la farmacia."}, {"t": "h", "v": "7. Almacenamiento y seguridad"}, {"t": "ul", "v": ["Los medicamentos de almacenamiento central deben estar en un gabinete, carro o cuarto cerrado con llave, accesible solo al personal autorizado.", "Los medicamentos de cada residente se guardan por separado y en el envase original con etiqueta de la farmacia.", "Los medicamentos refrigerados van en un recipiente designado, etiquetado y a prueba de derrames, separado de los alimentos.", "Las sustancias controladas requieren un conteo continuo; las discrepancias se reportan de inmediato, no al final del turno.", "Los medicamentos descontinuados, vencidos o de residentes fallecidos se desechan según la política del centro, con dos testigos y documentación."]}, {"t": "h", "v": "8. Cuando algo sale mal"}, {"t": "p", "v": "Un error de medicación es cualquier desviación: residente equivocado, medicamento equivocado, dosis equivocada, hora equivocada, vía equivocada o una dosis omitida. La respuesta siempre sigue el mismo orden:"}, {"t": "ul", "v": ["Quédese con el residente y observe cómo se ve y cómo se siente — respiración, color, estado de alerta, molestias.", "Avise a su supervisor y al enfermero del centro de inmediato. No espere a ver si el residente “parece estar bien”.", "El enfermero o el supervisor contacta al médico, y al Centro de Control de Envenenamiento al 1-800-222-1222 si corresponde.", "Llame al 911 ante cualquier señal de reacción grave: dificultad para respirar, hinchazón de la cara o la garganta, dolor de pecho, falta de respuesta, convulsión.", "Documente objetivamente qué pasó, qué observó, a quién avisó y cuándo. Complete un reporte de incidente.", "Nunca lo oculte, nunca corrija el registro después del hecho y nunca anote una dosis que no se tomó."]}, {"t": "note", "v": "Su propia honestidad es el sistema de seguridad. Un error reportado en cinco minutos casi siempre es inofensivo. El error que se esconde es el que lastima a alguien."}, {"t": "h", "v": "9. Cuando cambia la condición del residente"}, {"t": "p", "v": "Si un residente que antes manejaba sus propios medicamentos se vuelve confundido, empieza a negarse constantemente, no puede identificar sus medicamentos o comienza a necesitar que usted decida por él, repórtelo. Ese residente puede necesitar ahora la administración por un enfermero licenciado, lo que puede significar una evaluación de salud (Formulario AHCA 1823), un cambio en el plan de cuidado, un acuerdo de Cuidado Congregado Extendido (ECC) o Servicios de Enfermería Limitados (LNS), o un nivel de cuidado distinto. Reconocer ese cambio es parte de su trabajo."}], "quiz": [{"q": "Una residente le pide ayuda con sus pastillas de la mañana. Nombra cada una, le dice para qué es y le pide que abra los frascos y se las ponga en la mano. ¿Qué es esto?", "o": ["Administración de medicamentos, que requiere un enfermero", "Asistencia con la autoadministración, que usted puede hacer después de capacitarse", "Una violación, porque usted tocó el medicamento", "Autoadministración, así que no se necesita documentar"], "a": 1, "w": "La residente entiende sus medicamentos y dirige el acto; usted brinda ayuda física. Eso es asistencia con la autoadministración, permitida al personal capacitado sin licencia, y debe documentarse."}, {"q": "¿Quién puede dar la capacitación que permite al personal sin licencia asistir con la autoadministración en un ALF de Florida?", "o": ["Cualquier empleado con dos años en el centro", "El administrador", "Un RN, LPN, farmacéutico licenciado o médico", "El repartidor de la farmacia"], "a": 2, "w": "La Regla 59A-36.008 exige que la capacitación la dé un enfermero registrado, un enfermero práctico licenciado, un farmacéutico licenciado o un médico."}, {"q": "La tableta de un residente es grande y le cuesta tragarla. No está ranurada y la etiqueta no dice nada sobre triturarla. ¿Qué hace?", "o": ["Triturarla y mezclarla con compota de manzana", "Partirla a la mitad con los dedos", "Decirle que se esfuerce más y documentarlo", "No alterarla — avisar al enfermero o supervisor para que el médico o la farmacia cambien la presentación"], "a": 3, "w": "Triturar o alterar un medicamento que no está ranurado ni etiquetado para eso está fuera del alcance de la asistencia. El enfermero gestiona un líquido, una tableta más pequeña o una nueva orden."}, {"q": "¿Cuál de estas acciones puede hacer un empleado capacitado sin licencia?", "o": ["Inyectar insulina en el abdomen de un residente", "Medir 10 mL de un antibiótico líquido según indica la etiqueta y entregárselo al residente", "Decidir que un residente parece ansioso y darle el lorazepam PRN", "Partir a la mitad una pastilla de presión sin ranura"], "a": 1, "w": "Medir una dosis que la etiqueta ya especifica está permitido. Las inyecciones, juzgar si un PRN corresponde y alterar tabletas sin ranura no lo están."}, {"q": "A las 2:00 PM se da cuenta de que olvidó asistir a un residente con su medicamento del mediodía. ¿Qué hace?", "o": ["Dárselo ahora y anotarlo como dado al mediodía", "No decir nada porque solo pasaron dos horas", "Avisar de inmediato a su supervisor y al enfermero, y documentar la omisión y a quién avisó", "Anotarlo mañana para que el conteo cuadre"], "a": 2, "w": "Una dosis omitida es un error de medicación. Reporte de inmediato, documente lo que realmente ocurrió y deje que el enfermero decida si la dosis todavía debe tomarse."}, {"q": "Una residente se niega a su medicamento de la noche. ¿Qué se anota en el registro de observación de medicamentos?", "o": ["Dejar el casillero en blanco", "Poner sus iniciales como dado, para evitar preguntas", "Marcar la entrada con el código de rechazo y documentar la razón y el aviso", "Escribir 'residente incumplidora' y nada más"], "a": 2, "w": "Nunca deje un casillero en blanco ni anote una dosis que no se tomó. Marque el rechazo con el código, anote la razón y avise según la política."}, {"q": "¿Dónde deben guardarse los medicamentos de almacenamiento central?", "o": ["En un gabinete o carro cerrado con llave, accesible solo al personal autorizado", "En un estante abierto del comedor por comodidad", "En la mesa de noche de cada residente, sin importar su capacidad", "Junto a los alimentos refrigerados, para ahorrar espacio"], "a": 0, "w": "El medicamento de almacenamiento central debe estar bajo llave y accesible solo al personal autorizado. Los refrigerados van en un recipiente separado y etiquetado, nunca con la comida."}, {"q": "Una residente que manejó sus medicamentos por años ahora no puede nombrarlos y le dice 'solo deme lo que me toque'. ¿Qué indica esto?", "o": ["Nada — siga asistiendo igual", "Puede necesitar ahora administración por un enfermero licenciado; reporte el cambio para reevaluación", "Usted debe decidir por ella cuáles pastillas darle", "Debe ser dada de alta de inmediato"], "a": 1, "w": "Una residente que ya no puede dirigir el acto no se está autoadministrando. Repórtelo para que el enfermero reevalúe y se ajuste el plan y el nivel de cuidado."}, {"q": "¿Cuál afirmación sobre la etiqueta de la farmacia es correcta?", "o": ["Puede escribir una nueva dosis en la etiqueta si el médico la llama", "Puede tachar el nombre de un medicamento descontinuado", "La etiqueta solo la cambia la farmacia; usted nunca la altera", "Puede reetiquetar el frasco si la letra es muy pequeña"], "a": 2, "w": "Alterar una etiqueta de farmacia nunca está dentro de su alcance. Los cambios de orden pasan por el enfermero y la farmacia emite una etiqueta corregida."}, {"q": "A una residente se le hinchan los labios y le falta el aire minutos después de tomar un medicamento nuevo. ¿Cuál es su primera prioridad?", "o": ["Terminar el pase de medicamentos y luego avisar al enfermero", "Llamar al 911 y quedarse con ella, después avisar a su supervisor", "Buscar el medicamento en internet", "Documentar la reacción y esperar el siguiente turno"], "a": 1, "w": "Las señales de reacción grave — dificultad para respirar, hinchazón de cara o garganta — son una emergencia médica. Llame al 911, quédese con la residente, luego avise y documente."}]}, "infection": {"body": [{"t": "h", "v": "1. La cadena de la infección"}, {"t": "p", "v": "Toda infección necesita seis eslabones. Si rompe cualquiera de ellos, la infección no se propaga."}, {"t": "ul", "v": ["<strong>Agente infeccioso</strong> — la bacteria, el virus o el hongo.", "<strong>Reservorio</strong> — donde vive: una persona, el desagüe de un lavamanos, una superficie contaminada, agua estancada.", "<strong>Puerta de salida</strong> — tos, drenaje de una herida, heces, sangre.", "<strong>Vía de transmisión</strong> — contacto (directo o por una superficie), gotitas o aire.", "<strong>Puerta de entrada</strong> — boca, nariz, ojos, piel lesionada, un catéter o un sitio de vía intravenosa.", "<strong>Huésped susceptible</strong> — adultos mayores, personas con enfermedades crónicas, cualquiera inmunocomprometido o desnutrido."]}, {"t": "p", "v": "En la vida asistida, el eslabón que usted controla con más frecuencia es la vía de transmisión, y la herramienta son sus manos."}, {"t": "h", "v": "2. Precauciones estándar"}, {"t": "p", "v": "Las precauciones estándar reemplazaron la idea antigua de tratar de forma distinta solo a los residentes “conocidos como infecciosos”. La regla es que la sangre, todos los líquidos corporales, las secreciones, las excreciones (excepto el sudor), la piel no intacta y las membranas mucosas se tratan como potencialmente infecciosos en todos los residentes, todas las veces, sin importar el diagnóstico. No necesita conocer el estado de un residente para estar protegido, y no está permitido relajar las precauciones porque usted crea que alguien está “limpio”."}, {"t": "p", "v": "Las precauciones estándar incluyen higiene de manos, equipo de protección personal según la tarea, higiene respiratoria y etiqueta de la tos, manejo seguro de objetos punzantes, práctica segura de inyección, limpieza y desinfección de superficies y equipos, y manejo seguro de ropa de cama y desechos."}, {"t": "h", "v": "3. Higiene de manos"}, {"t": "p", "v": "La higiene de manos es lo más efectivo que usted hará en todo el turno. Realícela:"}, {"t": "ul", "v": ["Antes y después de cada contacto con un residente.", "Antes de una tarea limpia o aséptica — cuidado de heridas, manejo de alimentos, asistencia con medicamentos.", "Después del contacto con sangre o líquidos corporales, incluso si usó guantes.", "Después de tocar el entorno del residente — barandas de cama, mesa, timbre de llamada.", "Después de quitarse los guantes y después de usar el baño.", "Antes de comer y antes de ponerse o quitarse la mascarilla."]}, {"t": "p", "v": "El gel a base de alcohol con 60 a 95 por ciento de alcohol es el preferido para la higiene de manos de rutina: frote todas las superficies hasta que se seque por completo, unos 20 segundos, y no lo limpie con una toalla. Use agua y jabón por al menos 20 segundos cuando las manos estén visiblemente sucias, después de usar el baño, antes de comer y — esto es fundamental — siempre que se sospeche o confirme <em>Clostridioides difficile</em> o norovirus, porque el alcohol no mata esas esporas ni ese virus. Mantenga las uñas cortas y naturales; las uñas artificiales y el esmalte descascarado albergan microorganismos. Los anillos y las pulseras estorban la técnica correcta."}, {"t": "h", "v": "4. Precauciones de barrera — equipo de protección personal"}, {"t": "p", "v": "El equipo se elige según la exposición que se anticipa, no según el diagnóstico:"}, {"t": "ul", "v": ["<strong>Guantes</strong> — para cualquier contacto con sangre, líquidos corporales, membranas mucosas, piel no intacta o artículos contaminados. De un solo uso. Cámbielos entre tareas en el mismo residente. Los guantes no sustituyen la higiene de manos.", "<strong>Bata</strong> — cuando sea probable que la ropa o la piel se ensucien o se salpiquen.", "<strong>Mascarilla y protección ocular</strong> — cuando hay posibilidad de salpicaduras o aerosoles, y para precauciones por gotitas.", "<strong>Respirador N95 o superior</strong> — para precauciones por vía aérea; requiere prueba de ajuste y evaluación médica bajo la norma de protección respiratoria de OSHA. Una mascarilla quirúrgica no es un respirador."]}, {"t": "p", "v": "<strong>Orden para ponerse el equipo:</strong> bata, luego mascarilla o respirador, luego protección ocular, luego guantes. <strong>Orden para quitarlo:</strong> guantes, luego protección ocular, luego bata, luego mascarilla o respirador — se retira primero lo más contaminado, y se hace higiene de manos inmediatamente después. Quíteselo antes de salir de la habitación, excepto el respirador, que se retira después de salir. Nunca reutilice una bata desechable y nunca camine por el pasillo con guantes usados."}, {"t": "h", "v": "5. Precauciones por vía de transmisión"}, {"t": "ul", "v": ["<strong>Contacto</strong> — MRSA, VRE, C. difficile, escabiosis, heridas con drenaje. Bata y guantes al entrar; equipo dedicado o desinfectado; agua y jabón para C. difficile.", "<strong>Gotitas</strong> — influenza, tos ferina, VSR, estreptococo del grupo A, la mayoría de los virus respiratorios. Mascarilla quirúrgica al entrar; coloque mascarilla al residente durante el traslado.", "<strong>Vía aérea</strong> — tuberculosis, sarampión, varicela. N95 o superior, habitación con presión negativa si existe, puerta cerrada, entrada limitada. La mayoría de los ALF no pueden manejar aislamiento aéreo y deben trasladar al residente."]}, {"t": "p", "v": "La señalización va en la puerta, los insumos van fuera de la habitación y el plan de cuidado se actualiza. Las precauciones las levanta el enfermero o el médico, no quien esté de turno ese día."}, {"t": "h", "v": "6. Covid-19 y otros virus respiratorios"}, {"t": "p", "v": "El SARS-CoV-2 se transmite principalmente por partículas respiratorias de una persona infectada — al hablar, toser o respirar — a corta distancia, y por partículas más pequeñas que permanecen en espacios interiores mal ventilados. Las superficies contaminadas son una vía menor pero real. Una persona puede transmitir antes de sentirse enferma y sin llegar a sentirse enferma nunca, por eso el control de la fuente y la ventilación importan más que solo revisar síntomas."}, {"t": "ul", "v": ["Vigile fiebre, tos nueva, falta de aire, dolor de garganta, congestión, pérdida del gusto o el olfato, fatiga, dolores musculares, dolor de cabeza, náusea o diarrea. En adultos mayores la primera señal suele ser sutil: una confusión nueva, una caída o rechazo a comer.", "Reporte cualquier caso sospechoso al enfermero y al administrador de inmediato, y siga la política vigente del centro sobre pruebas, mascarillas y ubicación del residente.", "Mejore la ventilación: abra ventanas donde sea seguro, mantenga el sistema de aire funcionando, evite aglomeraciones en espacios pequeños.", "Las actividades en grupo y el comedor común aceleran los brotes. Siga la guía vigente del centro y no la costumbre.", "La vacunación de residentes y personal sigue siendo la herramienta principal para prevenir enfermedad grave, hospitalización y muerte; mantenga al día los registros de vacunación y ofrezca educación sin coaccionar.", "El personal con síntomas se queda en casa y lo reporta. Trabajar enfermo es la forma en que empiezan los brotes en centros residenciales."]}, {"t": "note", "v": "La guía sobre Covid-19 y virus respiratorios cambia. Siga siempre la política escrita vigente de su centro y la guía actual de los CDC y del Departamento de Salud de Florida por encima de lo que aprendió en un año anterior."}, {"t": "h", "v": "7. Limpieza ambiental y derrames de sangre"}, {"t": "p", "v": "La limpieza retira la suciedad; la desinfección mata microorganismos. Se necesitan las dos, en ese orden. Use un desinfectante hospitalario registrado por la EPA, respete el tiempo de contacto que indica la etiqueta — una superficie que se limpia y se seca de inmediato no queda desinfectada — y priorice las superficies de contacto frecuente: manijas, pasamanos, interruptores, timbres, controles remotos, equipo compartido y accesorios del baño."}, {"t": "p", "v": "Ante un derrame de sangre o líquidos corporales: póngase guantes (y bata y protección facial si puede salpicar), cubra y absorba el derrame con toallas de papel, deséchelas como desecho regulado, limpie el área y después desinfecte con un producto registrado por la EPA eficaz contra patógenos sanguíneos o con una solución fresca de cloro 1:10, dejando el tiempo de contacto completo. El vidrio roto se recoge con recogedor, pinzas o fórceps — nunca con las manos, ni siquiera enguantadas."}, {"t": "p", "v": "Maneje la ropa sucia con guantes, sosténgala lejos del cuerpo, nunca la sacuda, embólsela en el lugar de uso y no la cargue contra su uniforme."}, {"t": "h", "v": "8. Reconocer y reportar un brote"}, {"t": "p", "v": "Dos o más residentes o empleados con síntomas similares en el mismo período y área es una señal, no una coincidencia. Reporte el mismo día los grupos de enfermedad respiratoria, diarrea y vómito, erupciones o conjuntivitis al enfermero y al administrador. El centro reporta las enfermedades notificables y los brotes al departamento de salud del condado y avisa a AHCA según se requiera. Llevar una lista sencilla — quién, qué síntomas, qué fecha de inicio, qué habitación — es lo que permite que el departamento de salud pueda ayudar."}, {"t": "h", "v": "9. Organismos resistentes y uso prudente de antibióticos"}, {"t": "p", "v": "MRSA, VRE, organismos productores de BLEE y C. difficile son comunes en el cuidado a largo plazo porque los antibióticos también lo son. Un residente colonizado porta el organismo sin estar enfermo; la colonización no es motivo para aislarlo socialmente, restringir actividades ni negarle cuidado — es motivo para ser riguroso con las precauciones estándar y de contacto. Una orina turbia o con olor fuerte por sí sola no es una infección urinaria; reporte los síntomas reales para que los médicos traten infecciones y no resultados de laboratorio."}], "quiz": [{"q": "Un residente tiene Clostridioides difficile confirmado. ¿Qué método de higiene de manos se requiere después del cuidado?", "o": ["El gel a base de alcohol es suficiente", "Agua y jabón por al menos 20 segundos", "Gel y luego secar con toalla de papel", "Solo guantes, sin higiene de manos"], "a": 1, "w": "El alcohol no mata las esporas de C. difficile. El agua y jabón con fricción las retira físicamente."}, {"q": "Las precauciones estándar aplican a:", "o": ["Solo residentes con una infección sanguínea conocida", "Solo residentes en aislamiento", "Todos los residentes, todas las veces, sin importar el diagnóstico", "Solo cuando se espera ver sangre"], "a": 2, "w": "Las precauciones estándar asumen que la sangre y los líquidos corporales de cualquier residente pueden ser infecciosos. Nunca necesita conocer un diagnóstico para estar protegido."}, {"q": "¿Cuál es el orden correcto para ponerse el equipo de protección personal?", "o": ["Guantes, bata, mascarilla, protección ocular", "Bata, mascarilla o respirador, protección ocular, guantes", "Mascarilla, guantes, bata, protección ocular", "Protección ocular, guantes, bata, mascarilla"], "a": 1, "w": "Primero la bata, luego mascarilla o respirador, luego protección ocular y por último los guantes. Al quitarlo se invierte la lógica: los guantes, lo más contaminado, salen primero."}, {"q": "¿Qué precauciones se usan con un residente con sospecha de tuberculosis activa?", "o": ["Precauciones de contacto con bata y guantes", "Precauciones por gotitas con mascarilla quirúrgica", "Precauciones por vía aérea con N95 o superior y traslado a un lugar adecuado", "Solo precauciones estándar"], "a": 2, "w": "La tuberculosis se transmite por vía aérea. Requiere un N95 con prueba de ajuste y un ambiente de presión negativa, que la mayoría de los ALF no pueden ofrecer, por lo que suele ser necesario el traslado."}, {"q": "Limpió un pasamanos con desinfectante y lo secó de inmediato con una toalla. ¿Quedó desinfectado?", "o": ["Sí, desde que el producto lo tocó", "No — la superficie debe permanecer húmeda durante el tiempo de contacto de la etiqueta", "Sí, si usó suficiente producto", "Solo si usó cloro"], "a": 1, "w": "El tiempo de contacto es lo que mata los microorganismos. Secar la superficie antes de tiempo anula el desinfectante."}, {"q": "¿Qué hallazgo sugiere con más fuerza Covid-19 en una residente de 88 años?", "o": ["Solo cuenta la fiebre alta clásica con tos seca", "Una confusión nueva, una caída o rechazo a comer pueden ser la primera señal", "Los adultos mayores no se contagian de Covid-19", "Los síntomas siempre aparecen antes de que la persona sea contagiosa"], "a": 1, "w": "En adultos mayores la presentación suele ser atípica — delirio, caídas o poco apetito pueden preceder o reemplazar los síntomas respiratorios. Además puede haber transmisión antes de los síntomas."}, {"q": "Un empleado despierta con dolor de garganta y tos leve antes de un turno en una unidad de memoria. ¿Qué es correcto?", "o": ["Ir a trabajar con mascarilla sin decírselo a nadie", "Ir porque la unidad está con poco personal", "Quedarse en casa, reportar los síntomas y seguir la política de pruebas del centro", "Ir pero evitar solo a los residentes más enfermos"], "a": 2, "w": "Trabajar con síntomas es una causa principal de brotes en centros residenciales. Reporte y siga la política del centro."}, {"q": "¿Cómo debe manejarse la ropa de cama sucia?", "o": ["Sacudirla para revisar si hay objetos personales", "Sostenerla lejos del cuerpo, no sacudirla y embolsarla en el lugar de uso", "Cargarla en los brazos hasta la lavandería", "Enjuagarla primero en el lavamanos del residente"], "a": 1, "w": "Sacudirla genera aerosoles. La ropa se embolsa donde se retira y se mantiene alejada del uniforme."}, {"q": "Tres residentes del mismo pasillo presentan vómito y diarrea en 24 horas. ¿Qué debe hacer?", "o": ["Esperar a ver si se enferman más", "Reportarlo al enfermero y al administrador el mismo día como posible brote", "Suponer que fue la comida y no decir nada", "Mover a los tres a una habitación sin avisar a nadie"], "a": 1, "w": "Los síntomas agrupados en tiempo y lugar indican un brote y requieren reporte el mismo día para que el centro notifique al departamento de salud del condado."}, {"q": "Un residente nuevo está documentado como colonizado con MRSA. ¿Qué respuesta es adecuada?", "o": ["Mantenerlo en su habitación y fuera de toda actividad de forma permanente", "Rechazar la admisión", "Brindar cuidado con precauciones estándar y de contacto rigurosas; la colonización sola no justifica aislamiento social", "Avisar a los otros residentes para que lo eviten"], "a": 2, "w": "La colonización se maneja con precauciones, no con exclusión social — y revelar su estado a otros residentes sería además una violación de privacidad."}]}, "personalcare": {"body": [{"t": "h", "v": "1. La dignidad es la técnica"}, {"t": "p", "v": "El cuidado personal es el trabajo más íntimo del edificio. Un residente bañado con competencia pero sin dignidad igual ha sido dañado. La ley de derechos del residente de Florida, sección 429.28, garantiza privacidad, trato cortés y participación en las decisiones sobre su propio cuidado. En la práctica eso significa:"}, {"t": "ul", "v": ["Golpear la puerta y esperar respuesta antes de entrar. Identifíquese.", "Explicar lo que va a hacer, en orden, antes de tocar a alguien.", "Cerrar la puerta, cerrar la cortina y mantener al residente cubierto excepto el área donde está trabajando.", "Ofrecer opciones reales: qué camisa, ducha ahora o después del desayuno, qué jabón.", "Usar el nombre que el residente prefiere. No “mi amor”, no “abuelita”, no un diminutivo que nadie eligió.", "No hablar por encima del residente con un compañero mientras brinda el cuidado, y nunca hablar de otro residente dentro de la habitación."]}, {"t": "p", "v": "Un residente tiene derecho a negarse. Una negativa no es un problema de conducta; es información. Intente más tarde, pruebe otra manera, averigüe cuál es la objeción real, y reporte una negativa persistente a la higiene para que el equipo atienda la causa — dolor, frío, miedo, depresión o un cambio cognitivo."}, {"t": "h", "v": "2. Baño y ducha"}, {"t": "ul", "v": ["Reúna todo antes de empezar. Dejar solo a un residente mojado para ir por una toalla es como ocurren las caídas.", "Verifique la temperatura del agua en su muñeca o con un termómetro — aproximadamente 100 a 105 grados Fahrenheit. La piel del adulto mayor se quema más rápido y puede no sentir el calor.", "Lave de lo más limpio a lo más sucio: primero la cara, el área perineal al final. Use una sección limpia del paño para cada ojo, del ángulo interno al externo.", "Use silla de ducha, tapete antideslizante y barras de apoyo. Mantenga al residente cubierto con una sábana de baño entre áreas.", "Seque con toques, no frotando, y seque bien los pliegues de piel, debajo de los senos, entre los dedos de los pies y en la ingle — la humedad atrapada causa lesiones e infección por hongos.", "Aplique cr
