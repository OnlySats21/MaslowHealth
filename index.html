an infected person — talking, coughing, breathing — at close range, and by smaller particles that linger in poorly ventilated indoor space. Contaminated surfaces are a lesser but real route. People can transmit before they feel sick and without ever feeling sick, which is why source control and ventilation matter more than symptom screening alone."}, {"t": "ul", "v": ["Watch for fever, new cough, shortness of breath, sore throat, congestion, loss of taste or smell, fatigue, muscle aches, headache, nausea, or diarrhea. In older adults the first sign is frequently subtle: a new confusion, a fall, or refusing to eat.", "Report any suspected case to the nurse and administrator immediately, and follow current facility policy on testing, masking, and resident placement.", "Improve ventilation: open windows where safe, keep HVAC running, avoid crowding in small rooms.", "Group activities and communal dining are outbreak accelerators. Follow the facility's current guidance rather than habit.", "Vaccination of residents and staff remains the primary tool for preventing severe illness, hospitalization, and death; keep resident vaccination records current and offer education without coercion.", "Staff who are symptomatic stay home and report. Presenteeism is how outbreaks start in congregate care."]}, {"t": "note", "v": "Guidance for COVID-19 and seasonal respiratory viruses changes. Always follow your facility's current written policy and current CDC and Florida Department of Health guidance over anything you learned in a previous year."}, {"t": "h", "v": "7. Environmental cleaning and blood spills"}, {"t": "p", "v": "Cleaning removes soil; disinfection kills organisms. Both are needed, in that order. Use an EPA-registered hospital disinfectant, follow the label's contact (wet dwell) time — a surface wiped and immediately dried is not disinfected — and prioritize high-touch surfaces: door handles, handrails, light switches, call bells, remote controls, shared equipment, bathroom fixtures."}, {"t": "p", "v": "For a blood or body fluid spill: put on gloves (and gown and face protection if splashing is possible), cover and absorb the spill with paper towels, dispose of them as regulated waste, clean the area, then disinfect with an EPA-registered product effective against bloodborne pathogens or a fresh 1:10 bleach solution, allowing the full contact time. Broken glass is picked up with a dustpan, tongs, or forceps — never with your hands, even gloved."}, {"t": "p", "v": "Handle soiled linen with gloves, hold it away from your body, never shake it out, bag it at the point of use, and do not carry it against your uniform."}, {"t": "h", "v": "8. Recognizing and reporting an outbreak"}, {"t": "p", "v": "Two or more residents or staff with similar symptoms in the same time frame and area is a signal, not a coincidence. Report clusters of respiratory illness, diarrhea and vomiting, rashes, or conjunctivitis to the nurse and administrator the same day. The facility reports reportable diseases and outbreaks to the county health department, and notifies AHCA as required. Keeping a simple line list — who, what symptoms, what date of onset, what room — is what allows the health department to help you."}, {"t": "h", "v": "9. Antibiotic-resistant organisms and stewardship"}, {"t": "p", "v": "MRSA, VRE, ESBL-producing organisms, and C. difficile are common in long-term care because antibiotics are common there. A resident who is colonized carries the organism without being sick; colonization is not a reason to isolate socially, restrict activities, or refuse care — it is a reason to be rigorous with standard and contact precautions. Cloudy or strong-smelling urine alone is not a urinary tract infection; report actual symptoms so that providers treat infections rather than test results."}], "quiz": [{"q": "A resident has confirmed Clostridioides difficile. Which hand hygiene method is required after care?", "o": ["Alcohol-based hand rub is sufficient", "Soap and running water for at least 20 seconds", "Hand rub followed by a paper towel wipe", "Gloves alone, no hand hygiene needed"], "a": 1, "w": "Alcohol does not kill C. difficile spores. Soap and running water with friction physically removes them."}, {"q": "Standard precautions apply to:", "o": ["Only residents with a known bloodborne infection", "Only residents on isolation", "Every resident, every time, regardless of diagnosis", "Only when you expect to see blood"], "a": 2, "w": "Standard precautions assume blood and body fluids from all residents may be infectious. You never need to know a diagnosis to be protected."}, {"q": "What is the correct order for putting on PPE?", "o": ["Gloves, gown, mask, eye protection", "Gown, mask or respirator, eye protection, gloves", "Mask, gloves, gown, eye protection", "Eye protection, gloves, gown, mask"], "a": 1, "w": "Don gown first, then mask or respirator, then eye protection, then gloves. Doffing reverses the logic: the most contaminated item, gloves, comes off first."}, {"q": "Which precautions are used for a resident with suspected active tuberculosis?", "o": ["Contact precautions with gown and gloves", "Droplet precautions with a surgical mask", "Airborne precautions with an N95 or higher and transfer to an appropriate setting", "Standard precautions only"], "a": 2, "w": "TB is airborne. It requires a fit-tested N95 or higher and a negative-pressure setting, which most ALFs cannot provide, so transfer is usually necessary."}, {"q": "You wiped a handrail with disinfectant and dried it immediately with a towel. Was it disinfected?", "o": ["Yes, as soon as the product touched it", "No — the surface must stay wet for the contact time on the product label", "Yes, if you used enough product", "Only if bleach was used"], "a": 1, "w": "Contact or dwell time is what kills organisms. Drying the surface early defeats the disinfectant."}, {"q": "Which finding most strongly suggests COVID-19 in an 88-year-old resident?", "o": ["Only a classic high fever and dry cough count", "New confusion, a fall, or refusing to eat can be the first sign", "Older adults do not get COVID-19", "Symptoms always appear before someone is contagious"], "a": 1, "w": "Presentation in older adults is often atypical — delirium, falls, or poor appetite may precede or replace respiratory symptoms. Transmission can also occur before symptoms appear."}, {"q": "A staff member wakes with a sore throat and mild cough before a shift in a memory care unit. What is correct?", "o": ["Come in and wear a mask without telling anyone", "Come in because the unit is short staffed", "Stay home, report the symptoms, and follow facility testing policy", "Come in but avoid only the sickest residents"], "a": 2, "w": "Working while symptomatic is a leading cause of outbreaks in congregate care. Report and follow the facility's policy."}, {"q": "How should soiled linen be handled?", "o": ["Shake it out to check for personal items", "Hold it away from your body, do not shake it, and bag it at the point of use", "Carry it in your arms to the laundry", "Rinse it in the resident's bathroom sink first"], "a": 1, "w": "Shaking aerosolizes organisms. Linen is bagged where it is removed and held away from your uniform."}, {"q": "Three residents on the same hall develop vomiting and diarrhea within 24 hours. What should you do?", "o": ["Wait to see if more become ill", "Report it to the nurse and administrator the same day as a possible outbreak", "Assume it was the food and say nothing", "Move all three into one room without telling anyone"], "a": 1, "w": "Clustered symptoms in time and place signal an outbreak and require same-day reporting so the facility can notify the county health department."}, {"q": "A new resident is documented as colonized with MRSA. Which response is appropriate?", "o": ["Keep him in his room and out of all activities permanently", "Refuse the admission", "Provide care with rigorous standard and contact precautions; colonization alone is not grounds for social isolation", "Tell other residents so they can avoid him"], "a": 2, "w": "Colonization is managed with precautions, not social exclusion — and disclosing his status to other residents would also be a privacy violation."}], "group": "alf", "skills": false}, {"id": "personalcare", "title": "Personal Care / Hygiene", "short": "Personal Care", "hours": 2, "certPre": "has completed 2 contact hrs. as required by FS 455.222(1)(a)", "certTitle": ["Personal Care/Hygiene"], "blurb": "Dignified, safe delivery of bathing, oral care, perineal care, skin monitoring, grooming, and transfers.", "body": [{"t": "h", "v": "1. Dignity is the technique"}, {"t": "p", "v": "Personal care is the most intimate work in the building. A resident who is bathed competently but without dignity has still been harmed. Florida's resident rights statute, section 429.28, guarantees privacy, courteous treatment, and participation in decisions about one's own care. In practice that means:"}, {"t": "ul", "v": ["Knock and wait for a response before entering. Announce yourself.", "Explain what you are about to do, in order, before you touch anyone.", "Close the door, close the curtain, and keep the resident covered except the area you are working on.", "Offer real choices: which shirt, shower now or after breakfast, which soap.", "Use the resident's preferred name. Not \"sweetie,\" not \"honey,\" not a diminutive nobody chose.", "Do not talk over the resident to a coworker while providing care, and never discuss another resident in the room."]}, {"t": "p", "v": "A resident has the right to refuse. A refusal is not a behavior problem; it is information. Try again later, try a different approach, find out what the objection actually is, and report a persistent refusal of hygiene so the team can address the cause — pain, cold, fear, depression, or cognitive change."}, {"t": "h", "v": "2. Bathing and showering"}, {"t": "ul", "v": ["Gather everything before you start. Leaving a wet resident alone to fetch a towel is how falls happen.", "Check water temperature at the wrist or with a thermometer — roughly 100 to 105 degrees Fahrenheit. Older skin burns faster and may not feel the heat.", "Wash from cleanest to dirtiest: face first, perineum last. Use a clean section of the washcloth for each eye, wiping inner to outer.", "Use a shower chair, non-slip mat, and grab bars. Keep the resident covered with a bath blanket between areas.", "Pat dry rather than rubbing, and dry thoroughly in skin folds, under the breasts, between the toes, and in the groin — trapped moisture causes breakdown and fungal infection.", "Apply lotion to dry skin, but never between the toes.", "Bathing is the best opportunity you will get to inspect the whole skin surface. Look deliberately."]}, {"t": "h", "v": "3. Oral care"}, {"t": "p", "v": "Oral care is done at least twice a day and is not optional for residents who are dependent. Poor mouth care leads to pain, tooth loss, poor appetite, and aspiration pneumonia — a leading cause of death in long-term care."}, {"t": "ul", "v": ["Brush teeth, gums, and tongue with a soft brush for two minutes.", "For dentures: remove, brush over a basin lined with a washcloth, rinse, and clean the gums and tongue before replacing. Store overnight in a labeled container with solution or water.", "For a resident who cannot swallow safely, use minimal moisture, suction if trained and available, and position upright — never lay a dependent resident flat for oral care.", "Report bleeding gums, loose teeth, sores, white patches, a bad odor, or refusal to eat."]}, {"t": "h", "v": "4. Perineal care and incontinence"}, {"t": "ul", "v": ["Wash front to back, always. For female residents, separate the labia and clean from front to back with a clean area of cloth on each stroke. For male residents, retract the foreskin if uncircumcised, clean the tip in a circular motion, and return the foreskin to position.", "Use warm water and mild cleanser; rinse and dry completely.", "Provide care promptly after every incontinence episode. Urine and stool on skin cause incontinence-associated dermatitis within hours.", "Apply a moisture-barrier product to at-risk skin as directed in the care plan.", "For an indwelling catheter: clean the perineum and the first few inches of tubing away from the body, keep the bag below the level of the bladder and off the floor, never disconnect the system, and avoid kinks. Report cloudy, bloody, or foul-smelling urine, no output, leaking, or pain.", "Never restrict a resident's fluids to reduce incontinence. It causes dehydration, confusion, constipation, and infection."]}, {"t": "h", "v": "5. Skin integrity and pressure injuries"}, {"t": "p", "v": "Pressure injuries develop where bone is close to the surface and pressure is not relieved: sacrum, coccyx, heels, hips, elbows, shoulder blades, ears, and the back of the head. Contributing factors are pressure, friction, shear, moisture, poor nutrition and hydration, and immobility."}, {"t": "ul", "v": ["<strong>Stage 1</strong> — intact skin with non-blanchable redness; on darker skin it may appear purple or blue, or feel warmer, firmer, boggier, or more painful than surrounding tissue.", "<strong>Stage 2</strong> — partial-thickness loss; a shallow open area or an intact or ruptured blister.", "<strong>Stage 3</strong> — full-thickness loss with visible fat.", "<strong>Stage 4</strong> — full-thickness loss exposing muscle, tendon, or bone.", "Also report unstageable wounds, suspected deep tissue injury (persistent maroon or purple discoloration), and moisture-associated damage."]}, {"t": "p", "v": "Prevention is repositioning at least every two hours in bed and every hour in a chair, floating heels off the mattress, keeping skin clean and dry, lifting rather than dragging during repositioning, avoiding the head of the bed above 30 degrees longer than needed, and supporting intake of food and fluids. Report every new skin change on the day you see it — color, blister, open area, bruise, swelling, warmth, rash, or a complaint of pain. Measuring, staging, and treating wounds is the nurse's job; finding them is yours."}, {"t": "h", "v": "6. Grooming, nails, and feet"}, {"t": "ul", "v": ["Hair care, shaving, and clean clothing are dignity items, not luxuries. Use an electric razor for residents on blood thinners or with bleeding risk.", "Clean under the nails and file them smooth as your facility policy allows.", "<strong>Do not cut the nails of any resident with diabetes or peripheral vascular disease, or any resident with thick, ingrown, or infected nails.</strong> Those nails are cut by a nurse or podiatrist. A small nick can end in an amputation.", "Inspect diabetic feet every day: between the toes, the heels, and the soles. Report any redness, blister, callus, crack, ulcer, discoloration, temperature difference, or loss of sensation immediately.", "Make sure shoes fit, are closed-toe, and are worn with socks. Residents should not walk in socks alone or in loose slippers."]}, {"t": "h", "v": "7. Toileting and body mechanics"}, {"t": "p", "v": "Offer toileting on a schedule rather than waiting for a request, especially for residents with cognitive impairment. Answer call bells promptly; a resident who gives up waiting is a resident who falls trying."}, {"t": "p", "v": "Protect yourself as well. Check the care plan for the resident's transfer status and weight-bearing ability before you touch them. Use a gait belt, never lift under the arms, keep your feet apart and your back straight, bend at the knees and hips, hold the resident close, and pivot rather than twist. If the care plan calls for two people or a mechanical lift, wait for help — the injury you prevent may be the resident's, and it may be yours."}, {"t": "h", "v": "8. Observe, report, document"}, {"t": "p", "v": "You see each resident more often than any nurse or physician will. Report the same day: new or worsening pain, any new skin finding, a change in appetite or fluid intake, a change in bowel or bladder pattern, new confusion or withdrawal, a new bruise or unexplained injury, difficulty swallowing, shortness of breath, and any fall — even one with no apparent injury."}, {"t": "p", "v": "Document what you observed, not what you concluded. \"Three-centimeter reddened area over the right heel, does not blanch, resident reports soreness; nurse notified at 09:15\" is useful. \"Skin looks bad\" is not. And remember that an unexplained injury, a fear reaction, or signs of neglect must be reported under Florida's mandatory abuse reporting law to the Florida Abuse Hotline at 1-800-96-ABUSE. Every person is a mandatory reporter; reporting is not conditional on your supervisor agreeing."}], "quiz": [{"q": "Which nails must you never cut?", "o": ["Nails of any resident over 80", "Nails of residents with diabetes or peripheral vascular disease, and thick, ingrown, or infected nails", "Only toenails", "Only nails that are painted"], "a": 1, "w": "Impaired circulation and sensation mean a small nick can become a non-healing ulcer or lead to amputation. Those nails are cut by a nurse or podiatrist."}, {"q": "What is the correct direction for perineal care?", "o": ["Back to front", "Front to back", "Whichever is faster", "In a circle from the anus outward"], "a": 1, "w": "Cleaning front to back avoids moving intestinal organisms toward the urethra, a common cause of urinary tract infection."}, {"q": "A resident has a reddened area over the sacrum that does not turn white when you press it. This is:", "o": ["Normal aging", "A Stage 1 pressure injury that must be reported today", "A bruise that needs no action", "Something to check again next week"], "a": 1, "w": "Non-blanchable redness over a bony prominence is a Stage 1 pressure injury. Report it the day you find it; staging and treatment are the nurse's role."}, {"q": "How often should a resident who is in bed and cannot reposition themselves be repositioned?", "o": ["Every shift", "At least every two hours", "Once a day during care", "Only when they complain"], "a": 1, "w": "At least every two hours in bed, and about hourly when sitting in a chair, with heels floated off the surface."}, {"q": "A resident refuses her shower for the third day in a row. What is the best response?", "o": ["Insist, because hygiene is required", "Document 'noncompliant' and move on", "Explore the reason, offer alternatives, and report the ongoing refusal to the nurse", "Wait until she is asleep and give a bed bath"], "a": 2, "w": "Residents have the right to refuse. Repeated refusal of hygiene often signals pain, fear, cold, depression, or cognitive change and needs to be reported, not overridden."}, {"q": "What is a safe water temperature range for bathing an older adult?", "o": ["Roughly 100 to 105 degrees Fahrenheit, checked before contact", "As hot as the resident can stand", "Whatever the tap gives", "Cold water to stimulate circulation"], "a": 0, "w": "Older skin is thinner and sensation may be reduced, so burns happen before the resident feels heat. Always check the temperature yourself."}, {"q": "Why is oral care important for a dependent resident?", "o": ["Only for appearance", "It prevents pain, tooth loss, poor appetite, and aspiration pneumonia", "It replaces the need for dental visits", "It is optional if the resident has dentures"], "a": 1, "w": "Bacteria from a neglected mouth are aspirated into the lungs. Aspiration pneumonia is a leading cause of death in long-term care."}, {"q": "Before transferring a resident, what should you check first?", "o": ["Whether anyone is watching", "The care plan for transfer status, weight-bearing, and number of staff required", "The resident's shoe size", "Nothing — just lift under the arms"], "a": 1, "w": "The care plan tells you what is safe. Lifting under the arms can dislocate a shoulder, and attempting a two-person transfer alone injures both of you."}, {"q": "A resident with diabetes has a small blister on her heel from a new shoe. What do you do?", "o": ["Pop it and apply a bandage", "Report it to the nurse immediately and keep pressure off it", "Wait to see if it heals on its own", "Apply lotion between the toes"], "a": 1, "w": "In a diabetic foot, any break in the skin can progress to a deep ulcer. Report immediately and offload the area; never pop a blister."}, {"q": "You notice an unexplained bruise in the shape of a handprint on a resident's upper arm. What is required?", "o": ["Ask the resident not to mention it", "Report it as suspected abuse, including to the Florida Abuse Hotline at 1-800-96-ABUSE", "Only tell your supervisor if you are certain", "Document it and take no further action"], "a": 1, "w": "Florida makes every person a mandatory reporter of suspected abuse, neglect, or exploitation of a vulnerable adult. Reporting does not require certainty or a supervisor's approval."}], "group": "alf", "skills": false}, {"id": "hivaids", "title": "HIV/AIDS Seminar", "short": "HIV/AIDS", "hours": 4, "certPre": "has completed 4 hrs. OSHA & Blood Borne Pathogens as required by FS 455.222(1)(b)", "certTitle": ["HIV/AIDS Seminar"], "blurb": "Transmission and prevention, modern treatment, occupational exposure response, and Florida's HIV confidentiality law.", "body": [{"t": "h", "v": "1. Why this course is required"}, {"t": "p", "v": "Section 455.222, Florida Statutes, requires health care workers regulated by the Department of Health to complete education on HIV and AIDS, and Florida remains one of the states with the highest number of new diagnoses in the country, with South Florida among the most affected metropolitan areas. For anyone working in residential care, this is not academic: residents living with HIV are aging into assisted living in growing numbers, and the occupational exposure procedures in this course are the same ones that protect you from hepatitis B and C."}, {"t": "h", "v": "2. The virus and the disease"}, {"t": "p", "v": "HIV — human immunodeficiency virus — is a retrovirus that infects CD4 T-lymphocytes, the cells that coordinate the immune response. Untreated, it replicates continuously and destroys those cells, and over years the immune system loses the ability to control infections and certain cancers."}, {"t": "p", "v": "HIV and AIDS are not the same thing. AIDS — acquired immunodeficiency syndrome — is a stage of HIV infection, defined by a CD4 count below 200 cells per microliter or by the presence of a specified opportunistic illness such as Pneumocystis pneumonia, esophageal candidiasis, Kaposi sarcoma, cryptococcal meningitis, or disseminated Mycobacterium avium complex. A person on effective treatment may never progress to AIDS, and a person who once met the AIDS definition can recover substantial immune function on treatment."}, {"t": "ul", "v": ["<strong>Acute infection</strong> — two to four weeks after exposure, many people develop a flu-like or mononucleosis-like illness: fever, sore throat, rash, swollen nodes, muscle aches. Viral load is extremely high and transmission risk is at its peak. Many people, and many clinicians, mistake this for a common virus.", "<strong>Chronic infection</strong> — the virus continues to replicate, often with no symptoms, for years. Without treatment, the median time to AIDS is roughly a decade.", "<strong>AIDS</strong> — advanced immunodeficiency, with opportunistic infections and malignancies."]}, {"t": "h", "v": "3. How HIV is transmitted"}, {"t": "p", "v": "Only certain body fluids transmit HIV: blood, semen, pre-seminal fluid, rectal fluids, vaginal fluids, and breast milk. For transmission to occur, one of those fluids from a person with a detectable viral load must reach a mucous membrane, damaged tissue, or the bloodstream directly."}, {"t": "ul", "v": ["Anal or vaginal sex without a condom or without effective prevention. Receptive anal sex carries the highest per-act sexual risk.", "Sharing needles, syringes, or other injection equipment.", "Perinatal transmission during pregnancy, birth, or breastfeeding — now preventable in nearly all cases with treatment.", "Occupational exposure: a needlestick or sharps injury, or a splash of blood or other infectious material to the eyes, nose, mouth, or non-intact skin.", "Transfusion or transplant, now extremely rare in the United States because of donor screening."]}, {"t": "h", "v": "4. How HIV is NOT transmitted"}, {"t": "p", "v": "This matters as much as the transmission list, because false beliefs drive the mistreatment of residents and coworkers:"}, {"t": "ul", "v": ["Not by hugging, shaking hands, or sharing a bed or bathroom.", "Not by saliva, tears, sweat, urine, or feces that contain no visible blood.", "Not by sharing dishes, utensils, food, or drinking glasses.", "Not by toilet seats, doorknobs, laundry, or swimming pools.", "Not by mosquitoes, ticks, or any other insect.", "Not by coughing, sneezing, or breathing the same air.", "Not by closed-mouth kissing. Deep kissing carries a theoretical risk only if both people have significant bleeding in the mouth."]}, {"t": "h", "v": "5. Testing"}, {"t": "ul", "v": ["<strong>Antigen/antibody laboratory test</strong> — the standard fourth-generation test, detecting both the p24 antigen and antibodies, typically positive 18 to 45 days after exposure.", "<strong>Nucleic acid test (NAT)</strong> — detects the virus itself, positive as early as 10 to 33 days; used for acute infection and for confirming indeterminate results.", "<strong>Rapid antibody tests</strong> — blood or oral fluid, results in minutes; oral fluid tests take longer to turn positive. A reactive rapid test is a preliminary result and must be confirmed.", "<strong>Window period</strong> — the interval after infection when a test can still be negative even though the person is infected and may be highly infectious. A negative test does not rule out a recent exposure; repeat testing is required."]}, {"t": "p", "v": "The CDC recommends that everyone aged 13 to 64 be tested at least once as part of routine care, and that people with ongoing risk be tested at least annually. Under Florida law, HIV testing in a health care setting may be performed with the patient's general consent to care after the patient is notified that the test is planned and informed of the right to decline — a separate signed HIV consent form is no longer required in that setting."}, {"t": "h", "v": "6. Treatment: what has actually changed"}, {"t": "p", "v": "Antiretroviral therapy (ART) — usually a single daily pill combining several drugs, and increasingly a long-acting injection given every one or two months — suppresses HIV replication. With consistent treatment, a person's viral load becomes undetectable, the immune system recovers, and life expectancy approaches that of people without HIV. Treatment is now recommended for everyone with HIV, immediately on diagnosis, regardless of CD4 count."}, {"t": "p", "v": "<strong>Undetectable equals untransmittable.</strong> A person who maintains a durably undetectable viral load does not transmit HIV sexually. This is established science, not reassurance, and it is one reason adherence support is a clinical priority. Missing doses, in contrast, allows the virus to rebound and can allow drug resistance to develop."}, {"t": "p", "v": "In a residential care setting, your role in treatment is adherence and privacy: doses on time, refills never allowed to run out, side effects reported, and the resident's status never discussed where others can hear."}, {"t": "h", "v": "7. Prevention"}, {"t": "ul", "v": ["<strong>Condoms</strong>, used consistently and correctly.", "<strong>PrEP</strong> — pre-exposure prophylaxis: a daily pill or a long-acting injection for people without HIV who are at ongoing risk, reducing sexual acquisition by about 99 percent when taken as prescribed.", "<strong>PEP</strong> — post-exposure prophylaxis: a 28-day antiretroviral course started as soon as possible after a possible exposure and <strong>no later than 72 hours</strong>. Sooner is better; hours matter.", "<strong>Treatment as prevention</strong> — viral suppression in a person with HIV prevents onward sexual transmission.", "<strong>Sterile syringe access</strong> and never sharing injection equipment.", "<strong>Perinatal prophylaxis</strong> — maternal ART plus infant prophylaxis reduces transmission to under one percent."]}, {"t": "h", "v": "8. Occupational exposure — what to do"}, {"t": "p", "v": "An exposure incident is a needlestick or other sharps injury, a splash of blood or other potentially infectious material to the eye, nose, or mouth, or contact with non-intact skin. The average risk of HIV transmission from a percutaneous needlestick with HIV-infected blood is about 0.3 percent — roughly 1 in 300 — and lower for mucous membrane exposure. For hepatitis B, in an unvaccinated worker, the risk is far higher, up to about 30 percent."}, {"t": "ul", "v": ["<strong>Immediately</strong> wash the wound with soap and running water; flush mucous membranes with water or saline for 15 minutes. Do not squeeze the wound, and do not apply bleach or caustics.", "<strong>Report it right away</strong> to your supervisor and follow the facility's exposure control plan. Time is the variable you can still change.", "<strong>Seek medical evaluation the same day.</strong> The evaluating clinician decides on HIV PEP, which should start within hours and no later than 72 hours, and on hepatitis B immune globulin and vaccine as indicated.", "<strong>Source testing</strong> is arranged per law and policy — you do not test or interrogate the resident yourself.", "<strong>Follow-up testing</strong> is typically at baseline, six weeks, twelve weeks, and six months (schedules vary with the test generation used and the clinician's judgment).", "The evaluation, PEP, and follow-up are provided <strong>at no cost to you</strong> under the OSHA bloodborne pathogens standard, and your medical records are confidential.", "The injury is recorded on the facility's sharps injury log and, where applicable, the OSHA 300 log."]}, {"t": "note", "v": "The most common reason a worker does not receive PEP in time is that they did not report the exposure the day it happened. There is no penalty for reporting. There is no way to undo a delay."}, {"t": "h", "v": "9. Florida law: confidentiality of HIV information"}, {"t": "p", "v": "Section 381.004, Florida Statutes, gives HIV test results and HIV status a level of protection above ordinary medical confidentiality. The identity of a person upon whom an HIV test is performed, and the test result, may not be disclosed except as specifically authorized by law — generally requiring the subject's <strong>separate, specific written authorization</strong> naming the release of HIV information. A general medical records release is not sufficient. Limited exceptions exist for treating providers, certain public health reporting, and specified legal circumstances."}, {"t": "ul", "v": ["You may not tell another resident, a resident's family member, your own family, or a coworker who is not involved in that resident's care.", "You may not post it, text it, or discuss it in a hallway, break room, or parking lot.", "Unauthorized disclosure is a violation of Florida law that can carry criminal penalties and disciplinary action against a professional license, in addition to HIPAA consequences.", "The same discipline applies to hepatitis and to any other diagnosis: if repeating it does not serve the resident's care, do not repeat it."]}, {"t": "h", "v": "10. Stigma, rights, and good care"}, {"t": "p", "v": "HIV is a disability under the Americans with Disabilities Act. Refusing to admit, refusing to care for, isolating socially, or assigning separate dishes or bathrooms to a resident because of HIV status is discrimination, and it is also clinically pointless — standard precautions already protect you. Residents aging with HIV often carry decades of experience of being treated as contagious; the quality of your ordinary, unremarkable care is the intervention."}, {"t": "p", "v": "Clinically, watch for the comorbidities that accompany long-term HIV and aging: cardiovascular disease, bone loss and fracture risk, kidney disease, diabetes, neurocognitive changes, depression, and polypharmacy interactions with antiretrovirals. Screen and report as you would for any resident."}, {"t": "h", "v": "11. Co-infections you should know"}, {"t": "ul", "v": ["<strong>Tuberculosis</strong> — the leading cause of death worldwide among people with HIV. A new cough, night sweats, fever, or weight loss in a resident with HIV warrants prompt evaluation and airborne precautions until TB is ruled out.", "<strong>Hepatitis B</strong> — shares transmission routes; vaccination is available and must be offered to you free of charge by your employer.", "<strong>Hepatitis C</strong> — shares blood-borne transmission, common in people who inject drugs, and now curable in most cases with direct-acting antivirals."]}], "quiz": [{"q": "Which of the following transmits HIV?", "o": ["Saliva with no visible blood", "Blood, semen, rectal and vaginal fluids, and breast milk", "Sweat and tears", "Mosquito bites"], "a": 1, "w": "Only blood, semen and pre-seminal fluid, rectal fluid, vaginal fluid, and breast milk transmit HIV. Saliva, sweat, tears, and insects do not."}, {"q": "What defines a diagnosis of AIDS?", "o": ["Any positive HIV test", "A CD4 count below 200, or a specified opportunistic illness", "Symptoms lasting more than a year", "A detectable viral load"], "a": 1, "w": "AIDS is a stage of HIV infection defined by a CD4 count under 200 cells/µL or the presence of an AIDS-defining opportunistic condition."}, {"q": "You sustain a needlestick from a resident's lancet. What is the FIRST thing you do?", "o": ["Squeeze the wound to force out blood", "Wash the wound with soap and running water", "Apply bleach to the site", "Finish your shift and report it tomorrow"], "a": 1, "w": "Wash immediately with soap and water — do not squeeze or apply caustic agents — then report right away and get medical evaluation the same day."}, {"q": "What is the outside time limit for starting HIV post-exposure prophylaxis?", "o": ["Within 2 weeks", "Within 7 days", "As soon as possible and no later than 72 hours", "There is no time limit"], "a": 2, "w": "PEP must begin as soon as possible and no later than 72 hours after exposure. Every hour of delay reduces its effectiveness."}, {"q": "Approximately what is the risk of HIV transmission from a single needlestick with HIV-infected blood?", "o": ["About 30 percent", "About 0.3 percent", "About 50 percent", "Essentially 100 percent"], "a": 1, "w": "About 0.3 percent, or roughly 1 in 300. Hepatitis B risk in an unvaccinated worker is far higher, up to about 30 percent."}, {"q": "A resident's daughter asks you directly whether her mother has HIV. What is correct under Florida law?", "o": ["Answer honestly since she is family", "Confirm it only if the resident is not in the room", "Do not disclose; HIV information requires the resident's specific written authorization", "Refer her to another resident who might know"], "a": 2, "w": "Section 381.004 requires specific written authorization to release HIV information. Family relationship alone does not authorize disclosure."}, {"q": "What does 'undetectable equals untransmittable' mean?", "o": ["The person is cured of HIV", "A person with a durably undetectable viral load does not transmit HIV sexually", "HIV tests will now be negative", "Treatment can be stopped safely"], "a": 1, "w": "Durable viral suppression prevents sexual transmission. The person still has HIV and must continue treatment."}, {"q": "The 'window period' means:", "o": ["The time you have to start PEP", "The interval after infection when a test may still be negative", "The time HIV survives on a surface", "The period when ART must be taken each day"], "a": 1, "w": "During the window period a person is infected — often with a very high viral load — but the test may not yet be positive, so a negative result does not rule out recent exposure."}, {"q": "Which is appropriate care for a resident living with HIV in an ALF?", "o": ["Separate dishes and a dedicated bathroom", "Exclusion from group dining and activities", "Standard precautions and the same care as any other resident", "Posting the diagnosis on the door so staff are aware"], "a": 2, "w": "Standard precautions are sufficient. Separate dishes, social exclusion, and posting a diagnosis are discriminatory and, in the case of posting, also illegal disclosure."}, {"q": "PrEP is:", "o": ["Treatment for someone who already has HIV", "Medication taken by a person without HIV to prevent acquiring it", "A vaccine against HIV", "The 28-day course taken after an exposure"], "a": 1, "w": "PrEP is pre-exposure prophylaxis for people without HIV at ongoing risk. The 28-day course after an exposure is PEP."}, {"q": "A resident with HIV develops a new cough, night sweats, and weight loss. What should you consider and do?", "o": ["Nothing — these are normal in HIV", "Possible tuberculosis; report immediately and follow airborne precautions until ruled out", "Encourage more fluids and recheck in a month", "Assume it is a side effect of ART"], "a": 1, "w": "TB is the leading cause of death worldwide among people with HIV. These symptoms require prompt evaluation and airborne precautions until TB is excluded."}, {"q": "Who pays for your medical evaluation and follow-up testing after an occupational exposure?", "o": ["The employee, through health insurance", "The employer, at no cost to the employee, under the OSHA bloodborne pathogens standard", "The resident's family", "No one; follow-up is optional"], "a": 1, "w": "The OSHA bloodborne pathogens standard requires the employer to provide confidential post-exposure evaluation, prophylaxis, and follow-up at no cost to the employee."}], "group": "alf", "skills": false}, {"id": "dnro", "title": "Do Not Resuscitate Orders / Advance Directives", "short": "DNRO / Advance Directives", "hours": 1, "certPre": "has completed 1 Hr. of training course following ALF standards-Rules 59A-36.011 Facility Policies and Procedures regarding DNROs during resident's admissions in the facility.", "certTitle": ["Do Not Resuscitate Orders/Advance Directives"], "blurb": "Florida's DNRO form, advance directive types, what staff must do at admission, and what to do in an emergency.", "body": [{"t": "h", "v": "1. The requirement"}, {"t": "p", "v": "Rule 59A-36.011, Florida Administrative Code, requires an assisted living facility to have written policies and procedures for do not resuscitate orders, to address them during the resident's admission, and to train staff on them. Chapter 765, Florida Statutes, governs advance directives generally. This course covers what the documents are, what the facility must do, and what you personally must do when seconds matter."}, {"t": "h", "v": "2. The Florida DNRO"}, {"t": "p", "v": "A do not resuscitate order in Florida is documented on <strong>Department of Health Form DH 1896</strong>. For it to be honored, including by emergency medical services:"}, {"t": "ul", "v": ["It must be printed on <strong>yellow paper</strong> — the original, or a copy reproduced on yellow paper. A white photocopy is not honored by EMS.", "It must be signed by the resident's <strong>physician</strong>.", "It must be signed by the <strong>resident</strong>, or, if the resident is incapacitated, by the health care surrogate, proxy, court-appointed guardian, or attorney-in-fact with that authority.", "It does not expire, but it should be reviewed periodically and whenever the resident's condition or wishes change.", "A miniature wallet-card version is also issued and is equally valid."]}, {"t": "h", "v": "3. What a DNRO does and does not mean"}, {"t": "p", "v": "A DNRO means one thing: do not attempt cardiopulmonary resuscitation if the resident's heart or breathing stops. It is an instruction about resuscitation only."}, {"t": "p", "v": "A DNRO does <strong>not</strong> mean any of the following:"}, {"t": "ul", "v": ["It does not mean do not treat. The resident still receives medication, wound care, antibiotics, oxygen, and any other ordered treatment.", "It does not mean do not feed, do not reposition, or do not provide personal care.", "It does not mean withhold comfort measures. Pain control, positioning, oral care, warmth, and presence are always provided.", "It does not mean do not respond. If a resident falls, chokes on food, bleeds, or has trouble breathing while still having a pulse, you respond fully — including clearing an obstructed airway, controlling bleeding, and summoning help.", "It does not mean do not call 911. Emergency services may still be needed for evaluation, comfort, and transport, and they will honor a valid DNRO on presentation."]}, {"t": "note", "v": "The most dangerous misunderstanding in a residential setting is treating a DNRO as a general \"do nothing\" order. It applies only to CPR."}, {"t": "h", "v": "4. Advance directives — the other documents"}, {"t": "ul", "v": ["<strong>Living will</strong> — the resident's written statement about the life-prolonging procedures they want or do not want if they have a terminal condition, end-stage condition, or persistent vegetative state. It guides future decisions; it is not itself an order to withhold CPR today.", "<strong>Designation of health care surrogate</strong> — names the person who makes health care decisions if the resident cannot. Under Florida law a surrogate may also be designated to act while the resident retains capacity, if the document says so.", "<strong>Durable power of attorney</strong> — may include health care authority, depending on how it is written.", "<strong>Preneed guardian declaration</strong> — names who the resident wants appointed as guardian if a court ever needs to appoint one.", "<strong>Anatomical donation</strong> — organ and tissue donation wishes.", "<strong>DNRO (DH 1896)</strong> — a physician's order, effective now. This is the only one of these documents that directs staff and EMS to withhold CPR."]}, {"t": "p", "v": "If a resident has no advance directive and cannot make decisions, Florida section 765.401 sets a proxy order: judicially appointed guardian, spouse, adult child (or a majority of adult children), parent, adult sibling, adult relative, then a close friend, and finally a licensed clinical social worker selected through the facility's bioethics process."}, {"t": "h", "v": "5. What the facility must do at admission"}, {"t": "ul", "v": ["Ask whether the resident has an advance directive or a DNRO and document the answer in the record.", "Provide written information about advance directives and the facility's policy.", "Obtain a copy of any existing document and file it where staff can find it immediately — the front of the record, flagged, with the yellow DNRO readily retrievable.", "Never condition admission or care on whether the resident has or does not have an advance directive.", "Honor the resident's right to have no advance directive at all. Nobody may be pressured into signing one.", "Re-check at every significant change in condition, and after any hospitalization, since documents are frequently lost in transfer."]}, {"t": "h", "v": "6. Revocation"}, {"t": "p", "v": "A resident may revoke a DNRO or an advance directive <strong>at any time, by any means</strong> — tearing up the form, saying so out loud, telling a family member, or expressing the intent in any way. Revocation does not require a writing, a witness, or a physician's signature. If a resident revokes, remove the form from the record immediately, notify the nurse, administrator, and physician, and document what the resident said and when. A resident who says \"I've changed my mind, I want everything done\" is to be resuscitated, regardless of what is in the chart."}, {"t": "h", "v": "7. What you do in an emergency"}, {"t": "ul", "v": ["Call for help and check responsiveness, breathing, and pulse.", "If there is no pulse and no breathing, and you do not have immediate confirmation of a valid DNRO, <strong>begin CPR</strong> and activate 911. The default is to resuscitate.", "If a valid yellow DH 1896 is present, do not begin chest compressions or rescue breathing. Stay with the resident, provide comfort, notify the supervisor, nurse, family, and physician, and follow facility policy on calling 911.", "Hand the yellow form to EMS on arrival, or have it with the resident during transport.", "Document the time, what you found, what was done, what was withheld, the presence of the DNRO, and every person notified."]}, {"t": "h", "v": "8. The errors that actually happen"}, {"t": "ul", "v": ["The DNRO cannot be found when it is needed — filed in a back office, in a locked cabinet, or still in the resident's suitcase.", "The only copy is a white photocopy, which EMS will not honor.", "The form is unsigned by the physician or by the resident or surrogate.", "The resident came back from the hospital with a different code status than the one on file, and nobody reconciled it.", "Staff withheld ordinary care — food, repositioning, oxygen, a 911 call for a fall — because the resident \"is a DNR.\"", "A family member's verbal wish was followed instead of the resident's documented wish. The resident's own valid directive governs."]}, {"t": "p", "v": "If you are ever unsure whether a DNRO is valid or applies, the answer is to resuscitate and call 911. That is the legally and ethically defensible default, and it is the facility's policy in every case of genuine doubt."}], "quiz": [{"q": "A valid Florida DNRO must be:", "o": ["Any written note signed by the family", "Form DH 1896 on yellow paper, signed by the physician and the resident or authorized surrogate", "A verbal order documented by staff", "A living will kept in the chart"], "a": 1, "w": "Florida requires DH Form 1896, on yellow paper, with the physician's signature and the signature of the resident or an authorized decision-maker."}, {"q": "A resident with a valid DNRO falls and is bleeding from a scalp laceration. She is awake and talking. What do you do?", "o": ["Nothing, because she has a DNRO", "Provide first aid, control bleeding, notify the nurse, and call 911 as indicated", "Wait for the family to decide", "Only document the fall"], "a": 1, "w": "A DNRO applies only to CPR when the heart and breathing have stopped. All other care, including emergency response, continues fully."}, {"q": "Which document is a physician's order that is effective immediately?", "o": ["A living will", "A designation of health care surrogate", "A DNRO on Form DH 1896", "A preneed guardian declaration"], "a": 2, "w": "Only the DNRO is a current physician order directing that CPR be withheld. A living will guides future decisions about life-prolonging procedures."}, {"q": "A resident tells you, 'I tore up that yellow paper — I want everything done now.' What is the effect?", "o": ["No effect until a new physician order is signed", "No effect because revocation requires a witness", "The DNRO is revoked; notify the nurse and physician, document it, and resuscitate if needed", "It only counts if the family agrees"], "a": 2, "w": "A resident may revoke at any time by any means, with no writing or witness required. The revocation takes effect immediately."}, {"q": "You find a resident unresponsive with no pulse. You cannot locate any DNRO. What do you do?", "o": ["Wait for the nurse before doing anything", "Search the chart until you find something", "Begin CPR and activate 911", "Assume he is a DNR because he is elderly"], "a": 2, "w": "The default is always to resuscitate. If a valid DNRO is not immediately available, begin CPR and call 911."}, {"q": "Which statement about advance directives at admission is correct?", "o": ["A resident may be required to sign one before admission", "The facility must ask, document, provide information, and never condition care on having one", "Only residents over 80 need to be asked", "The facility decides the resident's code status"], "a": 1, "w": "The facility must inquire and document, provide written information, and may never condition admission or care on the existence of an advance directive."}], "group": "alf", "skills": false}, {"id": "osha", "title": "OSHA Standards / Bloodborne Pathogens", "short": "OSHA / Bloodborne Pathogens", "hours": 5, "certPre": "has completed 5 Contact Hrs. as required by F.S 455.222(1)(b)", "certTitle": ["OSHA Standards/Bloodborne Pathogens"], "blurb": "The bloodborne pathogens standard, exposure control, hepatitis B vaccination, sharps safety, hazard communication, and your rights as an employee.", "body": [{"t": "h", "v": "1. What OSHA is and what it guarantees you"}, {"t": "p", "v": "The Occupational Safety and Health Act of 1970 created OSHA and gave every covered worker the right to a workplace free of recognized hazards. Two provisions matter most day to day:"}, {"t": "ul", "v": ["The <strong>General Duty Clause</strong> requires employers to keep the workplace free from recognized hazards likely to cause death or serious physical harm, even where no specific standard exists.", "Specific standards, such as the bloodborne pathogens standard at 29 CFR 1910.1030, impose detailed requirements."]}, {"t": "p", "v": "Your rights as an employee include: training in a language and vocabulary you understand, at no cost and during working hours; access to your own exposure and medical records; access to safety data sheets; the right to see the OSHA poster and injury records; the right to file a complaint and request an inspection; and protection from retaliation for doing any of that. Retaliation for reporting a hazard or an injury is itself a violation, and a complaint can be filed with OSHA within 30 days."}, {"t": "h", "v": "2. Scope of the bloodborne pathogens standard"}, {"t": "p", "v": "The standard covers employees with reasonably anticipated occupational exposure to blood or other potentially infectious materials (OPIM). OPIM includes semen, vaginal secretions, cerebrospinal, synovial, pleural, pericardial, peritoneal, and amniotic fluid, saliva in dental procedures, any body fluid visibly contaminated with blood, any body fluid where it is impossible to tell one from another, and unfixed human tissue."}, {"t": "p", "v": "Feces, nasal secretions, sputum, sweat, tears, urine, and vomit are <em>not</em> OPIM under the standard unless they contain visible blood — though standard precautions and basic infection control still require gloves and hand hygiene for all of them."}, {"t": "h", "v": "3. The Exposure Control Plan"}, {"t": "p", "v": "Every covered employer must have a written Exposure Control Plan. It must be:"}, {"t": "ul", "v": ["Accessible to employees during working hours — you may ask for it and must be shown it.", "Reviewed and updated at least annually, and whenever new tasks or procedures change exposure risk.", "Specific about the <strong>exposure determination</strong>: which job classifications and tasks involve occupational exposure, made without regard to personal protective equipment.", "Documentation of the employer's consideration and implementation of safer medical devices, with input solicited from frontline, non-managerial employees who use those devices — a requirement added by the Needlestick Safety and Prevention Act of 2000.", "Inclusive of the procedure for evaluating an exposure incident."]}, {"t": "h", "v": "4. The three pathogens that drive the standard"}, {"t": "ul", "v": ["<strong>Hepatitis B (HBV)</strong> — the most infectious of the three. It can survive in dried blood on a surface for at least seven days. Risk from a single needlestick from an infected source in an unvaccinated worker runs from roughly 6 to 30 percent depending on the source's antigen status. It is also the only one of the three that is vaccine-preventable.", "<strong>Hepatitis C (HCV)</strong> — transmission risk from a needlestick is roughly 1.8 percent. No vaccine exists, but the infection is curable in most cases with direct-acting antiviral therapy.", "<strong>HIV</strong> — transmission risk from a needlestick is roughly 0.3 percent, and lower for mucous membrane exposure. Post-exposure prophylaxis is highly effective when started promptly."]}, {"t": "h", "v": "5. Hepatitis B vaccination — your entitlement"}, {"t": "ul", "v": ["Must be <strong>offered at no cost</strong> to every employee with occupational exposure, within 10 working days of initial assignment, after training.", "The series is three doses (or two doses of the newer adjuvanted vaccine) over several months.", "Post-vaccination antibody testing is provided where indicated.", "If you decline, you must sign the OSHA-mandated declination statement — and you may change your mind and receive the vaccine free of charge at any later time while still employed in a covered position.", "The employer may not require you to use your own insurance or to pay a share."]}, {"t": "h", "v": "6. Engineering controls"}, {"t": "p", "v": "Engineering controls remove or isolate the hazard, and they take priority over relying on individual behavior:"}, {"t": "ul", "v": ["Sharps disposal containers that are closable, puncture-resistant, leak-proof, labeled or color-coded, upright, and replaced before they are full — never filled past the fill line, and never reached into.", "Safer devices: retractable or shielded needles, needleless connectors, safety lancets, blunt fill needles.", "Handwashing facilities that are readily accessible, or antiseptic hand cleanser and towels where plumbing is not feasible.", "Splash guards, biohazard-labeled containers for specimens, and sealed secondary containment."]}, {"t": "h", "v": "7. Work practice controls"}, {"t": "ul", "v": ["<strong>Never recap, bend, shear, or break a used needle</strong>, and never remove a needle from a syringe by hand.", "Dispose of sharps immediately in the container at the point of use. Do not walk with an unprotected sharp, and do not lay one on a table \"for a second.\"", "No eating, drinking, smoking, applying cosmetics or lip balm, or handling contact lenses in areas where exposure is reasonably anticipated.", "No food or drink in refrigerators, freezers, cabinets, shelves, or countertops where blood or OPIM is kept.", "No mouth pipetting or suctioning of any kind.", "Perform procedures that could splash in a way that minimizes splashing, spraying, and aerosol generation.", "Wash hands immediately after removing gloves and as soon as possible after any skin contact with blood or OPIM."]}, {"t": "h", "v": "8. PPE under the standard"}, {"t": "p", "v": "PPE must be provided by the employer at <strong>no cost</strong>, in appropriate sizes, readily accessible, and in alternatives for employees who are allergic — for example, non-latex gloves and powderless glove liners. The employer is responsible for cleaning, laundering, repair, replacement, and disposal. You may never be charged, and you may never take contaminated PPE or clothing home to launder."}, {"t": "ul", "v": ["Replace gloves as soon as they are torn, punctured, or compromised, and never wash or decontaminate disposable gloves for reuse.", "Utility gloves may be decontaminated and reused until they show cracking, peeling, tearing, or puncture.", "Remove all PPE before leaving the work area, and place it in the designated container.", "If a garment is penetrated by blood, remove it immediately, or as soon as feasible."]}, {"t": "h", "v": "9. Housekeeping, labels, and regulated waste"}, {"t": "ul", "v": ["Written schedule for cleaning and decontamination, based on location, type of surface, type of soil, and the tasks performed.", "Decontaminate work surfaces with an appropriate disinfectant after completing procedures, immediately after any spill, and at the end of the shift if contamination may have occurred.", "Protective coverings such as plastic wrap or foil are removed and replaced when contaminated.", "Never pick up broken glassware by hand: use a brush and dustpan, tongs, or forceps.", "Biohazard warning labels — fluorescent orange or orange-red with the biohazard symbol — go on containers of regulated waste, refrigerators and freezers holding blood or OPIM, and containers used to store, transport, or ship it. Red bags or red containers may substitute for labels.", "<strong>Regulated waste</strong> means liquid or semi-liquid blood or OPIM, items caked with dried blood capable of releasing it, contaminated sharps, and pathological or microbiological waste. A soiled incontinence brief is generally ordinary waste under the standard unless it is saturated with blood; follow your facility policy.", "Contaminated laundry is bagged or containerized at the location of use, handled as little as possible, never sorted or rinsed in the resident area, and labeled or color-coded."]}, {"t": "h", "v": "10. Responding to an exposure incident"}, {"t": "p", "v": "An exposure incident is specific eye, mouth, other mucous membrane, non-intact skin, or parenteral contact with blood or OPIM. The employer must make available a confidential medical evaluation and follow-up immediately, at no cost, and it must include:"}, {"t": "ul", "v": ["Documentation of the route of exposure and the circumstances.", "Identification and testing of the source individual, where feasible and permitted by law, with results given to you as allowed.", "Collection and testing of your blood for HBV and HIV serological status, with your consent.", "Post-exposure prophylaxis as medically indicated — HIV PEP started within hours and no later than 72 hours; hepatitis B immune globulin and vaccine per the current schedule.", "Counseling and evaluation of any reported illness.", "A written opinion from the evaluating health care professional, given to you within 15 days.", "Entry in the <strong>Sharps Injury Log</strong>, which records the type and brand of device, the department or work area, and how the incident occurred, maintained so as to protect your identity — and, where the injury meets the criteria, on the OSHA 300 log."]}, {"t": "note", "v": "Report every exposure the day it happens, even if it looks trivial. Prophylaxis, source testing, and your own legal protections all depend on the report existing."}, {"t": "h", "v": "11. Hazard Communication and chemicals"}, {"t": "p", "v": "The Hazard Communication Standard, 29 CFR 1910.1200, aligned with the Globally Harmonized System, applies to the disinfectants, bleach, oxygen, glutaraldehyde, cleaning chemicals, and pesticides in your building. It requires:"}, {"t": "ul", "v": ["A written hazard communication program and a chemical inventory.", "A <strong>Safety Data Sheet</strong> for every hazardous chemical, in a standard 16-section format, accessible to you at all times during your shift — not locked in an office.", "Container labels with the product identifier, signal word (Danger or Warning), hazard statements, precautionary statements, pictograms, and supplier information. Any secondary container you pour into must also be labeled.", "Training on the hazards, the labels, the pictograms, and the protective measures, before exposure and whenever a new hazard is introduced.", "Never mix bleach with ammonia or with acidic cleaners — the result is chlorine or chloramine gas, and this has killed housekeeping staff."]}, {"t": "h", "v": "12. Other OSHA requirements that apply in residential care"}, {"t": "ul", "v": ["<strong>Respiratory protection (1910.134)</strong> — if you must wear an N95, the employer owes you a medical evaluation, fit testing, and training. A surgical mask requires none of these because it is not a respirator.", "<strong>Emergency action plan (1910.38)</strong> — evacuation routes, assembly points, alarm system, and assigned roles.", "<strong>Ergonomics and safe resident handling</strong> — patient handling is the leading cause of musculoskeletal injury in this industry. Mechanical lifts, gait belts, two-person transfers, and adequate staffing are the controls.", "<strong>Workplace violence</strong> — health care and social service workers experience a large share of all workplace violence injuries. Report every incident, including verbal threats and resident aggression.", "<strong>Tuberculosis</strong> — screening, airborne precautions, and respiratory protection where TB is suspected.", "<strong>Recordkeeping</strong> — training records kept 3 years; employee medical and exposure records kept for the duration of employment plus 30 years; the OSHA 300 log maintained and the annual summary posted from February 1 through April 30."]}, {"t": "h", "v": "13. Training frequency"}, {"t": "p", "v": "Bloodborne pathogens training is required at the time of initial assignment to tasks with occupational exposure, <strong>at least annually thereafter</strong>, and additionally whenever changes in tasks or procedures affect exposure. Training must be interactive — you must have an opportunity to ask questions of a knowledgeable person — and must be provided at no cost during working hours."}], "quiz": [{"q": "Which bloodborne pathogen is vaccine-preventable?", "o": ["HIV", "Hepatitis C", "Hepatitis B", "All three"], "a": 2, "w": "Only hepatitis B has a vaccine, and the employer must offer it free of charge within 10 working days of initial assignment."}, {"q": "Your employer offers the hepatitis B vaccine and you decline. What happens?", "o": ["You lose the right to it permanently", "You sign a declination form and may still receive it free later while employed in a covered position", "You must pay for it if you change your mind", "You must resign"], "a": 1, "w": "Declination is documented on the OSHA-required form, and the vaccine remains available free of charge if you change your mind."}, {"q": "How should a used needle be handled?", "o": ["Recap it carefully with one hand", "Bend it so it cannot be reused", "Place it immediately in a sharps container at the point of use", "Remove it from the syringe with forceps and discard separately"], "a": 2, "w": "Recapping, bending, shearing, and breaking used needles are prohibited. Dispose immediately at the point of use."}, {"q": "Who pays for personal protective equipment required by the bloodborne pathogens standard?", "o": ["The employee", "The employer, at no cost to the employee", "Split evenly", "The resident's insurance"], "a": 1, "w": "The employer must provide, clean, repair, replace, and dispose of PPE at no cost, including non-latex alternatives for allergic employees."}, {"q": "Which of these is considered OPIM under the standard?", "o": ["Urine with no visible blood", "Sweat", "Cerebrospinal fluid", "Nasal secretions with no visible blood"], "a": 2, "w": "Cerebrospinal fluid is explicitly OPIM. Urine, sweat, tears, feces, vomit, and nasal secretions are not, unless visibly contaminated with blood — though gloves and hand hygiene are still required for them."}, {"q": "A resident's blood spills on the floor and there is broken glass in it. How do you pick up the glass?", "o": ["With gloved hands, carefully", "With a brush and dustpan, tongs, or forceps", "With a paper towel", "Sweep it into the regular trash"], "a": 1, "w": "Broken glassware that may be contaminated is never picked up directly by hand, even with gloves. Use mechanical means."}, {"q": "How long must the employer keep your employee medical and exposure records?", "o": ["One year", "Three years", "Duration of employment plus 30 years", "Until you leave the job"], "a": 2, "w": "Medical and exposure records are kept for the duration of employment plus 30 years; training records are kept 3 years."}, {"q": "Your Exposure Control Plan must be reviewed and updated:", "o": ["Only when OSHA inspects", "At least annually and whenever tasks or procedures change exposure risk", "Every five years", "Only after an exposure incident"], "a": 1, "w": "Annual review is mandatory, plus updates for new or modified tasks and procedures, including consideration of safer medical devices."}, {"q": "Which employees must give input on selecting safer medical devices?", "o": ["Only management", "Only the safety committee chair", "Frontline, non-managerial employees who use the devices", "Only the licensed nurses"], "a": 2, "w": "The Needlestick Safety and Prevention Act requires documented solicitation of input from frontline, non-managerial employees responsible for direct patient care."}, {"q": "Where must Safety Data Sheets be kept?", "o": ["Locked in the administrator's office", "Accessible to employees at all times during their shift", "At the chemical supplier's warehouse", "Only in the maintenance closet"], "a": 1, "w": "SDSs must be readily accessible to employees during every work shift. Locking them away is a common and citable violation."}, {"q": "You wear an N95 respirator for a resident on airborne precautions. What does your employer owe you?", "o": ["Nothing extra", "A medical evaluation, fit testing, and training under the respiratory protection standard", "A surgical mask as a backup only", "A signed waiver"], "a": 1, "w": "A respirator triggers 29 CFR 1910.134: medical evaluation, fit testing, and training. A surgical mask does not, because it is not a respirator."}, {"q": "How often is bloodborne pathogens training required?", "o": ["Once at hire", "At initial assignment and at least annually thereafter", "Every three years", "Only after an exposure"], "a": 1, "w": "Training is required at initial assignment, at least annually, and whenever changes in tasks or procedures affect occupational exposure."}], "group": "alf", "skills": false}, {"id": "hipaa", "title": "Health Insurance Portability and Accountability Act (HIPAA)", "short": "HIPAA", "hours": 2, "certPre": "has completed 2 Contact Hrs. as required by F.S 456.025", "certTitle": ["Health Insurance Portability and Accountability Act (HIPAA)"], "blurb": "Protected health information, permitted disclosures, safeguards, social media, breach response, and Florida's added protections.", "body": [{"t": "h", "v": "1. The framework"}, {"t": "p", "v": "HIPAA — the Health Insurance Portability and Accountability Act of 1996 — produced two rules that govern daily practice: the <strong>Privacy Rule</strong>, which limits how protected health information may be used and disclosed, and the <strong>Security Rule</strong>, which requires safeguards for that information in electronic form. The HITECH Act of 2009 and the 2013 Omnibus Rule added breach notification requirements, extended direct liability to business associates, and raised penalties. Florida law adds its own protections on top, including section 456.057 on patient records and section 381.004 on HIV information."}, {"t": "h", "v": "2. Who is covered"}, {"t": "ul", "v": ["<strong>Covered entities</strong> — health plans, health care clearinghouses, and health care providers who transmit health information electronically in connection with a covered transaction.", "<strong>Business associates</strong> — vendors who create, receive, maintain, or transmit PHI on a covered entity's behalf: billing companies, EHR vendors, shredding services, IT contractors. They are directly liable and must sign a business associate agreement.", "Assisted living facilities are frequently covered entities, and even where the analysis is arguable, facility policy, Florida law, and resident rights require the same discipline. The practical rule is simple: treat every resident's health information as legally protected."]}, {"t": "h", "v": "3. What counts as protected health information"}, {"t": "p", "v": "PHI is individually identifiable health information in any form — electronic, paper, or spoken. The identifiers include name, address and any geographic subdivision smaller than a state, all dates more specific than a year (including date of birth and admission date), telephone and fax numbers, email address, Social Security number, medical record and health plan numbers, account numbers, certificate and license numbers, vehicle and device identifiers, URLs and IP addresses, biometric identifiers, full-face photographs and comparable images, and any other unique identifying number or characteristic."}, {"t": "p", "v": "A diagnosis with no name attached is not PHI. A name with no health information is not PHI. Put them together — \"the gentleman in room 214 with the new dementia diagnosis\" — and you have PHI, even though you never said his name, because the room number identifies him."}, {"t": "h", "v": "4. Permitted uses and disclosures"}, {"t": "ul", "v": ["<strong>Treatment, payment, and health care operations (TPO)</strong> — disclosures within these purposes do not require an authorization.", "<strong>Minimum necessary</strong> — even for permitted purposes, use and disclose only the smallest amount needed for the task. This is the principle most often violated by well-meaning staff. Curiosity is never a permitted purpose, and looking at the record of a resident who is not in your care — or of a coworker, a neighbor, or a family member — is a violation even if you tell no one.", "<strong>To the resident themselves</strong>, always.", "<strong>To family and caregivers involved in care</strong> — permitted if the resident agrees, does not object when given the opportunity, or is incapacitated and the disclosure is in their best interest and limited to what is relevant to that person's involvement.", "<strong>Required by law</strong> — abuse reporting, communicable disease reporting to public health, court orders, certain law enforcement requests, and oversight agencies such as AHCA and the Long-Term Care Ombudsman.", "<strong>Everything else</strong> — including marketing, most research, and disclosures to employers — requires a valid written authorization from the resident."]}, {"t": "p", "v": "<strong>Incidental disclosures</strong> that occur despite reasonable safeguards are not violations: a visitor overhearing a quiet hallway conversation, a name briefly visible on a chart. The test is whether you took reasonable precautions, not whether nobody could conceivably have overheard."}, {"t": "h", "v": "5. Resident rights under the Privacy Rule"}, {"t": "ul", "v": ["Receive a Notice of Privacy Practices and know how their information is used.", "Inspect and obtain a copy of their records, generally within 30 days, at a reasonable cost-based fee.", "Request an amendment to information they believe is inaccurate.", "Receive an accounting of certain disclosures.", "Request restrictions on uses and disclosures, and require a restriction on disclosure to a health plan for services paid out of pocket in full.", "Request confidential communications — a different phone number, a different address.", "File a complaint with the facility or directly with the HHS Office for Civil Rights without retaliation."]}, {"t": "h", "v": "6. Security Rule safeguards"}, {"t": "ul", "v": ["<strong>Administrative</strong> — risk analysis, workforce training, sanctions policy, access authorization, contingency planning, and a designated privacy and security officer.", "<strong>Physical</strong> — facility access controls, workstation location and use policies, screen positioning, locked record storage, and secure device and media disposal.", "<strong>Technical</strong> — unique user IDs, automatic logoff, encryption of data at rest and in transit, audit controls and log review, and integrity controls."]}, {"t": "p", "v": "Your part of that is concrete: never share your login, never use someone else's, log off rather than walking away, lock your screen, do not put PHI in personal email or personal cloud storage, do not text resident information from your personal phone, do not photograph residents or records, encrypt or avoid USB drives entirely, and shred rather than discarding paper containing PHI. A laptop or phone containing unencrypted PHI that is stolen from a car is one of the most common reportable breaches in the country."}, {"t": "h", "v": "7. The everyday situations that create violations"}, {"t": "ul", "v": ["Discussing a resident in the dining room, elevator, break room, parking lot, or shuttle where others can hear.", "A sign-in sheet or whiteboard that displays diagnoses, or a census board visible to visitors.", "Faxing to an unverified number, or leaving detailed clinical information on a voicemail without confirming who receives it.", "Leaving a chart, MAR, or printout open on a counter, or leaving a workstation logged in.", "Telling a resident's neighbor or another resident why someone went to the hospital.", "Answering a caller who says they are family without verifying identity and confirming the resident's agreement.", "Looking up a celebrity, a coworker, or a relative in the system out of curiosity. Audit logs record it and this is a common cause of termination.", "Taking a photo or video anywhere residents or records may appear."]}, {"t": "h", "v": "8. Social media"}, {"t": "p", "v": "Never post, text, message, or share anything about a resident — no photographs, no videos, no descriptions, no room numbers, no first names, no \"you wouldn't believe what happened at work today\" stories. Removing the name is not de-identification if any detail could identify the person to anyone who knows them. Staff have been terminated, fined, reported to licensing boards, and criminally charged for social media posts, including posts made from home on personal accounts and posts intended as affectionate. If a resident or family asks you to be in a photo, follow facility policy and get written authorization; a resident's verbal permission recorded nowhere does not protect you or them."}, {"t": "h", "v": "9. Breach notification"}, {"t": "p", "v": "A breach is an impermissible acquisition, access, use, or disclosure of unsecured PHI. It is presumed to be a breach unless a documented risk assessment shows a low probability that the information was compromised, considering the nature and extent of the PHI, who obtained or used it, whether it was actually viewed or acquired, and the extent to which the risk has been mitigated."}, {"t": "ul", "v": ["Affected individuals must be notified without unreasonable delay and no later than <strong>60 days</strong> after discovery.", "Breaches affecting <strong>500 or more</strong> residents in a state or jurisdiction also require notice to prominent local media and to HHS contemporaneously.", "Smaller breaches are logged and reported to HHS annually, within 60 days after the end of the calendar year.", "Your obligation is to report immediately to your supervisor or the privacy officer. The clock starts at discovery, and a delay in your report becomes the facility's delay."]}, {"t": "h", "v": "10. Penalties"}, {"t": "p", "v": "Civil penalties are tiered by culpability, from unknowing violations through reasonable cause, willful neglect corrected, and willful neglect uncorrected, with substantial per-violation amounts and annual caps that are adjusted for inflation. Criminal penalties apply to knowing wrongful disclosure, rising sharply where the offense is committed under false pretenses or for commercial advantage, personal gain, or malicious harm — up to ten years of imprisonment in the most serious tier. Individual employees have been prosecuted, not just employers. On top of federal exposure sit Florida penalties, professional discipline, loss of employment, and civil liability."}, {"t": "h", "v": "11. Florida's additional protections"}, {"t": "ul", "v": ["<strong>Section 456.057, Florida Statutes</strong> — patient records held by licensed health care practitioners are confidential and may not be released without the patient's written authorization, with specified exceptions.", "<strong>Section 381.004</strong> — HIV test results and status require specific written authorization for release; a general medical release is not enough.", "<strong>Mental health records</strong> under Chapter 394 and <strong>substance use disorder records</strong> under federal 42 CFR Part 2 carry heightened protection; Part 2 restricts even re-disclosure by the recipient.", "<strong>Resident rights</strong> under section 429.28 include the right to private and uncensored communication and to confidentiality of records.", "Where Florida law is more protective than HIPAA, Florida law applies. Where HIPAA is more protective, HIPAA applies. In practice: follow the stricter rule."]}, {"t": "h", "v": "12. If you see a problem"}, {"t": "p", "v": "Report suspected violations to your supervisor or the facility privacy officer immediately — including your own mistakes. Self-reported errors are routinely handled as training issues; concealed errors become terminations and enforcement actions. Reporting in good faith is protected, and retaliation against you for reporting is itself a violation."}], "quiz": [{"q": "Which of the following is protected health information?", "o": ["A diagnosis with no identifying information attached", "A statement that 'the man in room 214 was just diagnosed with dementia'", "A general article about dementia", "The number of residents in the building"], "a": 1, "w": "A room number identifies the individual, so combining it with a health fact creates PHI even without using a name."}, {"q": "The 'minimum necessary' principle means:", "o": ["Share the whole chart so nothing is missed", "Use and disclose only the least information needed for the task", "Only licensed staff may see records", "Records must be kept for a minimum time"], "a": 1, "w": "Even for permitted purposes, access and disclosure are limited to the smallest amount of information required. Curiosity is never a permitted purpose."}, {"q": "You look up a coworker's medical record out of concern, but tell no one what you saw. Is this a violation?", "o": ["No, because you kept it to yourself", "No, because you work there", "Yes — accessing a record without a work-related need is a violation and is recorded in audit logs", "Only if the coworker complains"], "a": 2, "w": "Access itself is the violation. Audit logs capture it, and this is one of the most common causes of HIPAA-related terminations."}, {"q": "A caller says she is a resident's daughter and asks about his condition. What should you do?", "o": ["Answer, since family has a right to know", "Verify identity and confirm the resident agrees or does not object, then share only what is relevant", "Give full clinical details to any family member", "Refuse all family communication"], "a": 1, "w": "Disclosure to family involved in care is permitted when the resident agrees, does not object, or is incapacitated and it serves their interest — and the disclosure must be limited to relevant information."}, {"q": "What is the deadline to notify affected individuals of a breach of unsecured PHI?", "o": ["Within 24 hours", "Without unreasonable delay and no later than 60 days after discovery", "Within one year", "Only if more than 500 people are affected"], "a": 1, "w": "Individual notice is due without unreasonable delay and no later than 60 days after discovery. Breaches of 500 or more also require media and contemporaneous HHS notice."}, {"q": "Posting a photo of a resident's birthday party on your personal Facebook page, without using names, is:", "o": ["Fine, because no names were used", "Fine, because the resident smiled for the photo", "A HIPAA violation — images are identifiers and authorization is required", "Fine if your account is private"], "a": 2, "w": "Full-face photographs and comparable images are identifiers. Personal accounts, private settings, and good intentions are not defenses."}, {"q": "Under Florida law, releasing HIV test results requires:", "o": ["A general medical records release", "No author
