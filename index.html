:root{
  --paper:#f4f6f7;
  --card:#ffffff;
  --ink:#16222e;
  --ink-2:#4a5c6b;
  --ink-3:#7d8d99;
  --rule:#d9e0e4;
  --rule-soft:#e8edef;
  --navy:#2c3e50;
  --go:#0f5f54;
  --go-dark:#0a4a41;
  --go-soft:#e3efec;
  --go-on:#ffffff;
  --stage:#46525e;
  --skill-bg:#f6ece7;
  --skill-fg:#8a5a45;
  --stop:#9b3a2c;
  --stop-soft:#f7e8e5;
  --clay:#d3a08f;
  --gold:#a9822f;
  --focus:#0f5f54;
  --shadow:0 1px 2px rgba(22,34,46,.06), 0 8px 24px -16px rgba(22,34,46,.28);
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --name:"Josefin Sans", "Source Sans 3", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10171d; --card:#18222b; --ink:#e8eef1; --ink-2:#a9bac5; --ink-3:#7c8d99;
    --rule:#2b3945; --rule-soft:#222d37; --navy:#cfdde7; --go:#4cbfa8; --go-dark:#7fd6c3;
    --go-soft:#14312c; --stop:#e08c7c; --stop-soft:#341d18;
    --go-on:#06231f; --stage:#2a333c; --skill-bg:#3a2a22; --skill-fg:#e0b49c; --gold:#d6ae5c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#10171d; --card:#18222b; --ink:#e8eef1; --ink-2:#a9bac5; --ink-3:#7c8d99;
  --rule:#2b3945; --rule-soft:#222d37; --navy:#cfdde7; --go:#4cbfa8; --go-dark:#7fd6c3;
  --go-soft:#14312c; --stop:#e08c7c; --stop-soft:#341d18;
  --go-on:#06231f; --stage:#2a333c; --skill-bg:#3a2a22; --skill-fg:#e0b49c; --gold:#d6ae5c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%}
a{color:var(--go-dark)}
button{font:inherit; cursor:pointer}
:focus-visible{outline:2.5px solid var(--focus); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button, a{-webkit-tap-highlight-color:rgba(15,95,84,.15)}




/* ---------- shell ---------- */
.wrap{max-width:980px; margin:0 auto; padding:0 20px}
.masthead{border-bottom:1px solid var(--rule); background:var(--card)}
.masthead .wrap{display:flex; align-items:center; gap:16px; padding:16px 20px; flex-wrap:wrap}
.brand{flex:none; display:block; width:64px; height:64px; position:relative; border-radius:15px;
  background:radial-gradient(120% 120% at 30% 15%, #23242a 0%, #0a0a0c 62%, #000 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.35), inset 0 0 0 1px rgba(214,174,92,.28);
  overflow:hidden; animation:badgeIn .7s cubic-bezier(.2,.9,.25,1) both}
.brand img{position:absolute; left:50%; top:50%; width:47px;
  transform:translate(-50%,-50%); animation:markIn .85s cubic-bezier(.2,.9,.25,1) .1s both}
.brand .sheen{position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(112deg, transparent 32%, rgba(255,241,201,.62) 48%, rgba(255,255,255,.28) 53%, transparent 68%);
  background-size:280% 100%; background-position:190% 0;
  mix-blend-mode:screen; animation:sheen 6.5s ease-in-out 1.1s infinite}
.brand:hover img{transform:translate(-50%,-50%) scale(1.06)}
.brand img{transition:transform .35s cubic-bezier(.2,.9,.25,1)}
@keyframes badgeIn{from{opacity:0; transform:translateY(-4px) scale(.9)} to{opacity:1; transform:none}}
@keyframes markIn{
  0%{opacity:0; transform:translate(-50%,-30%) scale(.72)}
  60%{opacity:1}
  100%{opacity:1; transform:translate(-50%,-50%) scale(1)}}
@keyframes sheen{0%,62%{background-position:190% 0} 88%,100%{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){
  .brand, .brand img{animation:none!important}
  .brand .sheen{display:none}
}
.mast-co{position:relative}
.mast-co{font-family:var(--serif); font-weight:700; font-size:27px; line-height:1.1; letter-spacing:.012em; color:var(--ink)}
.mast-t{color:var(--ink-2); font-size:15.5px; line-height:1.35; margin-top:2px}
.mast-s{color:var(--ink-3); font-size:13px; line-height:1.35}
@media (max-width:560px){
  .brand{width:52px; height:52px; border-radius:13px}
  .brand img{width:38px}
  .mast-co{font-size:21px}
  .mast-t{font-size:14px}
}
.mast-right{margin-left:auto; display:flex; gap:6px; align-items:center}
.ghost{background:none; border:1px solid var(--rule); color:var(--ink-2); border-radius:999px; padding:6px 13px; font-size:13.5px}
.ghost:hover{border-color:var(--ink-3); color:var(--ink)}
.langsw{display:inline-flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; margin-right:4px}
.langsw button{background:none; border:0; padding:6px 13px; font-size:13.5px; color:var(--ink-3); line-height:1.2}
.langsw button.on{background:var(--go); color:var(--go-on); font-weight:600}
.langsw button:not(.on):hover{background:var(--rule-soft); color:var(--ink)}
.themebtn{background:none; border:1px solid var(--rule); border-radius:999px; width:34px; height:34px;
  display:grid; place-items:center; color:var(--ink-3); padding:0; flex:none}
.themebtn:hover{border-color:var(--ink-3); color:var(--ink)}
.themebtn svg{width:17px; height:17px; display:block}
.xlate{background:var(--stop-soft); border-left:3px solid var(--stop); padding:13px 16px; margin:0 0 22px;
  font-size:16px; line-height:1.5; color:var(--ink); border-radius:0 3px 3px 0}

main{padding:0 0 80px}
main > .wrap{padding-top:30px}
.progress-bar + .wrap{padding-top:22px}
h1,h2,h3{font-family:var(--serif); font-weight:600; letter-spacing:.005em; color:var(--ink)}
h1{font-size:clamp(28px,5.2vw,40px); line-height:1.12; margin:0 0 10px}
.lede{font-size:18.5px; color:var(--ink-2); max-width:60ch; margin:0 0 26px}
.sr-only{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0}
.quote{margin:0; padding:2px 0 0 26px; border-left:3px solid var(--gold); max-width:34ch}
.quote p{font-family:var(--serif); font-style:italic; font-weight:400;
  font-size:clamp(25px,4.1vw,35px); line-height:1.27; color:var(--ink); margin:0 0 16px;
  text-wrap:balance}
.quote .by{display:block; font-size:15px; color:var(--ink-3); letter-spacing:.03em; font-style:normal}
.quote .by b{color:var(--ink-2); font-weight:600; letter-spacing:.02em}
.quote-stats{margin:26px 0 0; padding-left:29px; font-size:14px; color:var(--ink-3); letter-spacing:.015em}
@media (max-width:760px){.quote{max-width:none} .quote-stats{margin-top:20px}}

/* ---------- home ---------- */
.hero{display:grid; grid-template-columns:1.25fr .85fr; gap:34px; align-items:start; margin-bottom:38px}
@media (max-width:760px){.hero{grid-template-columns:1fr; gap:22px}}
.cert-peek{background:#f5f5f5; border:1px solid var(--rule); box-shadow:var(--shadow); padding:16px 12px; text-align:center; border-radius:2px}
.cert-peek img{width:72px; opacity:.95}
.cert-peek .cp-t{font-family:var(--serif); color:#2c3e50; font-size:11.5px; letter-spacing:.09em; margin-top:6px}
.cert-peek hr{border:0; border-top:1.5px solid #6b7075; margin:7px 8px}
.cert-peek .cp-n{font-family:var(--name); font-weight:300; font-size:19px; color:#111; letter-spacing:.06em; margin:14px 0 10px}
.cert-peek .cp-b{font-family:var(--serif); font-style:italic; font-size:10.5px; color:#4a5c6b}
.cert-peek .cp-c{font-size:10.5px; color:#7d8d99; margin-top:14px; font-family:var(--serif)}

.roster-note{font-size:15px; color:var(--ink-3); margin-top:12px}

.side{background:var(--card); border:1px solid var(--rule); border-radius:5px;
  box-shadow:var(--shadow); padding:20px 22px}
.side h3{font-family:var(--serif); font-size:18px; margin:0 0 14px}
.steps{list-style:none; margin:0; padding:0; counter-reset:s}
.steps li{position:relative; padding:0 0 15px 38px; counter-increment:s; font-size:15.5px;
  line-height:1.45; color:var(--ink-2)}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(s); position:absolute; left:0; top:-1px;
  width:26px; height:26px; border-radius:50%; background:var(--go-soft); color:var(--go-dark);
  font-family:var(--sans); font-size:14px; font-weight:700; display:grid; place-items:center}
.steps li::after{content:""; position:absolute; left:12.5px; top:27px; bottom:4px; width:1.5px;
  background:var(--rule)}
.steps li:last-child::after{display:none}
.side .big{font-family:var(--serif); font-size:34px; line-height:1; font-weight:600; color:var(--go)}
.side .big small{font-family:var(--sans); font-size:14px; font-weight:400; color:var(--ink-3); letter-spacing:0}
.ptrack{height:8px; border-radius:99px; background:var(--rule-soft); overflow:hidden; margin:14px 0 6px}
.ptrack span{display:block; height:100%; background:var(--go); border-radius:99px; transition:width .4s}
.pmeta{font-size:14px; color:var(--ink-3)}
.nextup{border-top:1px solid var(--rule-soft); margin-top:16px; padding-top:14px}
.nextup .nl{font-size:12.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-3); margin-bottom:5px}
.nextup .nt{font-size:15.5px; line-height:1.35; margin-bottom:12px}

/* enrollment form */
.panel{background:var(--card); border:1px solid var(--rule); border-radius:4px; box-shadow:var(--shadow); padding:22px}
.panel + .panel{margin-top:18px}
.panel h2{margin:0 0 4px; font-size:21px}
.panel .sub{color:var(--ink-3); font-size:15px; margin:0 0 18px}
.field{margin-bottom:14px}
.field label{display:block; font-size:14.5px; font-weight:600; color:var(--ink-2); margin-bottom:5px}
.field input, .field select{
  width:100%; padding:11px 12px; font:inherit; font-size:16.5px; color:var(--ink);
  background:var(--paper); border:1px solid var(--rule); border-radius:3px;
}
.field input:focus{background:var(--card)}
.field .hint{font-size:13.5px; color:var(--ink-3); margin-top:4px}
.err{color:var(--stop); font-size:14.5px; margin:8px 0 0}

/* course list */
.courses{list-style:none; margin:0; padding:0}
.courses li{border-top:1px solid var(--rule-soft)}
.courses li:first-child{border-top:0}
.ccard{
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  width:100%; text-align:left; background:none; border:0; padding:17px 4px;
  color:inherit; border-left:3px solid transparent; transition:border-color .12s, background .12s;
}
.ccard:hover{background:var(--rule-soft); border-left-color:var(--go)}
.hrs{
  font-family:var(--serif); font-size:20px; font-weight:600; color:var(--go);
  min-width:52px; text-align:center; line-height:1;
}
.hrs small{display:block; font-family:var(--sans); font-size:11px; font-weight:600; color:var(--ink-3); letter-spacing:.04em; margin-top:3px}
.ct{display:block; font-family:var(--serif); font-size:18.5px; line-height:1.25; margin-bottom:3px}
.cb{display:block; font-size:14.5px; color:var(--ink-3); line-height:1.4}
.cstat{font-size:13px; color:var(--ink-3); white-space:nowrap}
.cstat.done{color:var(--go); font-weight:600}
.crow{display:grid; grid-template-columns:auto 1fr; gap:4px; align-items:center; border-top:1px solid var(--rule-soft)}
.courses li:first-child .crow{border-top:0}
.pickbox{display:grid; place-items:center; padding:0 6px 0 2px}
.pickbox input{width:21px; height:21px; accent-color:var(--go); cursor:pointer}
.group-h{display:flex; align-items:baseline; gap:10px; margin:26px 0 2px; flex-wrap:wrap}
.group-h h3{font-size:19px; margin:0}
.group-h span{font-size:14.5px; color:var(--ink-3)}
.group-h:first-of-type{margin-top:6px}
.planbar{background:var(--go-soft); border:1px solid var(--go); border-radius:4px; padding:13px 16px; margin-bottom:6px;
  display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.planbar .pt{font-size:16px; color:var(--ink); font-weight:600}
.planbar .pa{margin-left:auto; display:flex; gap:7px; flex-wrap:wrap}
.chipbtn{background:var(--card); border:1px solid var(--rule); color:var(--ink-2); border-radius:999px; padding:5px 12px; font-size:13.5px}
.chipbtn:hover{border-color:var(--go); color:var(--go-dark)}
.chipbtn.on{background:var(--go); border-color:var(--go); color:var(--go-on)}
.skillnote{background:var(--paper); border-left:3px solid var(--clay); padding:11px 14px; font-size:15px; color:var(--ink-2); margin:0 0 4px; border-radius:0 3px 3px 0}
.pill.skills{background:var(--skill-bg); color:var(--skill-fg)}
.chev{color:var(--ink-3); font-size:22px; line-height:1}

/* ---------- printable roster ---------- */
.doc-stage{background:var(--stage); padding:22px 10px; overflow-x:auto}
.rosterdoc{width:816px; min-height:1056px; margin:0 auto; background:#fff; color:#20272e;
  padding:56px 54px 40px; font-family:var(--sans); box-shadow:0 2px 18px rgba(0,0,0,.3);
  transform-origin:top center}
.rd-head{display:flex; align-items:center; gap:16px; border-bottom:2.5px solid #6b7075; padding-bottom:16px}
.rd-head img{width:52px}
.rd-co{font-family:var(--serif); font-weight:700; font-size:22px; color:#2c3e50; letter-spacing:.015em}
.rd-sub{font-size:13px; color:#5a6b78; margin-top:2px}
.rd-title{font-family:var(--serif); font-size:26px; font-weight:600; color:#2c3e50; margin:26px 0 4px}
.rd-meta{font-size:12.5px; color:#5a6b78; margin-bottom:20px; line-height:1.7}
.rd-meta b{color:#20272e; font-weight:600}
.rd-tbl{width:100%; border-collapse:collapse; font-size:11.5px}
.rd-tbl th{text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:.07em;
  color:#5a6b78; border-bottom:1.5px solid #9aa3aa; padding:7px 6px; font-weight:700}
.rd-tbl td{padding:8px 6px; border-bottom:1px solid #e2e6e9; vertical-align:top; line-height:1.4}
.rd-tbl tr:nth-child(even) td{background:#f7f8f9}
.rd-tbl .num{white-space:nowrap}
.rd-tbl .nm{font-weight:600}
.rd-sum{margin-top:22px; padding-top:14px; border-top:1.5px solid #9aa3aa;
  display:flex; gap:30px; flex-wrap:wrap; font-size:12px; color:#5a6b78}
.rd-sum b{display:block; font-family:var(--serif); font-size:19px; color:#2c3e50; font-weight:600}
.rd-sign{margin-top:46px; display:flex; justify-content:space-between; align-items:flex-end; gap:30px}
.rd-sign .sig-wrap{width:290px; text-align:center; position:relative}
.rd-sign img{position:absolute; width:132px; bottom:40px; left:50%; transform:translateX(-40%)}
.rd-sign .rule{border-top:1.2px solid #6b7075; padding-top:7px;
  font-family:var(--serif); font-size:11.5px; font-weight:700; letter-spacing:.07em; color:#2c3e50}
.rd-sign .rule span{display:block; font-weight:400; letter-spacing:0; font-size:11px; color:#5a6b78; margin-top:2px}
.rd-foot{margin-top:26px; font-size:10px; color:#8a949c; text-align:center; line-height:1.6}
.rd-empty{padding:40px 0; text-align:center; color:#5a6b78; font-size:14px}

/* ---------- about the instructor ---------- */
.about{max-width:900px; margin:0 auto}
.about-head{display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center;
  padding-bottom:24px; border-bottom:1px solid var(--rule); margin-bottom:28px}
.about-mark{width:78px; height:78px; border-radius:18px; position:relative; overflow:hidden; flex:none;
  background:radial-gradient(120% 120% at 30% 15%, #23242a 0%, #0a0a0c 62%, #000 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.35), inset 0 0 0 1px rgba(214,174,92,.28)}
.about-mark img{position:absolute; left:50%; top:50%; width:56px; transform:translate(-50%,-50%)}
.about-head h1{font-size:clamp(26px,4.4vw,36px); margin:0 0 5px; line-height:1.12}
.about-head .role{font-size:16.5px; color:var(--ink-2)}
.about-head .lic{font-size:14px; color:var(--ink-3); margin-top:3px}
.about-grid{display:grid; grid-template-columns:1fr 290px; gap:38px; align-items:start}
@media (max-width:760px){.about-grid{grid-template-columns:1fr; gap:26px}
  .about-head{grid-template-columns:auto 1fr; gap:16px}
  .about-mark{width:60px; height:60px; border-radius:14px}
  .about-mark img{width:43px}}
.about-body p{font-size:17px; line-height:1.66; margin:0 0 16px; color:var(--ink-2)}
.about-body p strong{color:var(--ink)}
.about-body h3{font-family:var(--serif); font-size:19px; margin:28px 0 10px}
.facts{background:var(--card); border:1px solid var(--rule); border-radius:5px;
  box-shadow:var(--shadow); padding:18px 20px}
.facts dl{margin:0}
.facts dt{font-size:12px; font-weight:700; letter-spacing:.07em; color:var(--ink-3);
  text-transform:uppercase; margin-bottom:3px}
.facts dd{margin:0 0 15px; font-size:15.5px; line-height:1.45; color:var(--ink)}
.facts dd:last-child{margin-bottom:0}
.facts .gold{color:var(--gold); font-weight:600}

/* ---------- footer ---------- */
.foot-contact{border-top:1px solid var(--rule); background:var(--card); margin-top:40px}
.foot-contact .wrap{padding:30px 20px 34px; display:grid; grid-template-columns:1fr auto; gap:22px; align-items:start}
@media (max-width:640px){.foot-contact .wrap{grid-template-columns:1fr}}
.fc-h{font-family:var(--serif); font-size:19px; font-weight:600; margin:0 0 6px}
.fc-n{font-size:16px; color:var(--ink); font-weight:600}
.fc-l{font-size:14px; color:var(--ink-3); margin-bottom:12px}
.fc-tel{display:inline-flex; align-items:center; gap:9px; font-family:var(--serif);
  font-size:25px; font-weight:600; color:var(--go-dark); text-decoration:none; letter-spacing:.01em}
.fc-tel:hover{text-decoration:underline}
.fc-phone{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.copybtn{background:none; border:1px solid var(--rule); border-radius:999px; color:var(--ink-3);
  font-size:13px; padding:5px 12px; display:inline-flex; align-items:center; gap:6px; line-height:1.2}
.copybtn:hover{border-color:var(--go); color:var(--go-dark)}
.copybtn.done{border-color:var(--go); color:var(--go-dark); background:var(--go-soft)}
.copybtn svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; flex:none}
@media (hover:hover) and (pointer:fine){
  .copybtn{opacity:0; transform:translateX(-4px); transition:opacity .18s, transform .18s}
  .fc-phone:hover .copybtn, .copybtn:focus-visible{opacity:1; transform:none}
}
.fc-tel svg{width:19px; height:19px; flex:none; stroke:currentColor; fill:none; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round}
.fc-note{font-size:14.5px; color:var(--ink-2); margin:10px 0 0; max-width:46ch; line-height:1.5}
.fc-right{text-align:right; font-size:13px; color:var(--ink-3); line-height:1.6}
@media (max-width:640px){.fc-right{text-align:left}}
.fc-right img{width:34px; opacity:.85; margin-bottom:8px; display:block}
@media (max-width:640px){.fc-right img{margin-top:6px}}

/* ---------- lesson ---------- */
.progress-bar{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--rule)}
.pb-in{max-width:980px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:14px}
.pb-t{font-size:14.5px; color:var(--ink-2); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pb-track{flex:1; height:5px; background:var(--rule-soft); border-radius:99px; overflow:hidden; min-width:60px}
.pb-fill{height:100%; background:var(--go); width:0%; transition:width .25s}
.pb-time{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}

.reader{max-width:68ch; margin:0 auto}
.reader .kicker{font-family:var(--sans); font-size:14.5px; color:var(--ink-3); margin-bottom:6px}
.reader h1{font-size:clamp(26px,4.4vw,34px); margin-bottom:6px}
.reader .meta{color:var(--ink-3); font-size:15px; margin-bottom:28px; padding-bottom:18px; border-bottom:1px solid var(--rule)}
.reader h3{font-size:21px; margin:34px 0 10px; line-height:1.25}
.reader p{margin:0 0 15px; line-height:1.68}
.reader ul{margin:0 0 18px; padding-left:22px}
.reader li{margin-bottom:9px; line-height:1.6}
.reader em{font-style:italic}
.reader strong{font-weight:700; color:var(--ink)}
.callout{
  background:var(--go-soft); border-left:3px solid var(--go); padding:14px 17px;
  margin:22px 0; font-size:16.5px; line-height:1.55; border-radius:0 3px 3px 0;
}
.gate{border-top:1px solid var(--rule); margin-top:38px; padding-top:24px}
.gate p{color:var(--ink-2); font-size:16px}

/* ---------- buttons ---------- */
.btn{
  background:var(--go); color:var(--go-on); border:0; border-radius:3px;
  padding:13px 26px; font-size:17px; font-weight:600; letter-spacing:.01em;
}
.btn:hover{background:var(--go-dark)}
.btn[disabled]{background:var(--rule); color:var(--ink-3); cursor:not-allowed}
.btn-line{background:none; color:var(--ink-2); border:1px solid var(--rule); border-radius:3px; padding:12px 22px; font-size:16px}
.btn-line:hover{border-color:var(--ink-3); color:var(--ink)}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:20px}
.btn-sm{padding:7px 14px; font-size:14.5px}

/* ---------- quiz ---------- */
.quiz{max-width:64ch; margin:0 auto}
.dots{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:26px}
.dot{width:26px; height:5px; border-radius:99px; background:var(--rule)}
.dot.filled{background:var(--go)}
.dot.now{background:var(--ink-2)}
.qnum{font-size:14.5px; color:var(--ink-3); margin-bottom:8px}
.qtext{font-family:var(--serif); font-size:23px; line-height:1.32; margin:0 0 22px}
.opts{display:grid; gap:10px}
.opt{
  display:flex; gap:13px; align-items:flex-start; text-align:left; width:100%;
  background:var(--card); border:1.5px solid var(--rule); border-radius:4px;
  padding:14px 16px; font-size:16.5px; line-height:1.45; color:var(--ink);
}
.opt:hover{border-color:var(--go)}
.opt.sel{border-color:var(--go); background:var(--go-soft)}
.opt .k{
  flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--rule);
  display:grid; place-items:center; font-size:14px; font-weight:700; color:var(--ink-3);
}
.opt.sel .k{background:var(--go); border-color:var(--go); color:var(--go-on)}

/* ---------- result ---------- */
.score-big{font-family:var(--serif); font-size:56px; line-height:1; font-weight:600}
.score-pass{color:var(--go)} .score-fail{color:var(--stop)}
.banner{border-radius:4px; padding:22px; margin-bottom:24px}
.banner.pass{background:var(--go-soft); border:1px solid var(--go)}
.banner.fail{background:var(--stop-soft); border:1px solid var(--stop)}
.banner h2{margin:0 0 6px}
.banner p{margin:0; color:var(--ink-2)}
.review{margin-top:28px}
.rq{border-top:1px solid var(--rule-soft); padding:16px 0}
.rq .rqq{font-weight:600; margin-bottom:6px}
.rq .ra{font-size:15.5px; margin-bottom:4px}
.rq .ra.bad{color:var(--stop)}
.rq .ra.good{color:var(--go)}
.rq .rw{font-size:15.5px; color:var(--ink-2); font-style:italic}

/* ---------- admin ---------- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--rule); margin-bottom:22px; flex-wrap:wrap}
.tab{background:none; border:0; border-bottom:2.5px solid transparent; padding:10px 14px; font-size:16px; color:var(--ink-3)}
.tab.on{color:var(--ink); border-bottom-color:var(--go); font-weight:600}
.tbl{width:100%; border-collapse:collapse; font-size:15px}
.tbl th{text-align:left; font-size:13px; font-weight:700; color:var(--ink-3); padding:8px 10px; border-bottom:1px solid var(--rule); white-space:nowrap}
.tbl td{padding:11px 10px; border-bottom:1px solid var(--rule-soft); vertical-align:top}
.tbl tr:hover td{background:var(--rule-soft)}
.pill{display:inline-block; font-size:12.5px; font-weight:600; padding:2px 9px; border-radius:99px; white-space:nowrap}
.pill.pending{background:var(--go-soft); color:var(--go-dark)}
.pill.issued{background:var(--go); color:var(--go-on)}
.pill.rejected{background:var(--stop-soft); color:var(--stop)}
.empty{text-align:center; color:var(--ink-3); padding:44px 20px; font-size:16px}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}
.stat-row{display:flex; gap:26px; flex-wrap:wrap; margin-bottom:22px}
.stat b{display:block; font-family:var(--serif); font-size:28px; line-height:1.1}
.stat span{font-size:13.5px; color:var(--ink-3)}
.warnbar{background:var(--stop-soft); color:var(--stop); border:1px solid var(--stop); border-radius:3px; padding:10px 14px; font-size:14.5px; margin-bottom:18px}

/* ---------- certificate ---------- */
.cert-stage{background:var(--stage); padding:22px 10px; overflow-x:auto}
.cert-stage{}
.cert{
  width:1056px; height:816px; background:#f5f5f5; color:#2c3e50;
  margin:0 auto; position:relative; font-family:var(--serif);
  display:flex; flex-direction:column; align-items:center;
  transform-origin:top center;
}
.cert .cap{width:150px; margin:58px 0 20px; image-rendering:auto}
.cert .h{font-family:var(--serif); font-weight:700; font-size:30px; letter-spacing:.055em;
  color:#2c3e50; margin:0; -webkit-font-smoothing:antialiased}
.cert .rule{width:calc(100% - 290px); border-top:2.5px solid #6b7075; margin:16px 0 30px}
.cert .certif{font-family:var(--serif); font-weight:700; font-size:19px; color:#2c3e50; margin:0}
.cert .nm{
  font-family:var(--name); font-weight:300; color:#111;
  letter-spacing:.06em; line-height:1; margin:30px 0 0; white-space:nowrap;
  text-shadow:1px 1px 1.5px rgba(0,0,0,.14);
}
.cert .pre{font-family:var(--serif); font-style:italic; font-size:16.5px; color:#4a5c6b; text-align:center; max-width:880px; line-height:1.5; margin:0 auto}
.cert .ttl{font-family:var(--serif); font-weight:700; font-style:italic; font-size:19.5px; color:#2c3e50; text-align:center; line-height:1.45; margin:6px auto 0}
.cert .cnote{font-family:var(--serif); font-size:11.5px; font-style:italic; color:#8a949c; text-align:center; margin:14px auto 0; max-width:760px}
.cert .body{flex:1; display:flex; flex-direction:column; justify-content:center; width:100%; padding:0 40px}
.cert .foot{width:100%; padding:0 62px 40px; display:flex; justify-content:space-between; align-items:flex-end}
.cert .fcol{text-align:center; width:300px; position:relative}
.cert .dt{font-family:var(--serif); font-style:italic; font-weight:600; font-size:19px; letter-spacing:.14em; color:#111; padding-bottom:7px}
.cert .sigline{border-top:1.4px solid #6b7075; padding-top:9px}
.cert .lbl{font-family:var(--serif); font-weight:700; font-size:14px; letter-spacing:.09em; color:#2c3e50}
.cert .lbl2{font-family:var(--serif); font-size:13.5px; color:#5a6b78; margin-top:2px}
.cert .sig{position:absolute; width:208px; bottom:44px; left:50%; transform:translateX(-36%)}
.cert .prov{position:absolute; bottom:16px; left:0; right:0; text-align:center;
  font-family:var(--serif); font-size:11px; letter-spacing:.16em; color:#9aa3aa}
.cert-actions{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 0}


@media print{
  body{background:#fff}
  .cert img, .rosterdoc img{image-rendering:auto; -webkit-print-color-adjust:exact; print-color-adjust:exact}

<script id="course-data" type="application/json">[{"id": "amsa6", "group": "alf", "skills": false, "title": "Assistance with Self-Administration of Medications — 6 Hour Initial", "short": "Medication Assistance (Initial)", "hours": 6, "certPre": "has completed 6 contact hrs. of initial training as required by sections 429.255 and 429.256, F.S and rule 59A-36.008", "certTitle": ["Assistance with Self-Administrating of Medications", "Initial Lecture and Training."], "blurb": "The full initial course for staff who have not been trained before: scope of practice, the six rights, records, storage, drug classes, high-alert medications, and error response.", "body": [{"t": "h", "v": "1. The law behind this course"}, {"t": "p", "v": "Florida permits unlicensed staff in an assisted living facility to <em>assist</em> a resident with the self-administration of medication. That permission is narrow, conditional, and defined in three places: sections 429.255 and 429.256 of the Florida Statutes, and Rules 59A-36.008 and 59A-36.011 of the Florida Administrative Code."}, {"t": "ul", "v": ["Training must be provided by a licensed registered nurse, licensed practical nurse, licensed pharmacist, or physician.", "The requirement is a <strong>6-hour initial course</strong> followed by a <strong>2-hour update annually</strong>.", "Completion must be documented in the employee's personnel file, with the date, the hours, the subject, and the trainer's name and license number. A surveyor will ask for this.", "The training does not make you a nurse and does not expand your scope. It authorizes a specific, listed set of acts and nothing beyond them."]}, {"t": "p", "v": "Section 429.256 also protects you: an unlicensed person who assists with self-administration in accordance with the statute is not considered to be administering medication, and is not practicing nursing without a license. That protection exists only while you stay inside the boundaries this course describes. Step outside them and the protection disappears."}, {"t": "h", "v": "2. Three activities, three different sets of rules"}, {"t": "p", "v": "Before you touch a medication, you must know which of three things you are doing. Confusing them is the single most common cause of violations in this area."}, {"t": "ul", "v": ["<strong>Self-administration.</strong> The resident takes their own medication independently. They may keep it in their own room if the facility has assessed that as safe. Staff may store it centrally and may remind the resident that it is time. Nothing else is required.", "<strong>Assistance with self-administration.</strong> The resident is <em>capable of understanding</em> what the medication is and <em>capable of directing</em> that it be taken, but needs physical help. Trained unlicensed staff may assist. The resident retains the decision.", "<strong>Administration.</strong> The medication is given to a resident who cannot direct their own care, or by a route or method requiring clinical judgment. Only a licensed nurse, or another licensed professional acting within their own scope, may administer."]}, {"t": "p", "v": "The dividing line is the resident's ability to direct the act, not their physical ability to perform it. A resident with severe arthritis who cannot open a bottle but knows exactly what she takes and why is a candidate for assistance. A resident with advanced dementia who opens her mouth when a pill is offered but cannot name a single medication is not being assisted; she is being administered to, and that requires a nurse."}, {"t": "h", "v": "3. How to judge whether a resident can direct the act"}, {"t": "p", "v": "Ask yourself, at that moment, on that day:"}, {"t": "ul", "v": ["Can the resident recognize the medication, or at least understand that it is her medication?", "Can she indicate that she wants to take it now?", "Can she tell you, roughly, what it is for or that a doctor prescribed it?", "Can she tell you if something is wrong — a new symptom, a reaction, a refusal?"]}, {"t": "p", "v": "Capacity fluctuates. A resident may be able to direct her morning medications and not her evening ones; she may be fine ordinarily and confused during an infection. Assist when she can direct, and report when she cannot. Do not make the judgment permanent on your own — report the change so the nurse can reassess. A resident who consistently cannot direct may need a health assessment update (AHCA Form 1823), a care plan change, Extended Congregate Care or Limited Nursing Services, or a different level of care."}, {"t": "h", "v": "4. Resident rights you cannot override"}, {"t": "ul", "v": ["Section 429.28 guarantees residents courteous treatment, privacy, participation in their own care, and the right to refuse.", "<strong>A refusal must be honored.</strong> You may ask why, try again later, offer it with food, or change the approach. You may not insist, argue, threaten, or imply consequences.", "<strong>Never disguise medication</strong> in food or drink without a prescriber order and a documented care plan. Hiding a pill in applesauce to get it swallowed is covert administration, and with a resident who is refusing it can constitute abuse.", "<strong>Never force.</strong> Prying a mouth open, holding someone's hands, or pinching the nose is battery, not care.", "Persistent refusal is clinical information and must be reported — it often signals pain on swallowing, nausea, a side effect the resident dislikes, depression, delusional beliefs about the medication, or a new cognitive change.", "Privacy applies here too. Do not announce medications in a dayroom or discuss a resident's prescriptions where others can hear."]}, {"t": "h", "v": "5. Reading a medication label"}, {"t": "p", "v": "The pharmacy label is your only authority. Everything you need is on it, and anything not on it is not yours to decide. A label contains:"}, {"t": "ul", "v": ["The resident's full name.", "The medication name — often both generic and brand. Metoprolol and Lopressor are the same drug; furosemide and Lasix are the same drug. Never assume two differently named bottles are different medications, and never assume they are the same.", "The strength — for example 25 mg — and the dosage form: tablet, capsule, liquid, patch, cream, drop, inhaler.", "The directions: how much, how often, by what route, and any conditions such as with food, on an empty stomach, or at bedtime.", "The prescriber's name, the pharmacy, the fill date, the quantity, the expiration date, and the number of refills remaining.", "Auxiliary warning stickers — do not crush, take with food, may cause drowsiness, avoid sunlight, shake well."]}, {"t": "p", "v": "Common directions you will see: <strong>PO</strong> by mouth, <strong>PRN</strong> as needed, <strong>BID</strong> twice a day, <strong>TID</strong> three times a day, <strong>QID</strong> four times a day, <strong>QD</strong> once daily, <strong>HS</strong> at bedtime, <strong>AC</strong> before meals, <strong>PC</strong> after meals, <strong>SL</strong> sublingual (under the tongue), <strong>GTT</strong> drops. If a direction on a label is unclear, illegible, or contradicts the medication record, <strong>stop and ask the nurse</strong>. Never interpret."}, {"t": "note", "v": "If the label and the medication record disagree, do not assist until a licensed person resolves it. A mismatch means one of the two is wrong, and guessing which one is how residents get hurt."}, {"t": "h", "v": "6. What assistance includes — the permitted acts"}, {"t": "p", "v": "Rule 59A-36.008 lists what assistance with self-administration means. After this training you may:"}, {"t": "ul", "v": ["Take the medication from where it is stored and bring it to the resident.", "In the presence of the resident, read the label aloud and confirm that the resident is the person named on it.", "Remove a prescribed dose from the container.", "Place the dose in the resident's hand, or in another container, and help the resident bring it to her mouth.", "Measure a prescribed dose of liquid as the label states, using a proper marked device — an oral syringe or a calibrated cup, never a kitchen spoon.", "Break a scored tablet along its score line when the label directs a half tablet.", "Apply a topical medication — cream, ointment, lotion — to intact skin.", "Steady a resident's hand for eye or ear drops, an inhaler, or a spray, where the resident directs the act and facility policy permits it.", "Return the medication to secure storage and document what you did.", "Request and receive refills from the pharmacy, and check the label of a delivered refill against the record."]}, {"t": "h", "v": "7. What assistance does NOT include — the prohibited acts"}, {"t": "p", "v": "These are outside your scope. Performing them is a rule violation, may be reported to the Board of Nursing or AHCA, and forfeits the statutory protection described in section 1."}, {"t": "ul", "v": ["<strong>Mixing, compounding, converting, or calculating a dose.</strong> Measuring what the label already states is permitted; deciding how much is not. If the label says 5 mg and the bottle holds 10 mg tablets, you do not cut it — the nurse or pharmacy resolves it.", "<strong>Crushing, splitting, dissolving, or opening a capsule</strong> unless the medication is scored and labeled for it or a licensed person has directed it. Many tablets are extended-release or enteric-coated, and crushing them delivers a full day's dose at once. That has killed people.", "<strong>Injections of any kind, including insulin.</strong> You may hand a prefilled pen or syringe prepared by a licensed person to a resident who injects herself. You do not inject.", "<strong>Administering medication rectally or vaginally</strong>, including suppositories and enemas.", "<strong>Operating a nebulizer treatment, or administering by a feeding tube</strong>, or any parenteral or intravenous route.", "<strong>Deciding whether a PRN medication is warranted.</strong> The resident must request it and be able to state the symptom. You may not judge that someone looks anxious, agitated, or in pain and give the as-needed medication on that basis.", "<strong>Applying a medication to broken skin, an open wound, or a pressure injury.</strong> That is treatment.", "<strong>Altering a pharmacy label</strong>, writing on it, crossing anything out, or relabeling a container. Ever.", "<strong>Transcribing or changing an order.</strong> A phone order from a prescriber is taken by a licensed person, not by you.", "<strong>Assisting a resident who is refusing, resisting, asleep, or unable to participate.</strong>", "<strong>Taking, borrowing, or sharing medication between residents</strong>, even in an emergency, even if the drug and dose look identical. This is diversion."]}, {"t": "h", "v": "8. The six rights, and the workflow that enforces them"}, {"t": "ul", "v": ["<strong>Right resident</strong> — read the name on the label out loud, in front of the resident. Never rely on a face, a room number, or another resident's confirmation.", "<strong>Right medication</strong> — compare the label to the medication record, letter by letter.", "<strong>Right dose</strong> — as printed. Count it; do not estimate.", "<strong>Right route</strong> — by mouth, under the tongue, on the skin, in the eye. Eye drops and ear drops are not interchangeable.", "<strong>Right time</strong> — within the window your policy allows, typically one hour before to one hour after the scheduled time.", "<strong>Right documentation</strong> — at the moment of assistance."]}, {"t": "p", "v": "Practical workflow, every single pass: wash your hands. Gather one resident's medications at a time — never several residents at once. Compare label to record. Go to the resident. Greet her and explain. Read the label aloud and confirm her name. Confirm she wants to take it. Remove the dose without touching the medication itself, into the cap or a clean cup, then into her hand or cup. Offer a full glass of water unless the label says otherwise. Stay and watch her take it. Check that she swallowed. Return the medication to locked storage. Document. Then move to the next resident."}, {"t": "p", "v": "Stay and observe. A resident who pockets, spits out, or drops a pill has not taken it, and “I left it on the table for her” is both a documentation falsehood and a safety failure. Loose medication on a table is also a danger to any resident who wanders in."}, {"t": "h", "v": "9. Medication records and documentation"}, {"t": "ul", "v": ["The medication observation record (MOR) is a legal document and the primary evidence that care was given. It is reviewed in every survey and in every lawsuit.", "Record at the time you assist — never in advance, never batched at the end of the shift. Charting a dose before it is taken is falsification.", "Use ink, initial each entry, and make sure your initials and full signature appear in the key.", "<strong>Never leave a blank.</strong> Use your facility's codes and explain on the back or in the notes: refused, held per order, out of medication, at appointment, hospitalized, resident asleep. A blank box reads as a missed dose with no explanation.", "Correct an error by drawing a single line through it, writing the correction, and adding your initials and the date. Never scribble out, never use correction fluid, never write over an entry.", "Only a licensed person sets up or transcribes the record from an order.", "Controlled substances require a running count on a separate log, reconciled at shift change by two people where policy requires it. A discrepancy is reported immediately — not at the end of the shift, not tomorrow.", "Records are confidential health information. HIPAA and section 456.057 apply to every page."]}, {"t": "h", "v": "10. Storage, refills, and disposal"}, {"t": "ul", "v": ["Centrally stored medication is kept in a locked cabinet, cart, or room, accessible only to authorized staff. Keys are controlled, not left in a drawer.", "Each resident's medications are kept physically separate and in the original pharmacy-labeled container. Never combine, never transfer to a different bottle.", "Refrigerated medications go in a designated, labeled, leak-proof container, separate from food, with the refrigerator temperature monitored and logged.", "Store in a cool, dry place away from sunlight. A bathroom is a poor place for medication.", "Check expiration dates when you handle a container. Expired means not usable, including opened multi-dose items with shorter in-use dating, such as insulin and eye drops.", "Order refills before a resident runs out — a missed dose because the bottle is empty is a preventable medication error and a citable deficiency.", "Check deliveries in against the record: right resident, right drug, right strength, right directions. Report any mismatch to the nurse before it is put away.", "Discontinued, expired, and deceased-resident medications are separated, secured, and disposed of per facility policy, witnessed by two people, and documented — including controlled substances, which require specific destruction procedures."]}, {"t": "h", "v": "11. Medication classes you will see every day"}, {"t": "p", "v": "You do not need to be a pharmacist. You do need to recognize when something is going wrong, because you are the person who sees the resident."}, {"t": "ul", "v": ["<strong>Blood pressure medications</strong> — lisinopril, losartan, amlodipine, metoprolol, carvedilol. Watch for dizziness on standing, falls, very slow pulse, fainting. A dry persistent cough is a known effect of the “-pril” drugs.", "<strong>Diuretics</strong> — furosemide, hydrochlorothiazide. Watch for dehydration, dizziness, weakness, muscle cramps, confusion, and falls on the way to the bathroom. Given in the morning for a reason.", "<strong>Anticoagulants and antiplatelets</strong> — warfarin, apixaban, rivaroxaban, clopidogrel, aspirin. Report any unusual bruising, bleeding gums, nosebleeds, blood in urine or stool, black tarry stool, and <strong>any</strong> fall or head strike, however minor it appears.", "<strong>Diabetes medications</strong> — metformin, glipizide, insulin. Watch for shakiness, sweating, confusion, irritability, slurred speech, and hunger, which mean low blood sugar. Know that a resident who skips a meal but takes the medication is at real risk.", "<strong>Opioid pain medications</strong> — oxycodone, hydrocodone, tramadol, morphine. Watch for excessive drowsiness, slow or shallow breathing, confusion, and constipation. These are controlled substances requiring counts.", "<strong>Benzodiazepines, sleep aids, and antipsychotics</strong> — lorazepam, alprazolam, zolpidem, quetiapine, risperidone. Watch for sedation, unsteadiness, falls, confusion, and new stiffness or tremor. Antipsychotics in residents with dementia carry serious risks and require documented justification, not convenience.", "<strong>Levothyroxine</strong> — taken on an empty stomach, separated from calcium, iron, and antacids by several hours.", "<strong>Antibiotics</strong> — the full course is finished even when the resident feels better. Report rash, diarrhea, or thrush.", "<strong>Eye drops for glaucoma</strong> — timing matters; a missed dose can mean vision loss.", "<strong>Nitroglycerin</strong> — sublingual, for chest pain, per the label and the care plan. Chest pain that does not resolve is a 911 call."]}, {"t": "h", "v": "12. High-alert medications"}, {"t": "p", "v": "Some drugs cause severe harm when something goes slightly wrong. Slow down on these and double-check the label against the record: <strong>warfarin and the newer oral anticoagulants, insulin, opioids, digoxin, methotrexate, potassium supplements, and any medication with a narrow window between a therapeutic and a toxic dose.</strong> If anything about the dose, the container, or the resident's condition seems off, stop and get the nurse before assisting, not after."}, {"t": "h", "v": "13. Side effects, interactions, and polypharmacy"}, {"t": "ul", "v": ["A <strong>side effect</strong> is a known, expected, usually tolerable consequence — drowsiness, dry mouth, nausea.", "An <strong>adverse reaction</strong> is harmful and unintended and needs a prescriber's attention.", "An <strong>allergic reaction</strong> involves the immune system: rash, hives, itching, swelling, wheezing, tightness in the throat. Swelling of the face, lips, or tongue, or difficulty breathing, is anaphylaxis — call 911 first, then notify.", "An <strong>intolerance</strong> is not an allergy. Stomach upset from an antibiotic is not a penicillin allergy, and recording it as one can deny a resident an important drug for life. Report what actually happened and let the nurse classify it.", "Older adults metabolize drugs more slowly, carry less body water, and are more sensitive to sedation and to blood pressure effects. A dose that is unremarkable in a 40-year-old may cause a fall in an 85-year-old.", "Residents on many medications are at greater risk of interactions with each other. Warfarin interacts with leafy greens, many antibiotics, and NSAIDs. Grapefruit juice interacts with a long list of drugs. Antacids block absorption of several medications.", "<strong>Over-the-counter products and herbal supplements are medications.</strong> A resident's daughter bringing in ibuprofen, melatonin, St. John's wort, or fish oil must be reported so it can be reviewed and added to the record. Nothing goes into a resident that is not on the record."]}, {"t": "h", "v": "14. Oxygen and other specialty items"}, {"t": "ul", "v": ["Oxygen is a prescribed medication with an ordered flow rate. You do not change the liter flow. Report an empty tank, a kinked line, a resident removing the cannula, or new shortness of breath.", "No smoking, no open flame, no petroleum-based products near oxygen. Secure tanks so they cannot fall.", "Transdermal patches: check that yesterday's patch was removed before a new one goes on — doubled fentanyl or nitroglycerin patches are a known cause of death. Rotate sites, and note the date and time on the patch if policy requires.", "Insulin pens and vials belong to one resident only and are labeled with that resident's name. Sharing an insulin pen between residents has caused hepatitis outbreaks."]}, {"t": "h", "v": "15. When something goes wrong"}, {"t": "p", "v": "A medication error is any deviation from the order: wrong resident, wrong drug, wrong dose, wrong route, wrong time, or a dose omitted. A near miss — an error you caught before it reached the resident — is also reported, because it shows where the system is weak."}, {"t": "ul", "v": ["Stay with the resident. Look at her: breathing, color, alertness, complaints.", "Notify your supervisor and the facility nurse immediately. “She seems fine” is not an assessment you are qualified to make.", "The nurse or supervisor contacts the prescriber, and Poison Control at <strong>1-800-222-1222</strong> if indicated.", "Call 911 for any serious sign: difficulty breathing, swelling of the face or throat, chest pain, unresponsiveness, seizure, or a sudden change in level of consciousness.", "Document objectively: what was ordered, what happened, what you observed, who you notified, and when. Complete an incident report.", "Never alter a record after the fact, never chart a dose that was not taken, and never conceal an error. Concealment turns a manageable mistake into termination, discipline, and potential criminal exposure.", "Suspected diversion — missing controlled substances, a count that will not reconcile, a resident reporting unrelieved pain despite documented doses — is reported immediately."]}, {"t": "note", "v": "Most medication errors come from system conditions, not bad people: interruptions, look-alike names, rushing, understaffing, poor lighting, illegible records. Report the conditions as well as the events. That is how the next error gets prevented."}, {"t": "h", "v": "16. What to report about the resident"}, {"t": "p", "v": "You see residents more often than any nurse or physician will. Report the same day:"}, {"t": "ul", "v": ["New confusion, drowsiness, or a change in alertness.", "A fall, unsteadiness, or new dizziness.", "New or worsening pain, or pain that a medication no longer relieves.", "Nausea, vomiting, diarrhea, constipation, or loss of appetite.", "Rash, itching, swelling, or difficulty breathing.", "Bruising or bleeding, especially on an anticoagulant.", "Difficulty swallowing, or pills found in the mouth or in the room.", "Refusal, or a resident who suddenly cannot identify her medications.", "Any resident who asks for more of something, or seems to be running out early."]}, {"t": "h", "v": "17. Mandatory reporting"}, {"t": "p", "v": "Under Florida law every person is a mandatory reporter of suspected abuse, neglect, or exploitation of a vulnerable adult. Withholding prescribed medication, giving medication covertly or by force, falsifying a medication record, and diverting a resident's controlled substances are all reportable. The Florida Abuse Hotline is <strong>1-800-96-ABUSE (1-800-962-2873)</strong>. Reporting does not require certainty, does not require your supervisor's permission, and is protected from retaliation."}, {"t": "h", "v": "18. Applied cases"}, {"t": "ul", "v": ["<em>A resident's label says take one-half tablet, and the tablet is scored.</em> You may break it on the score line. If it were unscored, you would not.", "<em>A resident with dementia opens her mouth when you hold out the cup but cannot name anything she takes.</em> This is administration. Report it; do not proceed.", "<em>A daughter hands you a bottle of melatonin and asks you to give it at bedtime.</em> Nothing goes to a resident without an order on the record. Give it to the nurse.", "<em>You notice the MOR says metoprolol 25 mg and the bottle says 50 mg.</em> Do not assist. Get the nurse before the scheduled time passes.", "<em>A resident says the pill makes her sick and refuses.</em> Honor the refusal, document it, report it.", "<em>You are interrupted mid-pass by a call bell.</em> Secure the medication first. An unattended cup of pills is both an error waiting to happen and a hazard to another resident.", "<em>You realize at 3 PM that a noon dose was never given.</em> Report immediately, document the omission, and let the nurse decide whether the dose is still given.", "<em>A resident takes warfarin and has a small fall with no visible injury.</em> Report it and ensure she is evaluated. Delayed bleeding on an anticoagulant is the risk, not the bruise you can see."]}], "quiz": [{"q": "What are the training requirements for assisting with self-administration of medications in a Florida ALF?", "o": ["A 2-hour course, once", "A 6-hour initial course and a 2-hour update annually", "An 8-hour course every three years", "No training if a nurse is on call"], "a": 1, "w": "Florida requires a 6-hour initial course followed by a 2-hour annual update, delivered by an RN, LPN, licensed pharmacist, or physician."}, {"q": "What determines whether a resident may receive assistance rather than administration?", "o": ["Whether she can physically open the bottle", "Whether she is capable of understanding the medication and directing that it be taken", "Her age", "Whether family consents"], "a": 1, "w": "The dividing line is the ability to direct the act. Physical limitation is exactly what assistance is for; inability to direct means a nurse must administer."}, {"q": "A resident's label reads 5 mg and the bottle contains unscored 10 mg tablets. What do you do?", "o": ["Break it as evenly as you can", "Give the whole tablet", "Do not assist — notify the nurse so the pharmacy or prescriber resolves it", "Crush it and give half the powder"], "a": 2, "w": "Splitting an unscored tablet is altering a dose, which is outside your scope. The nurse or pharmacy corrects the mismatch."}, {"q": "Which act is permitted for trained unlicensed staff?", "o": ["Injecting insulin into the abdomen", "Measuring 10 mL of liquid as stated on the label with an oral syringe", "Inserting a rectal suppository", "Giving the PRN lorazepam because a resident seems agitated"], "a": 1, "w": "Measuring a dose the label already specifies is permitted. Injections, rectal administration, and judging PRN appropriateness are not."}, {"q": "Why must you never crush an extended-release tablet without direction?", "o": ["It tastes bad", "It destroys the release mechanism and delivers a full day's dose at once", "It voids the pharmacy warranty", "It only matters for antibiotics"], "a": 1, "w": "Crushing extended-release or enteric-coated products releases the entire dose immediately, which has caused fatal overdoses."}, {"q": "A resident refuses her evening medication for the third night. What is correct?", "o": ["Hide it in her pudding", "Insist until she takes it", "Honor the refusal, document it, and report the pattern to the nurse", "Mark it as given to keep the record clean"], "a": 2, "w": "Refusal must be honored. Covert administration without an order is abuse, and a repeated refusal is clinical information that needs reporting."}, {"q": "What goes in the medication record when a dose is not taken?", "o": ["Leave the box blank", "Initial it as given", "Use the facility code and document the reason and notification", "Write 'noncompliant' with no detail"], "a": 2, "w": "Never leave a blank and never chart an untaken dose. Code the entry and explain the reason, then notify per policy."}, {"q": "When should you document that you assisted with a medication?", "o": ["At the moment you assist", "At the start of the shift for the whole shift", "At the end of the shift, from memory", "Whenever the nurse asks"], "a": 0, "w": "Documentation happens at the time of assistance. Charting in advance is falsification; batching at shift end produces errors."}, {"q": "A resident on warfarin has a minor fall with no visible injury. What must you do?", "o": ["Nothing, since there is no injury", "Apply ice and recheck tomorrow", "Report it and ensure she is evaluated", "Only report it if she complains of pain"], "a": 2, "w": "Anticoagulation makes delayed internal bleeding the real risk. Any fall or head strike on a blood thinner requires evaluation regardless of appearance."}, {"q": "How should a correction be made on a medication record?", "o": ["Use correction fluid", "Scribble over the entry", "Single line through it, write the correction, add initials and date", "Rewrite the whole page"], "a": 2, "w": "A single line, the correction, your initials, and the date preserve the original entry. Obliterating an entry looks like concealment."}, {"q": "A resident's daughter brings in ibuprofen and asks you to keep it in her mother's room for aches. What do you do?", "o": ["Put it in the nightstand", "Give it as needed", "Report it to the nurse — nothing goes to a resident without being on the record", "Add it to the medication record yourself"], "a": 2, "w": "Over-the-counter products are medications. They must be reviewed and ordered before use, and only a licensed person adds anything to the record."}, {"q": "Which set of symptoms suggests low blood sugar in a resident on glipizide?", "o": ["Thirst and frequent urination", "Shakiness, sweating, confusion, and irritability", "Dry cough and rash", "Constipation and drowsiness"], "a": 1, "w": "Shakiness, sweating, pallor, confusion, irritability, slurred speech, and hunger indicate hypoglycemia, especially if a meal was missed."}, {"q": "You are mid-pass and a call bell rings. What do you do with the medication?", "o": ["Leave the cup on the resident's table", "Secure the medication before responding", "Hand it to another resident to hold", "Put it in your pocket"], "a": 1, "w": "Unattended medication is both an error risk and a hazard to other residents. Secure it first."}, {"q": "Which of these is a high-alert medication requiring extra care?", "o": ["A multivitamin", "Warfarin", "Artificial tears", "Acetaminophen 325 mg"], "a": 1, "w": "Warfarin, insulin, opioids, digoxin, methotrexate, and potassium are high-alert: small errors cause severe harm."}, {"q": "A resident says an antibiotic gave her an upset stomach years ago. How should that be recorded?", "o": ["As a penicillin allergy", "Report exactly what happened and let the nurse classify it", "As no reaction at all", "Tell her to avoid all antibiotics"], "a": 1, "w": "Stomach upset is an intolerance, not an allergy. Mislabeling it as an allergy can deny her an important medication for life."}, {"q": "What is required for centrally stored medications?", "o": ["A locked cabinet or cart accessible only to authorized staff, each resident's medications separate and in original labeled containers", "One shared container sorted by time of day", "Storage in the dining room for convenience", "Storage with refrigerated food to save space"], "a": 0, "w": "Medications must be secured, separated by resident, and kept in their original pharmacy-labeled containers. Refrigerated items go in a separate labeled container, not with food."}, {"q": "A transdermal patch is due. What must you check first?", "o": ["Nothing — just apply it", "That the previous patch was removed", "That it matches the resident's shirt color", "That it is applied over the old one for better absorption"], "a": 1, "w": "Doubled fentanyl or nitroglycerin patches have caused deaths. Confirm removal of the old patch and rotate the site."}, {"q": "A resident is short of breath and her lips swell shortly after a new medication. What is your first action?", "o": ["Document and tell the next shift", "Call 911 and stay with her, then notify your supervisor", "Look the medication up online", "Give her water and wait"], "a": 1, "w": "Facial or throat swelling with breathing difficulty is anaphylaxis. Call 911 first, stay with her, then notify and document."}, {"q": "The controlled substance count will not reconcile at shift change. When do you report it?", "o": ["At the end of the shift", "Immediately", "Only if it happens twice", "Only if a resident complains"], "a": 1, "w": "A controlled substance discrepancy is reported immediately. Delay makes diversion harder to trace and implicates you."}, {"q": "Under Florida law, who is a mandatory reporter of suspected abuse or neglect of a resident?", "o": ["Only licensed nurses", "Only the administrator", "Every person, with no requirement of certainty or supervisor approval", "Only staff who witnessed it directly"], "a": 2, "w": "Florida makes every person a mandatory reporter. The Abuse Hotline is 1-800-96-ABUSE, and good-faith reporting is protected from retaliation."}]}, {"id": "amsa", "title": "Assistance with Self-Administration of Medications — 2 Hour Annual Update", "short": "Medication Assistance (Update)", "hours": 2, "certPre": "has completed 2 contact hrs. of the requirements set in sections 429.255 and 429.256, F.S and rule 59A-36.008", "certTitle": ["Assistance with Self-Administrating of Medications", "Lecture and Training."], "blurb": "The annual refresher for staff who have already completed the 6-hour initial course.", "body": [{"t": "h", "v": "1. Why this training exists"}, {"t": "p", "v": "Florida allows unlicensed staff in an assisted living facility to <em>assist</em> a resident with self-administration of medication only after the staff member has been trained by a licensed registered nurse, licensed practical nurse, licensed pharmacist, or physician. The authority and the limits come from sections 429.255 and 429.256, Florida Statutes, and Rule 59A-36.008, Florida Administrative Code."}, {"t": "p", "v": "The requirement is a six-hour initial course followed by a two-hour update annually. This course is the two-hour annual update, and it assumes you have completed the initial training. The point of the requirement is not paperwork: medication is the single most common source of harm in assisted living, and the line between \"assisting\" and \"administering\" is the line between lawful help and practicing nursing without a license."}, {"t": "h", "v": "2. Three different activities — know which one you are doing"}, {"t": "ul", "v": ["<strong>Self-administration.</strong> The resident takes their own medication without help. Staff may store the medication and may remind the resident that it is time to take it. Nothing more is needed.", "<strong>Assistance with self-administration.</strong> The resident is capable of understanding what the medication is and of directing that it be taken, but needs physical help. Trained unlicensed staff may assist. The resident stays in charge of the decision.", "<strong>Administration.</strong> The medication is given to a resident who cannot direct their own care, or by a route that requires clinical judgment. Only a licensed nurse (or other licensed professional acting within scope) may administer."]}, {"t": "note", "v": "If the resident cannot tell you what the medication is for, cannot recognize it, or cannot direct you to give it, you are no longer assisting — you are administering. Stop and get the nurse."}, {"t": "h", "v": "3. What \"assistance\" legally includes"}, {"t": "p", "v": "Under Rule 59A-36.008, assistance with self-administration includes all of the following, and you may do these after training:"}, {"t": "ul", "v": ["Taking the medication from where it is stored and bringing it to the resident.", "In the presence of the resident, reading the label aloud and confirming that the resident is the person named on the label.", "Removing a prescribed dose from the container and placing it in the resident's hand, or in another container, and helping the resident bring that container to their mouth.", "Applying topical medications — creams, ointments, lotions — to intact skin.", "Returning the medication to secure storage.", "Keeping a written record of the assistance you provided.", "Requesting and receiving refills from the pharmacy, and checking the label against the record when the refill arrives.", "Assisting with a prescribed dose of liquid by measuring it as directed on the label, or breaking a scored tablet along its score line as the label directs."]}, {"t": "h", "v": "4. What assistance does NOT include"}, {"t": "p", "v": "These acts are outside the scope of unlicensed assistance. Doing any of them is a violation and may be reported to the licensing board:"}, {"t": "ul", "v": ["Mixing, compounding, converting, or calculating a dose. Measuring a dose that the label already states is allowed; deciding how much to give is not.", "Crushing, splitting, or altering a medication that is not scored and labeled for it, or dissolving a tablet in food or liquid, unless a licensed nurse or the pharmacy label directs it.", "Administering any medication by injection, including insulin. A prefilled insulin syringe or pen prepared by a licensed person may be handed to a resident who self-injects, but you do not inject.", "Administering medication into the eye, ear, nose, rectum, or vagina, or by inhaler or nebulizer, beyond handing the device to a resident who directs its use — check your facility policy and the resident's care plan.", "Deciding whether a PRN (as-needed) medication is appropriate. The resident must request it and be able to state the symptom; if the resident cannot, notify the nurse.", "Assisting a resident who is refusing, resisting, or unable to participate. Never force, hide, or disguise medication."]}, {"t": "h", "v": "5. The six checks, every single time"}, {"t": "ul", "v": ["<strong>Right resident</strong> — read the name on the label out loud in front of the resident.", "<strong>Right medication</strong> — the label, not your memory.", "<strong>Right dose</strong> — as printed on the label.", "<strong>Right route</strong> — as printed on the label.", "<strong>Right time</strong> — within the window your facility policy allows, usually one hour before to one hour after the scheduled time.", "<strong>Right documentation</strong> — recorded at the time you assist, never in advance and never in a batch at the end of your shift."]}, {"t": "h", "v": "6. Records"}, {"t": "p", "v": "The medication observation record (MOR) is a legal document. Record the medication, dose, route, date, time, and your initials at the moment you assist. If a dose is not taken, do not leave the box blank — circle or code it and write why on the back or in the notes: refused, held per order, out of medication, resident at appointment, hospitalized. A blank box is read by a surveyor as a missed dose with no explanation."}, {"t": "p", "v": "Only a licensed person may change or transcribe an order. If a prescriber changes a dose by phone, the nurse takes that order. You do not write on or alter a pharmacy label — ever. The label is changed by the pharmacy."}, {"t": "h", "v": "7. Storage and security"}, {"t": "ul", "v": ["Centrally stored medication must be kept in a locked cabinet, cart, or room, accessible only to staff who are authorized.", "Each resident's medications are kept separate and in the original pharmacy-labeled container.", "Refrigerated medications go in a designated, labeled, leak-proof container separate from food.", "Controlled substances require a running count; discrepancies are reported immediately, not at the end of the shift.", "Discontinued, expired, or deceased-resident medications are disposed of per facility policy, witnessed by two people, and documented."]}, {"t": "h", "v": "8. When something goes wrong"}, {"t": "p", "v": "A medication error is any deviation: wrong resident, wrong drug, wrong dose, wrong time, wrong route, or an omitted dose. The response is always the same order of operations:"}, {"t": "ul", "v": ["Stay with the resident and check how they look and feel — breathing, color, alertness, complaints.", "Notify your supervisor and the facility nurse immediately. Do not wait to see if the resident \"seems fine.\"", "The nurse or supervisor contacts the prescriber, and Poison Control at 1-800-222-1222 if indicated.", "Call 911 for any sign of a serious reaction: trouble breathing, swelling of face or throat, chest pain, unresponsiveness, seizure.", "Document objectively what happened, what you observed, who you notified, and when. Complete an incident report.", "Never cover up, never correct the record after the fact, and never chart a dose that was not taken."]}, {"t": "note", "v": "Your own honesty is the safety system. An error that is reported in five minutes is usually harmless. An error that is hidden is the one that hurts someone."}, {"t": "h", "v": "9. When a resident's status changes"}, {"t": "p", "v": "If a resident who used to direct their own medications becomes confused, begins refusing consistently, cannot identify their medications, or starts needing you to decide for them, report it. That resident may now require administration by a licensed nurse, which can mean a health assessment (AHCA Form 1823), a care plan change, an Extended Congregate Care or Limited Nursing Services arrangement, or a different level of care. Recognizing that change is part of your job."}], "quiz": [{"q": "A resident asks you to help with her morning pills. She names each one, tells you what it is for, and asks you to open the bottles and put them in her hand. What is this?", "o": ["Administration of medication, which requires a nurse", "Assistance with self-administration, which you may do after training", "A violation, because you touched the medication", "Self-administration, so no documentation is needed"], "a": 1, "w": "The resident understands the medications and directs the act; you are providing physical help. That is assistance with self-administration, permitted for trained unlicensed staff, and it must be documented."}, {"q": "Who may provide the training that allows unlicensed staff to assist with self-administration in a Florida ALF?", "o": ["Any staff member who has worked there two years", "The administrator", "An RN, LPN, licensed pharmacist, or physician", "The pharmacy delivery driver"], "a": 2, "w": "Rule 59A-36.008 requires the training be given by a licensed registered nurse, licensed practical nurse, licensed pharmacist, or physician."}, {"q": "A resident's tablet is large and he has trouble swallowing it. The tablet is not scored and the label says nothing about crushing. What do you do?", "o": ["Crush it and mix it in applesauce", "Break it in half with your fingers", "Tell him to try harder and document it", "Do not alter it — notify the nurse or supervisor so the prescriber or pharmacy can change the form"], "a": 3, "w": "Crushing or altering a medication that is not scored and labeled for it is outside the scope of assistance. The nurse arranges a liquid, a smaller tablet, or a prescriber order."}, {"q": "Which of these may a trained unlicensed staff member do?", "o": ["Inject insulin into a resident's abdomen", "Measure 10 mL of a liquid antibiotic as stated on the label and hand it to the resident", "Decide that a resident seems anxious and give the PRN lorazepam", "Split an unscored blood pressure pill in half"], "a": 1, "w": "Measuring a dose the label already specifies is permitted. Injections, judging PRN appropriateness, and altering unscored tablets are not."}, {"q": "You realize at 2:00 PM that you forgot to assist a resident with his noon medication. What is the correct action?", "o": ["Give it now and chart it as given at noon", "Say nothing since only two hours passed", "Notify your supervisor and the nurse right away, then document the omission and who you notified", "Write it in the record tomorrow so the count comes out even"], "a": 2, "w": "An omitted dose is a medication error. Report immediately, document what actually happened, and let the nurse decide whether the dose should still be taken."}, {"q": "A resident refuses her evening medication. What goes in the medication observation record?", "o": ["Leave the box blank", "Initial it as given to avoid questions", "Code or circle the entry as refused and document the reason and the notification", "Write 'resident non-compliant' and nothing else"], "a": 2, "w": "Never leave a blank and never chart a dose that was not taken. Code the entry as refused, record the reason, and notify the nurse per policy."}, {"q": "Where must centrally stored medications be kept?", "o": ["In a locked cabinet or cart accessible only to authorized staff", "On an open shelf in the dining room for convenience", "In each resident's nightstand regardless of ability", "With the refrigerated food, to save space"], "a": 0, "w": "Centrally stored medication must be secured and accessible only to authorized staff. Refrigerated medications are kept in a separate labeled container, not mixed with food."}, {"q": "A resident who has managed her own medications for years now cannot name them and asks you to 'just give me whatever I'm supposed to have.' What does this signal?", "o": ["Nothing — keep assisting as before", "She may now require administration by a licensed nurse; report the change for reassessment", "You should decide for her which pills to give", "She should be discharged immediately"], "a": 1, "w": "A resident who can no longer direct the act is no longer self-administering. Report it so the nurse can reassess and the care plan and level of care can be adjusted."}, {"q": "Which statement about the pharmacy label is correct?", "o": ["You may write a new dose on the label if the doctor calls you", "You may cross out a discontinued medication's name", "The label is changed only by the pharmacy; you never alter it", "You may relabel a bottle if the print is too small"], "a": 2, "w": "Altering a pharmacy label is never within your scope. Order changes go through the nurse and the pharmacy issues a corrected label."}, {"q": "A resident becomes short of breath and her lips swell minutes after taking a new medication. What is your first priority?", "o": ["Finish your medication pass, then tell the nurse", "Call 911 and stay with her, then notify your supervisor", "Look up the medication online", "Document the reaction and wait for the next shift"], "a": 1, "w": "Signs of a serious reaction — breathing difficulty, facial or throat swelling — are a medical emergency. Call 911, stay with the resident, then notify the supervisor and document."}], "group": "alf", "skills": false}, {"id": "infection", "title": "Infection Control / Universal & Barrier Precautions / Covid-19", "short": "Infection Control", "hours": 2, "certPre": "has completed 2 contact hrs. (Updating OSHA Standards)", "certTitle": ["Infection Control/Universal & Barrier Precautions/Covid-19"], "blurb": "Standard precautions, hand hygiene, PPE, transmission-based precautions, and respiratory virus control in a residential care setting.", "body": [{"t": "h", "v": "1. The chain of infection"}, {"t": "p", "v": "Every infection needs six links. Break any one and the infection does not spread."}, {"t": "ul", "v": ["<strong>Infectious agent</strong> — the bacterium, virus, or fungus.", "<strong>Reservoir</strong> — where it lives: a person, a sink drain, a contaminated surface, standing water.", "<strong>Portal of exit</strong> — cough, wound drainage, stool, blood.", "<strong>Mode of transmission</strong> — contact (direct or via a surface), droplet, or airborne.", "<strong>Portal of entry</strong> — mouth, nose, eyes, broken skin, a catheter or IV site.", "<strong>Susceptible host</strong> — older adults, people with chronic illness, anyone immunocompromised or malnourished."]}, {"t": "p", "v": "In assisted living, the link you control most often is the mode of transmission, and the tool is your hands."}, {"t": "h", "v": "2. Standard precautions"}, {"t": "p", "v": "Standard precautions replaced the older idea of treating only \"known infectious\" residents differently. The rule is that blood, all body fluids, secretions, excretions (except sweat), non-intact skin, and mucous membranes are treated as potentially infectious for every resident, every time, regardless of diagnosis. You do not need to know a resident's status to be protected, and you are not permitted to relax precautions because you believe someone is \"clean.\""}, {"t": "p", "v": "Standard precautions include hand hygiene, PPE selected by the task, respiratory hygiene and cough etiquette, safe handling of sharps, safe injection practice, cleaning and disinfection of surfaces and equipment, and safe handling of linens and waste."}, {"t": "h", "v": "3. Hand hygiene"}, {"t": "p", "v": "Hand hygiene is the single most effective thing you will do all shift. Perform it:"}, {"t": "ul", "v": ["Before and after every resident contact.", "Before a clean or aseptic task — wound care, food handling, medication assistance.", "After contact with blood or body fluids, even if gloves were worn.", "After touching resident surroundings — bed rails, over-bed table, call bell.", "After removing gloves, and after using the restroom.", "Before eating and before putting on or taking off a mask."]}, {"t": "p", "v": "Alcohol-based hand rub containing 60 to 95 percent alcohol is preferred for routine hand hygiene: rub all surfaces until completely dry, about 20 seconds, and do not wipe it off. Use soap and running water for at least 20 seconds when hands are visibly soiled, after using the restroom, before eating, and — critically — whenever <em>Clostridioides difficile</em> or norovirus is suspected or confirmed, because alcohol does not kill those spores and viruses. Keep nails short and natural; artificial nails and chipped polish harbor organisms. Rings and wrist jewelry get in the way of proper technique."}, {"t": "h", "v": "4. Barrier precautions — PPE"}, {"t": "p", "v": "PPE is selected by the anticipated exposure, not by the diagnosis:"}, {"t": "ul", "v": ["<strong>Gloves</strong> — any contact with blood, body fluids, mucous membranes, non-intact skin, or contaminated items. Single use. Change between tasks on the same resident. Gloves are not a substitute for hand hygiene.", "<strong>Gown</strong> — when clothing or skin is likely to be soiled or splashed.", "<strong>Mask and eye protection</strong> — when splashes or sprays are possible, and for droplet precautions.", "<strong>N95 or higher respirator</strong> — airborne precautions, and requires fit testing and a medical evaluation under the OSHA respiratory protection standard. A surgical mask is not a respirator."]}, {"t": "p", "v": "<strong>Donning order:</strong> gown, then mask or respirator, then eye protection, then gloves. <strong>Doffing order:</strong> gloves, then eye protection, then gown, then mask or respirator — removing the most contaminated item first, and performing hand hygiene immediately after. Doff before leaving the resident's room, except for the respirator, which comes off after you exit. Never reuse a disposable gown, and never walk down a hallway in gloves you have used."}, {"t": "h", "v": "5. Transmission-based precautions"}, {"t": "ul", "v": ["<strong>Contact</strong> — MRSA, VRE, C. difficile, scabies, draining wounds. Gown and gloves for room entry; dedicated or disinfected equipment; soap and water for C. diff.", "<strong>Droplet</strong> — influenza, pertussis, RSV, group A strep, most respiratory viruses. Surgical mask on entry; mask the resident during transport.", "<strong>Airborne</strong> — tuberculosis, measles, varicella. N95 or higher, negative-pressure room if available, door closed, limited entry. Most ALFs cannot manage airborne isolation and must transfer the resident."]}, {"t": "p", "v": "Signage goes on the door, supplies go outside the room, and the care plan is updated. Precautions are lifted by the nurse or the medical provider, not by whoever is working that day."}, {"t": "h", "v": "6. COVID-19 and other respiratory viruses"}, {"t": "p", "v": "SARS-CoV-2 spreads mainly by respiratory particles from
