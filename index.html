/* ============================================================
   storage: Claude db  ->  remote endpoint  ->  this browser
   ============================================================ */
let DB = null, DL = null, settings = Object.assign({}, DEFAULTS), backend = "local";
let adminKey = "";
try{ adminKey = localStorage.getItem("alba-ce-adminkey") || ""; }catch(e){}
const remoteOn = () => !!REMOTE_URL;
const remoteUrl = (params) => REMOTE_URL + (REMOTE_URL.indexOf("?") > -1 ? "&" : "?") + params;

const LS = {
  key:"alba-ce-v1",
  read(){ try{ return JSON.parse(localStorage.getItem(this.key)||'{"subs":[],"settings":{}}'); }catch(e){ return {subs:[],settings:{}}; } },
  write(v){ try{ localStorage.setItem(this.key, JSON.stringify(v)); }catch(e){} }
};

async function bootCapabilities(){
  try{
    if (window.claude && window.claude.use){
      DB = await window.claude.use("db");
      DL = await window.claude.use("downloads");
    }
  }catch(e){ DB = null; }
  if (DB) backend = "db";
  else if (REMOTE_URL) backend = "remote";
  try{
    if (DB){
      const s = await DB.doc("settings/app").get();
      if (s.exists) settings = Object.assign({}, DEFAULTS, s.data());
    } else {
      settings = Object.assign({}, DEFAULTS, LS.read().settings||{});
    }
  }catch(e){}
  const b = document.getElementById("backendNote");
  if (b) b.textContent = backendLabel();
}
function backendLabel(){
  if (backend === "db") return T("backendDb");
  if (backend === "remote") return T("backendRemote");
  return T("backendLocal");
}

async function saveSubmission(rec){
  if (DB){
    const ref = DB.collection("submissions").doc();
    rec.id = ref.id;
    await ref.set(rec);
    return rec;
  }
  rec.id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const s = LS.read(); s.subs.push(rec); LS.write(s);   // local copy first, always
  if (REMOTE_URL){
    /* text/plain keeps this a "simple" request, so the browser sends no
       CORS preflight — Apps Script cannot answer an OPTIONS call. */
    await fetch(REMOTE_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({action:"save", key:WRITE_KEY, record:rec})
    });
  }
  return rec;
}
async function loadSubmissions(){
  if (DB){
    const snap = await DB.collection("submissions").orderBy("submittedAt","desc").limit(500).get();
    return snap.docs.map(d => Object.assign({id:d.id}, d.data()));
  }
  const local = LS.read().subs.slice().reverse();
  if (!REMOTE_URL) return local;
  const res = await fetch(remoteUrl("action=list&key=" + encodeURIComponent(adminKey)));
  if (!res.ok) throw Object.assign(new Error("roster"), {code:"http " + res.status});
  const rows = await res.json();
  if (!Array.isArray(rows)) throw Object.assign(new Error("roster"), {code:(rows && rows.error) || "bad response"});
  const seen = Object.create(null);
  rows.forEach(r => { if (r && r.id) seen[r.id] = true; });
  return rows.concat(local.filter(r => !seen[r.id]))
             .sort((a,b) => String(b.submittedAt||"").localeCompare(String(a.submittedAt||"")));
}
async function setStatus(id, status, extra){
  const patch = Object.assign({status, decidedAt:new Date().toISOString()}, extra||{});
  if (DB){ await DB.doc("submissions/"+id).update(patch); return; }
  const s = LS.read();
  const r = s.subs.find(x => x.id === id);
  if (r) Object.assign(r, patch);
  LS.write(s);
  if (REMOTE_URL){
    await fetch(REMOTE_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({action:"update", key:adminKey, id:id, patch:patch})
    });
  }
}
async function saveSettings(next){
  settings = Object.assign({}, settings, next);
  if (DB){ await DB.doc("settings/app").set(settings); return; }
  const s = LS.read(); s.settings = settings; LS.write(s);
}

let timer = null;
function screenLesson(cid){
  const c = byId(cid);
  const need = Math.round(settings.minMinPerHour * c.hours * 60);
  let spent = 0;
  toggleHomeBtn(true); currentCourse = cid; paintChrome();

  const blocks = CBODY(c).map(b => {
    if (b.t === "h") return `<h3>${b.v}</h3>`;

    if (b.t === "note") return `<div class="callout">${b.v}</div>`;
    return `<ul>${b.v.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  }).join("");

  show(`<div class="progress-bar noprint"><div class="pb-in">
      <span class="pb-t">${esc(L(c,"short"))}</span>
      <span class="pb-track"><span class="pb-fill" id="pbFill"></span></span>
      <span class="pb-time" id="pbTime"></span>
    </div></div>
    <div class="wrap"><article class="reader">
      <div class="kicker">${T("kicker",{hrs:c.hours, q:CQUIZ(c).length})}</div>
      <h1>${esc(L(c,"title"))}</h1>
      <p class="meta">${T("creditPrefix")}${esc(c.certPre.replace(/^has completed /,""))}</p>
      ${(lang === "es" && !translated(c)) ? `<div class="xlate">${T("notTranslated")}</div>` : ""}
      ${c.skills ? `<div class="callout">${T("skillsCallout")}</div>` : ""}
      ${blocks}
      <div class="gate">
        <p id="gateMsg"></p>
        <div class="btn-row">
          <button class="btn" id="startQuiz" disabled>${T("startTest")}</button>
          <button class="btn-line" id="backHome">${T("backCourses")}</button>
        </div>
      </div>
    </article></div>`);

  const fill = document.getElementById("pbFill");
  const tEl = document.getElementById("pbTime");
  const btn = document.getElementById("startQuiz");
  const msg = document.getElementById("gateMsg");

  function tick(){
    spent++;
    fill.style.width = Math.min(100, (spent/need)*100) + "%";
    const left = Math.max(0, need - spent);
    tEl.textContent = left > 0 ? T("timeLeft",{t:mmss(left)}) : T("timeMet");
    if (left === 0 && btn.disabled){
      btn.disabled = false;
      msg.textContent = T("gateReady",{q:CQUIZ(c).length, pct:settings.passPct});
      clearInterval(timer);
    }
  }
  msg.textContent = T("gateMsg",{hrs:c.hours, min:Math.round(need/60)});
  clearInterval(timer); timer = setInterval(tick, 1000); tick();

  btn.addEventListener("click", () => { clearInterval(timer); screenQuiz(cid, spent); });
  document.getElementById("backHome").addEventListener("click", () => { clearInterval(timer); screenHome(); });
}

function screenQuiz(cid, secondsRead){
  const c = byId(cid);
  const QZ = CQUIZ(c);
  const answers = new Array(QZ.length).fill(null);
  let i = 0;
  toggleHomeBtn(true); currentCourse = null; paintChrome();

  function render(){
    const q = QZ[i];
    const dots = QZ.map((_,k) =>
      `<span class="dot ${answers[k]!=null?"filled":""} ${k===i?"now":""}"></span>`).join("");
    show(`<div class="wrap"><div class="quiz">
      <div class="dots" aria-hidden="true">${dots}</div>
      <div class="qnum">${T("qOf",{i:i+1, n:QZ.length})} &middot; ${esc(L(c,"short"))}</div>
      <h2 class="qtext">${esc(q.q)}</h2>
      <div class="opts">${q.o.map((o,k)=>
        `<button class="opt ${answers[i]===k?"sel":""}" data-k="${k}">
           <span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div class="btn-row">
        ${i>0?`<button class="btn-line" id="prev">${T("prev")}</button>`:""}
        <button class="btn" id="next" ${answers[i]==null?"disabled":""}>${i===QZ.length-1?T("submitTest"):T("next")}</button>
        <span style="color:var(--ink-3);font-size:14.5px">${T("answered",{a:answers.filter(a=>a!=null).length, n:QZ.length})}</span>
      </div>
    </div></div>`);

    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      answers[i] = +b.dataset.k; render();
    }));
    const nx = document.getElementById("next");
    if (nx) nx.addEventListener("click", () => {
      if (i === QZ.length-1){
        const blank = answers.findIndex(a => a == null);
        if (blank > -1){ i = blank; render(); return; }
        grade();
      } else { i++; render(); }
    });
    const pv = document.getElementById("prev");
    if (pv) pv.addEventListener("click", () => { i--; render(); });
  }

  function grade(){
    let correct = 0;
    const detail = QZ.map((q,k) => {
      const ok = answers[k] === q.a;
      if (ok) correct++;
      return {q:q.q, picked:q.o[answers[k]], right:q.o[q.a], ok, why:q.w};
    });
    screenResult(cid, {correct, total:QZ.length, pct:Math.round((correct/QZ.length)*100), detail, secondsRead});
  }
  render();
}

let adminUnlocked = false;
function screenAdminGate(){
  toggleHomeBtn(true); currentCourse = null;
  show(`<div class="wrap" style="max-width:460px">
    <div class="panel">
      <h2>Instructor access</h2>
      <p class="sub">Review test results and sign certificates.</p>
      ${remoteOn()
        ? `<p class="skillnote">Enter your roster <strong>admin key</strong>. It is stored in this browser only, so you enter it once per device.</p>`
        : `<div class="warnbar">No shared roster is set up. Records will only exist in the browser that created them \u2014 a certificate you issue on your phone will not appear on your laptop.</div>`}
      <div class="field">
        <label for="code">${remoteOn() ? "Admin key" : "Access code"}</label>
        <input id="code" type="password" autocomplete="current-password">
      </div>
      <p class="err" id="codeErr" hidden>That code is not right.</p>
      <div class="btn-row"><button class="btn" id="go">Open panel</button></div>
    </div>
  </div>`);
  const tryIt = async () => {
    const val = document.getElementById("code").value.trim();
    const err = document.getElementById("codeErr");
    const go  = document.getElementById("go");
    err.hidden = true;
    if (!remoteOn()){
      if (val === ADMIN_CODE){ adminUnlocked = true; screenAdmin(); }
      else err.hidden = false;
      return;
    }
    /* with a shared roster the key itself is the credential: prove it works */
    go.disabled = true; go.textContent = "Checking\u2026";
    try{
      const res = await fetch(remoteUrl("action=list&key=" + encodeURIComponent(val)));
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("bad key");
      adminKey = val;
      try{ localStorage.setItem("alba-ce-adminkey", adminKey); }catch(e){}
      adminUnlocked = true; screenAdmin(); return;
    }catch(e){
      err.textContent = "That key was not accepted, or the roster could not be reached.";
      err.hidden = false;
    }
    go.disabled = false; go.textContent = "Open panel";
  };
  document.getElementById("go").onclick = tryIt;
  document.getElementById("code").addEventListener("keydown", e => { if (e.key === "Enter") tryIt(); });
  document.getElementById("code").focus();
}

    wireExport(body, subs, rows);
    return;
  }

  body.innerHTML = stats + `<div class="scroll-x"><table class="tbl">
    <thead><tr><th>Name</th><th>Course</th><th>Hrs</th><th>Score</th><th>Read</th><th>Lang</th><th>Submitted</th><th>Status</th><th></th></tr></thead>

function wireExport(body, subs, rows){
  const bar = document.createElement("div");

  bar.innerHTML = `<button class="btn-line btn-sm" id="pdf">Download roster (PDF)</button>
                   <button class="btn-line btn-sm" id="refresh">Refresh</button>`;
  body.appendChild(bar);
  document.getElementById("refresh").onclick = () => screenAdmin();
  document.getElementById("pdf").onclick = () => screenRoster(rows && rows.length ? rows : subs, adminTab);
}

async function exportCsv(subs){
  {
    const head = ["Name","Email","Facility","Course","Hours","Score","Correct","Total","MinutesRead","Submitted","Status","CertDate"];
    const esq = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
    const csv = [head.join(",")].concat(subs.map(s => [
      s.name, s.email, s.facility, s.courseTitle, s.hours, s.score, s.correct, s.total,
      s.minutesRead, s.submittedAt, s.status||"pending", s.certDate
    ].map(esq).join(","))).join("\r\n");
    const fname = "ce-roster-" + new Date().toISOString().slice(0,10) + ".csv";
    if (DL){
      try{ await DL.save({filename:fname, data:csv}); return; }catch(e){ if (e && e.code === "declined") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
    a.download = fname; a.click(); URL.revokeObjectURL(a.href);
  }
}

function fitDoc(){
  const el = document.getElementById("rosterEl");
  if (!el) return;
  const stage = el.parentElement;
  const k = Math.min(1, (stage.clientWidth - 20) / 816);
  el.style.transform = "scale(" + k + ")";
  stage.style.height = (el.offsetHeight * k + 44) + "px";
}
window.addEventListener("resize", () => { if (document.getElementById("rosterEl")) fitDoc(); });

function certNameSize(name){
  const n = (name||"").length;
  if (n <= 12) return 92;
  if (n <= 16) return 80;
  if (n <= 20) return 68;
  if (n <= 26) return 56;
  if (n <= 34) return 45;
  return 38;
}

  document.getElementById("fcRights").textContent =
    "\u00a9 " + new Date().getFullYear() + " " + BRAND.company + ". " + T("rights");
  const tel = document.getElementById("fcTel");
  tel.setAttribute("href", BRAND.phoneHref);
  tel.lastChild.textContent = " " + BRAND.phone;
  const cp = document.getElementById("fcCopy");
  if (!cp.classList.contains("done")) cp.innerHTML = ICON_COPY + "<span>" + T("copy") + "</span>";
  if (BRAND.logo) document.getElementById("fcLogo").src = BRAND.logo;
  document.getElementById("fcAbout").textContent = T("aboutLink");
  const tb = document.getElementById("themeBtn");
  tb.innerHTML = theme === "dark" ? ICON_SUN : ICON_MOON;
  const lbl = theme === "dark" ? T("toLight") : T("toDark");
  tb.setAttribute("aria-label", lbl);
  tb.setAttribute("title", lbl);
}
document.getElementById("themeBtn").onclick = () => setTheme(theme === "dark" ? "light" : "dark");

document.getElementById("fcCopy").onclick = async function(){
  const btn = this;
  const text = BRAND.phone;
  let ok = true;
  try{
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly","");
      ta.style.cssText = "position:fixed;top:-100px;opacity:0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }
  }catch(e){ ok = false; }
  btn.classList.add("done");
  btn.innerHTML = ICON_TICK + "<span>" + T(ok ? "copied" : "copyFail") + "</span>";
  setTimeout(() => { btn.classList.remove("done"); paintChrome(); }, 2200);
};
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
  if (lang === b.dataset.lang) return;
  lang = b.dataset.lang;
  try{ localStorage.setItem("alba-ce-lang", lang); }catch(e){}
  clearInterval(timer);
  if (currentCourse) screenLesson(currentCourse);
  else if (document.querySelector(".about")) screenAbout();
  else screenHome();
});
document.getElementById("fcAbout").onclick = () => { clearInterval(timer); screenAbout(); };
document.getElementById("aboutBtn").onclick = () => { clearInterval(timer); screenAbout(); };
document.getElementById("homeBtn").onclick = () => { clearInterval(timer); screenHome(); };
document.getElementById("adminBtn").onclick = () => {
  clearInterval(timer);
  if (adminUnlocked || (remoteOn() && adminKey)){ adminUnlocked = true; screenAdmin(); }
  else screenAdminGate();
};

paintChrome();
screenHome();
bootCapabilities().then(() => { if (!document.querySelector(".quiz, .reader, .cert")) screenHome(); });
</script>
</body>
</html>
