ema en la piel seca, pero nunca entre los dedos de los pies.", "El baño es la mejor oportunidad que tendrá para revisar toda la piel. Obsérvela a propósito."]}, {"t": "h", "v": "3. Cuidado bucal"}, {"t": "p", "v": "El cuidado bucal se hace al menos dos veces al día y no es opcional en residentes dependientes. Una boca descuidada produce dolor, pérdida de dientes, poco apetito y neumonía por aspiración — una causa principal de muerte en el cuidado a largo plazo."}, {"t": "ul", "v": ["Cepille dientes, encías y lengua con un cepillo suave durante dos minutos.", "Con dentaduras: retírelas, cepíllelas sobre un lavamanos forrado con un paño, enjuáguelas y limpie las encías y la lengua antes de volver a colocarlas. Guárdelas de noche en un recipiente etiquetado con solución o agua.", "En un residente que no puede tragar con seguridad, use mínima humedad, aspire si está capacitado y hay equipo, y colóquelo sentado — nunca acueste plano a un residente dependiente para el cuidado bucal.", "Reporte encías que sangran, dientes flojos, llagas, placas blancas, mal olor o rechazo a comer."]}, {"t": "h", "v": "4. Cuidado perineal e incontinencia"}, {"t": "ul", "v": ["Lave de adelante hacia atrás, siempre. En residentes femeninas, separe los labios y limpie de adelante hacia atrás con un área limpia del paño en cada pasada. En residentes masculinos, retraiga el prepucio si no está circuncidado, limpie la punta en movimiento circular y regrese el prepucio a su posición.", "Use agua tibia y un limpiador suave; enjuague y seque por completo.", "Brinde el cuidado de inmediato después de cada episodio de incontinencia. La orina y las heces sobre la piel causan dermatitis en pocas horas.", "Aplique un producto de barrera en la piel en riesgo según el plan de cuidado.", "Con una sonda permanente: limpie el periné y las primeras pulgadas del tubo alejándose del cuerpo, mantenga la bolsa por debajo del nivel de la vejiga y fuera del piso, nunca desconecte el sistema y evite dobleces. Reporte orina turbia, con sangre o con mal olor, ausencia de salida, fugas o dolor.", "Nunca restrinja los líquidos de un residente para reducir la incontinencia. Eso causa deshidratación, confusión, estreñimiento e infección."]}, {"t": "h", "v": "5. Integridad de la piel y lesiones por presión"}, {"t": "p", "v": "Las lesiones por presión se desarrollan donde el hueso está cerca de la superficie y la presión no se alivia: sacro, coxis, talones, caderas, codos, omóplatos, orejas y la parte posterior de la cabeza. Los factores que contribuyen son presión, fricción, cizallamiento, humedad, mala nutrición e hidratación, e inmovilidad."}, {"t": "ul", "v": ["<strong>Etapa 1</strong> — piel intacta con enrojecimiento que no palidece; en piel más oscura puede verse morada o azulada, o sentirse más caliente, más firme, más blanda o más dolorosa que el tejido de alrededor.", "<strong>Etapa 2</strong> — pérdida de espesor parcial; un área abierta superficial o una ampolla intacta o rota.", "<strong>Etapa 3</strong> — pérdida de espesor total con grasa visible.", "<strong>Etapa 4</strong> — pérdida de espesor total con músculo, tendón o hueso expuesto.", "Reporte también las heridas no clasificables, la sospecha de lesión de tejido profundo (coloración morada o marrón persistente) y el daño asociado a la humedad."]}, {"t": "p", "v": "La prevención es reposicionar al menos cada dos horas en cama y cada hora en silla, mantener los talones elevados del colchón, mantener la piel limpia y seca, levantar en lugar de arrastrar al reposicionar, evitar la cabecera de la cama por encima de 30 grados más tiempo del necesario y apoyar la ingesta de alimentos y líquidos. Reporte cada cambio nuevo en la piel el mismo día que lo vea — color, ampolla, área abierta, moretón, hinchazón, calor, erupción o una queja de dolor. Medir, clasificar y tratar heridas es el trabajo del enfermero; encontrarlas es el suyo."}, {"t": "h", "v": "6. Aseo, uñas y pies"}, {"t": "ul", "v": ["El cuidado del cabello, el rasurado y la ropa limpia son asuntos de dignidad, no lujos. Use rasuradora eléctrica en residentes con anticoagulantes o riesgo de sangrado.", "Limpie debajo de las uñas y líjelas según permita la política del centro.", "<strong>No corte las uñas de ningún residente con diabetes o enfermedad vascular periférica, ni de ningún residente con uñas gruesas, encarnadas o infectadas.</strong> Esas uñas las corta un enfermero o un podólogo. Un pequeño corte puede terminar en una amputación.", "Revise los pies diabéticos todos los días: entre los dedos, los talones y las plantas. Reporte de inmediato cualquier enrojecimiento, ampolla, callo, grieta, úlcera, cambio de color, diferencia de temperatura o pérdida de sensibilidad.", "Asegúrese de que el calzado quede bien, sea cerrado y se use con medias. Los residentes no deben caminar solo en medias ni con pantuflas flojas."]}, {"t": "h", "v": "7. Uso del baño y mecánica corporal"}, {"t": "p", "v": "Ofrezca llevar al baño según un horario en lugar de esperar a que lo pidan, especialmente con residentes con deterioro cognitivo. Responda los timbres rápido; un residente que se cansa de esperar es un residente que se cae intentándolo."}, {"t": "p", "v": "Protéjase también usted. Revise en el plan de cuidado el estado de traslado del residente y su capacidad de soportar peso antes de tocarlo. Use cinturón de marcha, nunca levante por debajo de los brazos, mantenga los pies separados y la espalda recta, doble las rodillas y las caderas, sostenga al residente cerca y gire con los pies en lugar de torcer el tronco. Si el plan de cuidado indica dos personas o una grúa mecánica, espere la ayuda — la lesión que evita puede ser la del residente, y puede ser la suya."}, {"t": "h", "v": "8. Observar, reportar, documentar"}, {"t": "p", "v": "Usted ve a cada residente con más frecuencia que cualquier enfermero o médico. Reporte el mismo día: dolor nuevo o que empeora, cualquier hallazgo nuevo en la piel, cambios en el apetito o la ingesta de líquidos, cambios en el patrón intestinal o urinario, confusión o aislamiento nuevos, un moretón o lesión sin explicación, dificultad para tragar, falta de aire y cualquier caída — incluso una sin lesión aparente."}, {"t": "p", "v": "Documente lo que observó, no lo que concluyó. “Área enrojecida de tres centímetros sobre el talón derecho, no palidece, la residente refiere dolor; se avisó al enfermero a las 09:15” sirve. “La piel se ve mal” no sirve. Y recuerde que una lesión sin explicación, una reacción de miedo o señales de negligencia deben reportarse bajo la ley de reporte obligatorio de Florida a la Línea de Abuso de Florida al 1-800-96-ABUSE. Toda persona es un reportante obligatorio; reportar no depende de que su supervisor esté de acuerdo."}], "quiz": [{"q": "¿Cuáles uñas nunca debe cortar?", "o": ["Las de cualquier residente mayor de 80 años", "Las de residentes con diabetes o enfermedad vascular periférica, y las uñas gruesas, encarnadas o infectadas", "Solo las de los pies", "Solo las uñas pintadas"], "a": 1, "w": "La mala circulación y la pérdida de sensibilidad hacen que un pequeño corte se convierta en una úlcera que no sana o lleve a una amputación. Esas uñas las corta un enfermero o un podólogo."}, {"q": "¿Cuál es la dirección correcta para el cuidado perineal?", "o": ["De atrás hacia adelante", "De adelante hacia atrás", "La que sea más rápida", "En círculo desde el ano hacia afuera"], "a": 1, "w": "Limpiar de adelante hacia atrás evita arrastrar microorganismos intestinales hacia la uretra, causa común de infección urinaria."}, {"q": "Una residente tiene un área enrojecida sobre el sacro que no se pone blanca al presionar. Esto es:", "o": ["Envejecimiento normal", "Una lesión por presión en Etapa 1 que debe reportarse hoy", "Un moretón que no requiere acción", "Algo para revisar la próxima semana"], "a": 1, "w": "El enrojecimiento que no palidece sobre una prominencia ósea es una lesión por presión en Etapa 1. Repórtela el mismo día; clasificar y tratar es función del enfermero."}, {"q": "¿Con qué frecuencia debe reposicionarse a un residente en cama que no puede moverse solo?", "o": ["Cada turno", "Al menos cada dos horas", "Una vez al día durante el cuidado", "Solo cuando se queje"], "a": 1, "w": "Al menos cada dos horas en cama y aproximadamente cada hora sentado en silla, con los talones elevados de la superficie."}, {"q": "Una residente se niega a su ducha por tercer día seguido. ¿Cuál es la mejor respuesta?", "o": ["Insistir, porque la higiene es obligatoria", "Documentar 'incumplidora' y seguir adelante", "Explorar la razón, ofrecer alternativas y reportar la negativa continua al enfermero", "Esperar a que se duerma y darle un baño en cama"], "a": 2, "w": "Los residentes tienen derecho a negarse. Una negativa repetida a la higiene suele señalar dolor, miedo, frío, depresión o cambio cognitivo y debe reportarse, no forzarse."}, {"q": "¿Cuál es un rango seguro de temperatura del agua para bañar a un adulto mayor?", "o": ["Aproximadamente 100 a 105 grados Fahrenheit, verificada antes del contacto", "Lo más caliente que el residente tolere", "La que salga del grifo", "Agua fría para estimular la circulación"], "a": 0, "w": "La piel del adulto mayor es más delgada y la sensibilidad puede estar reducida, así que la quemadura ocurre antes de que sienta el calor. Verifique usted la temperatura."}, {"q": "¿Por qué es importante el cuidado bucal en un residente dependiente?", "o": ["Solo por apariencia", "Previene dolor, pérdida de dientes, poco apetito y neumonía por aspiración", "Reemplaza las visitas al dentista", "Es opcional si el residente usa dentadura"], "a": 1, "w": "Las bacterias de una boca descuidada se aspiran a los pulmones. La neumonía por aspiración es una causa principal de muerte en el cuidado a largo plazo."}, {"q": "Antes de trasladar a un residente, ¿qué debe revisar primero?", "o": ["Si alguien lo está mirando", "El plan de cuidado: estado de traslado, capacidad de soportar peso y número de personas requeridas", "La talla de zapato del residente", "Nada — simplemente levantarlo por debajo de los brazos"], "a": 1, "w": "El plan de cuidado le dice qué es seguro. Levantar por debajo de los brazos puede dislocar un hombro, e intentar solo un traslado de dos personas lesiona a ambos."}, {"q": "Una residente con diabetes tiene una pequeña ampolla en el talón por un zapato nuevo. ¿Qué hace?", "o": ["Reventarla y poner una curita", "Reportarlo de inmediato al enfermero y quitar la presión del área", "Esperar a ver si sana sola", "Aplicar crema entre los dedos"], "a": 1, "w": "En un pie diabético, cualquier ruptura de la piel puede progresar a una úlcera profunda. Reporte de inmediato y descargue el área; nunca reviente una ampolla."}, {"q": "Nota un moretón sin explicación con forma de mano en el brazo de un residente. ¿Qué se requiere?", "o": ["Pedirle al residente que no lo mencione", "Reportarlo como sospecha de abuso, incluso a la Línea de Abuso de Florida al 1-800-96-ABUSE", "Decírselo a su supervisor solo si está completamente seguro", "Documentarlo y no hacer nada más"], "a": 1, "w": "Florida hace de toda persona un reportante obligatorio de sospecha de abuso, negligencia o explotación de un adulto vulnerable. Reportar no exige certeza ni la aprobación de un supervisor."}]}, "dnro": {"body": [{"t": "h", "v": "1. El requisito"}, {"t": "p", "v": "La Regla 59A-36.011 del Código Administrativo de Florida exige que un centro de vida asistida tenga políticas y procedimientos escritos sobre las órdenes de no resucitar, que las trate durante la admisión del residente y que capacite al personal sobre ellas. El Capítulo 765 de los Estatutos de Florida regula las directivas anticipadas en general. Este curso cubre qué son los documentos, qué debe hacer el centro y qué debe hacer usted cuando los segundos cuentan."}, {"t": "h", "v": "2. El DNRO de Florida"}, {"t": "p", "v": "En Florida, una orden de no resucitar se documenta en el <strong>Formulario DH 1896 del Departamento de Salud</strong>. Para que se respete, incluso por los servicios médicos de emergencia:"}, {"t": "ul", "v": ["Debe estar impreso en <strong>papel amarillo</strong> — el original o una copia reproducida en papel amarillo. Una fotocopia en blanco no la respetan los paramédicos.", "Debe estar firmado por el <strong>médico</strong> del residente.", "Debe estar firmado por el <strong>residente</strong> o, si está incapacitado, por el sustituto para decisiones de salud, el apoderado, el tutor designado por la corte o el mandatario con esa autoridad.", "No vence, pero debe revisarse periódicamente y siempre que cambie la condición o los deseos del residente.", "También se emite una versión en miniatura tipo tarjeta de billetera, igualmente válida."]}, {"t": "h", "v": "3. Qué significa y qué NO significa un DNRO"}, {"t": "p", "v": "Un DNRO significa una sola cosa: no intentar reanimación cardiopulmonar si el corazón o la respiración del residente se detienen. Es una instrucción sobre la reanimación, nada más."}, {"t": "p", "v": "Un DNRO <strong>no</strong> significa nada de lo siguiente:"}, {"t": "ul", "v": ["No significa no tratar. El residente sigue recibiendo medicamentos, cuidado de heridas, antibióticos, oxígeno y cualquier otro tratamiento ordenado.", "No significa no alimentar, no reposicionar ni no brindar cuidado personal.", "No significa suspender las medidas de confort. El control del dolor, la posición, el cuidado bucal, el abrigo y la compañía siempre se brindan.", "No significa no responder. Si un residente se cae, se atraganta con comida, sangra o tiene dificultad para respirar mientras todavía tiene pulso, usted responde por completo — incluso despejando una vía aérea obstruida y controlando el sangrado.", "No significa no llamar al 911. Los servicios de emergencia pueden seguir siendo necesarios para evaluación, confort y traslado, y respetarán un DNRO válido cuando se les presente."]}, {"t": "note", "v": "El malentendido más peligroso en un centro residencial es tratar un DNRO como una orden general de “no hacer nada”. Aplica únicamente a la RCP."}, {"t": "h", "v": "4. Directivas anticipadas — los otros documentos"}, {"t": "ul", "v": ["<strong>Testamento vital (living will)</strong> — la declaración escrita del residente sobre los procedimientos de prolongación de la vida que quiere o no quiere si tiene una condición terminal, una condición en etapa final o un estado vegetativo persistente. Orienta decisiones futuras; no es en sí una orden de suspender la RCP hoy.", "<strong>Designación de sustituto para decisiones de salud</strong> — nombra a la persona que decide sobre su atención si el residente no puede. En Florida también puede designarse para actuar mientras el residente conserva su capacidad, si el documento lo indica.", "<strong>Poder duradero</strong> — puede incluir autoridad sobre decisiones de salud, según cómo esté redactado.", "<strong>Declaración de tutor preseleccionado</strong> — nombra a quien el residente desea que la corte designe como tutor si algún día fuera necesario.", "<strong>Donación anatómica</strong> — los deseos sobre donación de órganos y tejidos.", "<strong>DNRO (DH 1896)</strong> — una orden médica, vigente de inmediato. Es el único de estos documentos que indica al personal y a los paramédicos no realizar RCP."]}, {"t": "p", "v": "Si un residente no tiene directiva anticipada y no puede decidir, la sección 765.401 de Florida establece un orden de sustitutos: tutor designado judicialmente, cónyuge, hijo adulto (o la mayoría de los hijos adultos), padre o madre, hermano adulto, pariente adulto, luego un amigo cercano y por último un trabajador social clínico licenciado seleccionado por el proceso bioético del centro."}, {"t": "h", "v": "5. Qué debe hacer el centro en la admisión"}, {"t": "ul", "v": ["Preguntar si el residente tiene una directiva anticipada o un DNRO y documentar la respuesta en el expediente.", "Entregar información escrita sobre las directivas anticipadas y la política del centro.", "Obtener una copia de cualquier documento existente y archivarla donde el personal la encuentre de inmediato — al frente del expediente, señalizada, con el DNRO amarillo fácil de localizar.", "Nunca condicionar la admisión ni el cuidado a que el residente tenga o no una directiva anticipada.", "Respetar el derecho del residente a no tener ninguna directiva anticipada. Nadie puede ser presionado a firmar una.", "Verificar de nuevo en cada cambio importante de condición y después de cualquier hospitalización, ya que estos documentos se pierden con frecuencia en los traslados."]}, {"t": "h", "v": "6. Revocación"}, {"t": "p", "v": "Un residente puede revocar un DNRO o una directiva anticipada <strong>en cualquier momento y por cualquier medio</strong> — rompiendo el formulario, diciéndolo en voz alta, avisando a un familiar o expresando la intención de cualquier forma. La revocación no requiere un escrito, un testigo ni la firma de un médico. Si un residente revoca, retire el formulario del expediente de inmediato, avise al enfermero, al administrador y al médico, y documente qué dijo el residente y cuándo. Un residente que dice “cambié de opinión, quiero que hagan todo” debe ser reanimado, sin importar lo que esté en el expediente."}, {"t": "h", "v": "7. Qué hace usted en una emergencia"}, {"t": "ul", "v": ["Pida ayuda y revise respuesta, respiración y pulso.", "Si no hay pulso ni respiración, y usted no tiene confirmación inmediata de un DNRO válido, <strong>inicie RCP</strong> y active el 911. Lo predeterminado es reanimar.", "Si hay un DH 1896 amarillo válido presente, no inicie compresiones ni respiraciones de rescate. Quédese con el residente, brinde confort, avise al supervisor, al enfermero, a la familia y al médico, y siga la política del centro sobre llamar al 911.", "Entregue el formulario amarillo a los paramédicos cuando lleguen, o envíelo con el residente durante el traslado.", "Documente la hora, qué encontró, qué se hizo, qué se omitió, la presencia del DNRO y cada persona a quien avisó."]}, {"t": "h", "v": "8. Los errores que realmente ocurren"}, {"t": "ul", "v": ["El DNRO no se encuentra cuando se necesita — archivado en una oficina, en un gabinete cerrado o todavía en la maleta del residente.", "La única copia es una fotocopia en blanco, que los paramédicos no respetarán.", "El formulario no está firmado por el médico o por el residente o su sustituto.", "El residente regresó del hospital con un estado de reanimación distinto al que está en el expediente y nadie lo reconcilió.", "El personal suspendió cuidados ordinarios — comida, reposicionamiento, oxígeno, una llamada al 911 por una caída — porque el residente “es DNR”.", "Se siguió el deseo verbal de un familiar en lugar del deseo documentado del residente. La directiva válida del propio residente es la que manda."]}, {"t": "p", "v": "Si alguna vez duda si un DNRO es válido o aplica, la respuesta es reanimar y llamar al 911. Esa es la conducta defendible legal y éticamente, y es la política del centro en todo caso de duda real."}], "quiz": [{"q": "Un DNRO válido en Florida debe ser:", "o": ["Cualquier nota escrita firmada por la familia", "El Formulario DH 1896 en papel amarillo, firmado por el médico y por el residente o su sustituto autorizado", "Una orden verbal documentada por el personal", "Un testamento vital guardado en el expediente"], "a": 1, "w": "Florida exige el Formulario DH 1896, en papel amarillo, con la firma del médico y la del residente o de la persona autorizada para decidir."}, {"q": "Una residente con un DNRO válido se cae y sangra por una herida en la cabeza. Está despierta y hablando. ¿Qué hace?", "o": ["Nada, porque tiene un DNRO", "Brindar primeros auxilios, controlar el sangrado, avisar al enfermero y llamar al 911 según corresponda", "Esperar a que la familia decida", "Solo documentar la caída"], "a": 1, "w": "Un DNRO aplica únicamente a la RCP cuando el corazón y la respiración se han detenido. Todo el demás cuidado, incluida la respuesta de emergencia, continúa por completo."}, {"q": "¿Cuál documento es una orden médica vigente de inmediato?", "o": ["Un testamento vital", "Una designación de sustituto para decisiones de salud", "Un DNRO en el Formulario DH 1896", "Una declaración de tutor preseleccionado"], "a": 2, "w": "Solo el DNRO es una orden médica vigente que indica no realizar RCP. El testamento vital orienta decisiones futuras sobre procedimientos de prolongación de la vida."}, {"q": "Un residente le dice: 'Rompí ese papel amarillo — ahora quiero que hagan todo'. ¿Cuál es el efecto?", "o": ["Ninguno hasta que se firme una nueva orden médica", "Ninguno, porque la revocación requiere un testigo", "El DNRO queda revocado; avise al enfermero y al médico, documéntelo y reanime si es necesario", "Solo cuenta si la familia está de acuerdo"], "a": 2, "w": "Un residente puede revocar en cualquier momento y por cualquier medio, sin escrito ni testigo. La revocación surte efecto de inmediato."}, {"q": "Encuentra a un residente sin respuesta y sin pulso. No localiza ningún DNRO. ¿Qué hace?", "o": ["Esperar al enfermero antes de hacer algo", "Buscar en el expediente hasta encontrar algo", "Iniciar RCP y activar el 911", "Suponer que es DNR por su edad"], "a": 2, "w": "Lo predeterminado es siempre reanimar. Si no hay un DNRO válido disponible de inmediato, inicie RCP y llame al 911."}, {"q": "¿Cuál afirmación sobre las directivas anticipadas en la admisión es correcta?", "o": ["Se puede exigir al residente firmar una antes de la admisión", "El centro debe preguntar, documentar, dar información y nunca condicionar el cuidado a tener una", "Solo hay que preguntarles a los residentes mayores de 80 años", "El centro decide el estado de reanimación del residente"], "a": 1, "w": "El centro debe preguntar y documentar, entregar información escrita, y nunca condicionar la admisión ni el cuidado a la existencia de una directiva anticipada."}]}, "hipaa": {"body": [{"t": "h", "v": "1. El marco legal"}, {"t": "p", "v": "HIPAA — la Ley de Portabilidad y Responsabilidad del Seguro de Salud de 1996 — produjo dos reglas que rigen la práctica diaria: la <strong>Regla de Privacidad</strong>, que limita cómo se puede usar y divulgar la información de salud protegida, y la <strong>Regla de Seguridad</strong>, que exige salvaguardas para esa información en formato electrónico. La Ley HITECH de 2009 y la Regla Ómnibus de 2013 agregaron los requisitos de notificación de filtraciones, extendieron la responsabilidad directa a los socios comerciales y aumentaron las sanciones. La ley de Florida añade sus propias protecciones, incluidas la sección 456.057 sobre expedientes de pacientes y la sección 381.004 sobre información de VIH."}, {"t": "h", "v": "2. A quién aplica"}, {"t": "ul", "v": ["<strong>Entidades cubiertas</strong> — planes de salud, cámaras de compensación de salud y proveedores que transmiten información de salud electrónicamente en relación con una transacción cubierta.", "<strong>Socios comerciales</strong> — proveedores externos que crean, reciben, mantienen o transmiten información protegida por cuenta de una entidad cubierta: empresas de facturación, proveedores de expedientes electrónicos, servicios de destrucción de documentos, contratistas de informática. Tienen responsabilidad directa y deben firmar un acuerdo de socio comercial.", "Los centros de vida asistida con frecuencia son entidades cubiertas, y aun donde el análisis sea discutible, la política del centro, la ley de Florida y los derechos del residente exigen la misma disciplina. La regla práctica es sencilla: trate la información de salud de todo residente como legalmente protegida."]}, {"t": "h", "v": "3. Qué cuenta como información de salud protegida"}, {"t": "p", "v": "La información protegida (PHI) es información de salud identificable individualmente en cualquier forma — electrónica, en papel o hablada. Los identificadores incluyen nombre, dirección y cualquier subdivisión geográfica menor que un estado, todas las fechas más específicas que un año (incluidas la fecha de nacimiento y la de admisión), números de teléfono y fax, correo electrónico, número de Seguro Social, números de expediente médico y de plan de salud, números de cuenta, números de certificado y licencia, identificadores de vehículos y dispositivos, direcciones de internet e IP, identificadores biométricos, fotografías de rostro completo e imágenes comparables, y cualquier otro número o característica única de identificación."}, {"t": "p", "v": "Un diagnóstico sin un nombre asociado no es PHI. Un nombre sin información de salud no es PHI. Júntelos — “el señor de la habitación 214 con el nuevo diagnóstico de demencia” — y ya tiene PHI, aunque nunca dijo su nombre, porque el número de habitación lo identifica."}, {"t": "h", "v": "4. Usos y divulgaciones permitidas"}, {"t": "ul", "v": ["<strong>Tratamiento, pago y operaciones de atención de salud (TPO)</strong> — las divulgaciones con estos fines no requieren autorización.", "<strong>Mínimo necesario</strong> — incluso para fines permitidos, use y divulgue solo la menor cantidad de información necesaria para la tarea. Este es el principio que el personal bienintencionado viola con más frecuencia. La curiosidad nunca es un fin permitido, y mirar el expediente de un residente que no está a su cuidado — o de un compañero, un vecino o un familiar — es una violación aunque no se lo cuente a nadie.", "<strong>Al propio residente</strong>, siempre.", "<strong>A familiares y cuidadores involucrados en el cuidado</strong> — permitido si el residente está de acuerdo, no objeta cuando se le da la oportunidad, o está incapacitado y la divulgación es en su mejor interés y se limita a lo relevante para la participación de esa persona.", "<strong>Exigida por ley</strong> — reporte de abuso, reporte de enfermedades transmisibles a salud pública, órdenes judiciales, ciertas solicitudes policiales y agencias de supervisión como AHCA y el Ombudsman de Cuidado a Largo Plazo.", "<strong>Todo lo demás</strong> — incluidos mercadeo, la mayoría de la investigación y divulgaciones a empleadores — requiere una autorización escrita válida del residente."]}, {"t": "p", "v": "Las <strong>divulgaciones incidentales</strong> que ocurren a pesar de salvaguardas razonables no son violaciones: un visitante que escucha parte de una conversación en voz baja en un pasillo, un nombre visible por un momento en un expediente. La prueba es si usted tomó precauciones razonables, no si era imposible que alguien escuchara."}, {"t": "h", "v": "5. Derechos del residente bajo la Regla de Privacidad"}, {"t": "ul", "v": ["Recibir un Aviso de Prácticas de Privacidad y saber cómo se usa su información.", "Revisar y obtener una copia de su expediente, en general dentro de 30 días y con una tarifa razonable basada en costos.", "Solicitar una corrección de información que considere inexacta.", "Recibir un informe de ciertas divulgaciones.", "Solicitar restricciones sobre usos y divulgaciones, y exigir una restricción de divulgación a un plan de salud por servicios pagados en su totalidad de su propio bolsillo.", "Solicitar comunicaciones confidenciales — otro número de teléfono, otra dirección.", "Presentar una queja ante el centro o directamente ante la Oficina de Derechos Civiles del HHS, sin represalias."]}, {"t": "h", "v": "6. Salvaguardas de la Regla de Seguridad"}, {"t": "ul", "v": ["<strong>Administrativas</strong> — análisis de riesgos, capacitación del personal, política de sanciones, autorización de acceso, planes de contingencia y un oficial designado de privacidad y seguridad.", "<strong>Físicas</strong> — control de acceso al edificio, políticas de ubicación y uso de estaciones de trabajo, posición de las pantallas, almacenamiento bajo llave y eliminación segura de equipos y medios.", "<strong>Técnicas</strong> — identificadores únicos de usuario, cierre automático de sesión, cifrado de datos en reposo y en tránsito, controles de auditoría y revisión de registros, y controles de integridad."]}, {"t": "p", "v": "Su parte en eso es concreta: nunca comparta su contraseña, nunca use la de otra persona, cierre la sesión en lugar de alejarse, bloquee la pantalla, no ponga información de residentes en su correo personal ni en la nube personal, no envíe información de residentes por mensaje desde su teléfono personal, no fotografíe residentes ni expedientes, evite las memorias USB o cífrelas, y destruya con trituradora en lugar de tirar papel con información protegida. Una computadora portátil o un teléfono con información sin cifrar robado de un carro es una de las filtraciones reportables más comunes del país."}, {"t": "h", "v": "7. Las situaciones diarias que crean violaciones"}, {"t": "ul", "v": ["Hablar de un residente en el comedor, el elevador, la sala de descanso, el estacionamiento o la camioneta donde otros pueden oír.", "Una hoja de registro o un pizarrón que muestre diagnósticos, o un tablero de censo visible a los visitantes.", "Enviar un fax a un número no verificado, o dejar información clínica detallada en un buzón de voz sin confirmar quién lo recibe.", "Dejar un expediente, un registro de medicamentos o una impresión abierta en un mostrador, o una computadora con la sesión abierta.", "Contarle al vecino de un residente o a otro residente por qué alguien fue al hospital.", "Responderle a quien llama diciendo que es familiar sin verificar su identidad y sin confirmar que el residente está de acuerdo.", "Buscar en el sistema a una figura pública, a un compañero o a un pariente por curiosidad. Los registros de auditoría lo captan y esto es una causa común de despido.", "Tomar una foto o un video donde puedan aparecer residentes o expedientes."]}, {"t": "h", "v": "8. Redes sociales"}, {"t": "p", "v": "Nunca publique, envíe ni comparta nada sobre un residente — ninguna fotografía, ningún video, ninguna descripción, ningún número de habitación, ningún nombre de pila, ninguna historia de “no van a creer lo que pasó hoy en el trabajo”. Quitar el nombre no es anonimizar si algún detalle puede identificar a la persona ante quien la conoce. Ha habido empleados despedidos, multados, reportados a juntas de licencias y acusados penalmente por publicaciones en redes sociales, incluidas publicaciones hechas desde casa en cuentas personales y publicaciones con intención cariñosa. Si un residente o su familia le piden aparecer en una foto, siga la política del centro y obtenga autorización escrita; un permiso verbal que no quedó registrado en ninguna parte no lo protege a usted ni a ellos."}, {"t": "h", "v": "9. Notificación de filtraciones"}, {"t": "p", "v": "Una filtración es la adquisición, acceso, uso o divulgación no permitida de información protegida no asegurada. Se presume que hay filtración salvo que una evaluación de riesgos documentada demuestre baja probabilidad de compromiso, considerando la naturaleza y el alcance de la información, quién la obtuvo o usó, si fue realmente vista o adquirida y en qué medida se mitigó el riesgo."}, {"t": "ul", "v": ["A las personas afectadas se les debe notificar sin demora injustificada y a más tardar <strong>60 días</strong> después del descubrimiento.", "Las filtraciones que afectan a <strong>500 o más</strong> residentes en un estado o jurisdicción requieren además aviso a los medios locales importantes y al HHS de forma simultánea.", "Las filtraciones menores se registran y se reportan al HHS anualmente, dentro de los 60 días posteriores al cierre del año calendario.", "Su obligación es reportar de inmediato a su supervisor o al oficial de privacidad. El reloj empieza en el descubrimiento, y una demora en su reporte se convierte en la demora del centro."]}, {"t": "h", "v": "10. Sanciones"}, {"t": "p", "v": "Las sanciones civiles se escalonan según la culpabilidad, desde violaciones por desconocimiento hasta causa razonable, negligencia intencional corregida y negligencia intencional no corregida, con montos importantes por violación y topes anuales ajustados por inflación. Las sanciones penales aplican a la divulgación indebida hecha a sabiendas, y aumentan mucho cuando el delito se comete con pretextos falsos o con fines de ventaja comercial, beneficio personal o daño malicioso — hasta diez años de prisión en el nivel más grave. Se ha procesado a empleados individuales, no solo a los empleadores. A la exposición federal se suman las sanciones de Florida, la disciplina profesional, la pérdida del empleo y la responsabilidad civil."}, {"t": "h", "v": "11. Las protecciones adicionales de Florida"}, {"t": "ul", "v": ["<strong>Sección 456.057 de los Estatutos de Florida</strong> — los expedientes de pacientes en poder de profesionales de salud licenciados son confidenciales y no pueden divulgarse sin autorización escrita del paciente, con excepciones específicas.", "<strong>Sección 381.004</strong> — los resultados de la prueba de VIH y el estado de VIH requieren autorización escrita específica para su divulgación; una autorización médica general no es suficiente.", "<strong>Expedientes de salud mental</strong> bajo el Capítulo 394 y <strong>expedientes de trastornos por uso de sustancias</strong> bajo la norma federal 42 CFR Parte 2 tienen protección reforzada; la Parte 2 restringe incluso la re-divulgación por parte de quien la recibe.", "<strong>Los derechos del residente</strong> en la sección 429.28 incluyen el derecho a comunicación privada y sin censura y a la confidencialidad de sus expedientes.", "Cuando la ley de Florida protege más que HIPAA, aplica la ley de Florida. Cuando HIPAA protege más, aplica HIPAA. En la práctica: siga la regla más estricta."]}, {"t": "h", "v": "12. Si ve un problema"}, {"t": "p", "v": "Reporte de inmediato cualquier sospecha de violación a su supervisor o al oficial de privacidad del centro — incluidos sus propios errores. Los errores reportados por uno mismo se manejan habitualmente como asuntos de capacitación; los errores ocultados se convierten en despidos y acciones de cumplimiento. Reportar de buena fe está protegido, y tomar represalias contra usted por reportar es en sí una violación."}], "quiz": [{"q": "¿Cuál de las siguientes es información de salud protegida?", "o": ["Un diagnóstico sin ningún dato de identificación", "Decir que 'el señor de la habitación 214 acaba de ser diagnosticado con demencia'", "Un artículo general sobre la demencia", "El número de residentes en el edificio"], "a": 1, "w": "El número de habitación identifica a la persona, así que combinarlo con un dato de salud crea información protegida incluso sin usar el nombre."}, {"q": "El principio de 'mínimo necesario' significa:", "o": ["Compartir todo el expediente para que no falte nada", "Usar y divulgar solo la menor información necesaria para la tarea", "Que solo el personal licenciado puede ver expedientes", "Que los expedientes se guardan un tiempo mínimo"], "a": 1, "w": "Incluso para fines permitidos, el acceso y la divulgación se limitan a la menor cantidad de información requerida. La curiosidad nunca es un fin permitido."}, {"q": "Usted revisa el expediente médico de un compañero por preocupación, pero no le cuenta a nadie lo que vio. ¿Es una violación?", "o": ["No, porque se lo guardó", "No, porque usted trabaja ahí", "Sí — acceder a un expediente sin necesidad laboral es una violación y queda en los registros de auditoría", "Solo si el compañero se queja"], "a": 2, "w": "El acceso en sí es la violación. Los registros de auditoría lo captan, y esta es una de las causas más comunes de despido relacionadas con HIPAA."}, {"q": "Una persona llama diciendo que es la hija de un residente y pregunta por su condición. ¿Qué debe hacer?", "o": ["Responder, porque la familia tiene derecho a saber", "Verificar la identidad y confirmar que el residente está de acuerdo o no objeta, y compartir solo lo relevante", "Dar todos los detalles clínicos a cualquier familiar", "Negarse a toda comunicación con la familia"], "a": 1, "w": "La divulgación a familiares involucrados en el cuidado está permitida cuando el residente está de acuerdo, no objeta o está incapacitado y le conviene — y debe limitarse a lo relevante."}, {"q": "¿Cuál es el plazo para notificar a las personas afectadas por una filtración de información no asegurada?", "o": ["Dentro de 24 horas", "Sin demora injustificada y a más tardar 60 días después del descubrimiento", "Dentro de un año", "Solo si afecta a más de 500 personas"], "a": 1, "w": "El aviso individual se debe dar sin demora injustificada y a más tardar 60 días después del descubrimiento. Las filtraciones de 500 o más requieren además aviso a los medios y al HHS de forma simultánea."}, {"q": "Publicar en su Facebook personal una foto de la fiesta de cumpleaños de un residente, sin usar nombres, es:", "o": ["Aceptable, porque no se usaron nombres", "Aceptable, porque el residente posó para la foto", "Una violación de HIPAA — las imágenes son identificadores y se requiere autorización", "Aceptable si su cuenta es privada"], "a": 2, "w": "Las fotografías de rostro completo e imágenes comparables son identificadores. Las cuentas personales, la configuración privada y la buena intención no son defensas."}, {"q": "Bajo la ley de Florida, divulgar resultados de una prueba de VIH requiere:", "o": ["Una autorización médica general", "Ninguna autorización si la familia pregunta", "Autorización escrita específica para información de VIH", "Solo la aprobación del administrador"], "a": 2, "w": "La sección 381.004 exige autorización escrita específica. Una autorización médica general no cubre la información de VIH."}, {"q": "Un visitante escucha parte de una conversación en voz baja entre usted y el enfermero junto al carro de medicamentos. Esto es:", "o": ["Una filtración reportable automática", "Probablemente una divulgación incidental, permitida si había salvaguardas razonables", "Motivo de despido inmediato", "Nunca un problema"], "a": 1, "w": "Las divulgaciones incidentales que ocurren a pesar de salvaguardas razonables están permitidas. La prueba es si se tomaron precauciones razonables."}, {"q": "¿Cuál es una salvaguarda técnica bajo la Regla de Seguridad?", "o": ["Cerrar con llave el cuarto de expedientes", "La capacitación del personal", "Identificadores únicos de usuario, cierre automático de sesión y cifrado", "Colocar el Aviso de Prácticas de Privacidad"], "a": 2, "w": "La identificación única, el cierre automático de sesión, el cifrado y los controles de auditoría son salvaguardas técnicas. El almacenamiento bajo llave es física; la capacitación es administrativa."}, {"q": "Envía por error el plan de cuidado de un residente a la dirección equivocada. ¿Qué debe hacer?", "o": ["Borrar el mensaje enviado y no decir nada", "Reportarlo de inmediato a su supervisor o al oficial de privacidad", "Esperar a ver si alguien responde", "Pedirle al destinatario que lo borre y darlo por resuelto"], "a": 1, "w": "Reporte de inmediato. El plazo de la filtración empieza en el descubrimiento, y los errores reportados por uno mismo se manejan mucho mejor que los ocultados. Las represalias por reportar de buena fe son en sí una violación."}]}, "cpr": {"body": [{"t": "h", "v": "1. Por qué las compresiones deciden el resultado"}, {"t": "p", "v": "El paro cardíaco significa que el corazón dejó de mover la sangre. Las células del cerebro empiezan a morir en minutos, y la supervivencia baja entre siete y diez por ciento por cada minuto que pasa sin RCP. La RCP hecha por un testigo puede duplicar o triplicar la supervivencia. Nada de lo que aprenda en este curso importa tanto como comprimir fuerte, comprimir rápido y no detenerse."}, {"t": "p", "v": "La cadena de supervivencia del adulto fuera del hospital: reconocer el paro y activar la respuesta de emergencia, iniciar de inmediato RCP de alta calidad, usar un desfibrilador en cuanto haya uno disponible, brindar reanimación avanzada, dar cuidado posparo y apoyar la recuperación. En bebés y niños la cadena empieza antes, con la prevención, porque la mayoría de los paros pediátricos comienzan como un problema respiratorio y no como un problema del ritmo cardíaco."}, {"t": "h", "v": "2. Reconocer el paro cardíaco"}, {"t": "ul", "v": ["Verifique la respuesta — toque y grite. Con un residente, use su nombre.", "Observe si respira normalmente durante no más de 10 segundos, y verifique el pulso al mismo tiempo si está capacitado para hacerlo.", "<strong>El boqueo agónico no es respiración.</strong> Jadeos ruidosos ocasionales, ronquidos o gorgoteos en una persona sin respuesta significan paro cardíaco. Esta es la razón más común por la que se retrasa la RCP.", "Si la persona no responde y no respira normalmente, está en paro cardíaco. Actúe. El daño que puede causar a alguien que no necesitaba RCP es mucho menor que el daño a alguien que la necesitaba y no la recibió."]}, {"t": "h", "v": "3. Pedir ayuda"}, {"t": "ul", "v": ["Solo y con teléfono: póngalo en altavoz, llame al 911 y empiece las compresiones. No se vaya a buscar un teléfono.", "Solo y sin teléfono, y un adulto se desploma: active la respuesta de emergencia primero, traiga el DEA si está cerca, luego inicie RCP.", "Solo con un bebé o un niño cuyo desplome no presenció: dé unos dos minutos de RCP primero, luego llame al 911 y traiga el DEA — porque la causa suele ser respiratoria y la ventilación temprana junto con las compresiones es lo que más importa.", "En un centro: mande a una persona específica. “Usted, el de la camisa azul, llame al 911 y traiga el DEA del vestíbulo” funciona. “Que alguien llame al 911” no funciona."]}, {"t": "h", "v": "4. Compresiones de alta calidad"}, {"t": "ul", "v": ["<strong>Posición</strong> — centro del pecho, mitad inferior del esternón. Adultos: talón de una mano con la otra encima, brazos rectos, hombros directamente sobre las manos. Niños: una o dos manos según el tamaño. Bebés: dos dedos justo debajo de la línea de los pezones, o los dos pulgares rodeando el tórax si hay dos rescatadores.", "<strong>Frecuencia</strong> — 100 a 120 compresiones por minuto, en toda edad. Más rápido no es mejor; por encima de 120 el tórax no se vuelve a llenar.", "<strong>Profundidad</strong> — al menos 2 pulgadas (5 cm) en un adulto y no más de 2.4 pulgadas. Alrededor de un tercio de la profundidad del tórax en un niño, unas 2 pulgadas, y cerca de 1.5 pulgadas en un bebé.", "<strong>Retroceso completo</strong> — deje que el tórax vuelva por completo a su posición entre compresiones. Apoyarse sobre el pecho es el error de técnica más común y es lo que impide que la sangre regrese al corazón.", "<strong>Minimice las interrupciones</strong> — mantenga cualquier pausa por debajo de 10 segundos. Busque estar comprimiendo más del 60 por ciento del tiempo.", "<strong>Superficie</strong> — firme y plana. Mueva al residente del colchón blando al piso si puede hacerlo rápido, o use una tabla.", "<strong>Cambie de rescatador cada 2 minutos</strong>, o antes si se cansa, y haga el cambio en menos de 5 segundos. La calidad de las compresiones baja de forma medible en uno o dos minutos, aunque usted no se sienta cansado."]}, {"t": "h", "v": "5. Respiraciones de rescate y proporciones"}, {"t": "ul", "v": ["Abra la vía aérea con inclinación de la cabeza y elevación del mentón. Si sospecha trauma, use la tracción mandibular.", "Cada respiración dura cerca de un segundo y es solo la suficiente para que el pecho se eleve visiblemente. Ventilar en exceso empuja aire al estómago, provoca vómito y sube la presión en el tórax, de modo que regresa menos sangre al corazón.", "<strong>Adulto, uno o dos rescatadores: 30 compresiones por 2 respiraciones.</strong>", "<strong>Niño o bebé, un rescatador: 30 por 2. Dos rescatadores: 15 por 2.</strong>", "Use un dispositivo de barrera — mascarilla de bolsillo o bolsa-mascarilla — siempre que haya uno disponible. En un centro siempre debería haberlo.", "La RCP solo con compresiones es aceptable y muy recomendada para un rescatador sin capacitación o que no quiera dar respiraciones a un adulto. En bebés, niños, ahogamiento y sobredosis, las respiraciones sí importan, porque el problema empezó con la falta de oxígeno."]}, {"t": "h", "v": "6. Atragantamiento"}, {"t": "ul", "v": ["<strong>Obstrucción leve</strong> — la persona puede toser, hablar o emitir sonido. Quédese cerca y anímela a toser. No intervenga.", "<strong>Obstrucción grave en adulto o niño que responde</strong> — silencio, se agarra la garganta, no mueve aire. Pregunte “¿se está atragantando?” y luego dé compresiones abdominales justo arriba del ombligo. Use compresiones en el pecho si la persona está embarazada o es demasiado grande para abrazarla.", "<strong>Bebé que responde</strong> — alterne 5 golpes en la espalda y 5 compresiones en el pecho, sosteniendo la cabeza y el cuello, boca abajo sobre su antebrazo.", "<strong>Si deja de responder</strong> — bájela al piso e inicie RCP. Mire dentro de la boca cada vez que abra la vía aérea para dar respiraciones y retire un objeto solo si lo puede ver. Nunca barra con el dedo a ciegas.", "Toda persona que reciba compresiones abdominales debe ser evaluada médicamente."]}, {"t": "h", "v": "7. Situaciones especiales en un centro residencial"}, {"t": "ul", "v": ["<strong>Verifique si hay un DNRO antes de empezar.</strong> Un DH 1896 de Florida válido en papel amarillo significa no dar RCP. Si no hay formulario disponible de inmediato, inicie RCP.", "Las dentaduras normalmente se dejan en su lugar; ayudan al sello de la mascarilla. Retírelas solo si están flojas y obstruyen.", "Un marcapasos o desfibrilador implantado no cambia las compresiones; coloque los parches del DEA al menos a una pulgada del dispositivo.", "Las costillas pueden fracturarse durante una RCP correcta, sobre todo en adultos mayores. Eso es una consecuencia aceptada, no una razón para comprimir superficialmente.", "El vómito es común. Gire a la persona como una unidad, limpie la boca y continúe.", "Deténgase solo cuando la persona muestre signos claros de vida, cuando el DEA le indique separarse, cuando los paramédicos tomen el control, o cuando usted físicamente no pueda continuar."]}, {"t": "note", "v": "Después de cualquier reanimación, documente la hora del desplome, cuándo empezaron las compresiones, qué se hizo y a quién se avisó. También importa hablar de lo ocurrido: este trabajo es duro para quien lo hace, y su centro debe ofrecer apoyo."}], "quiz": [{"q": "Un residente no responde y emite jadeos fuertes ocasionales. ¿Qué significa esto?", "o": ["Está respirando, así que solo vigílelo", "Es boqueo agónico — trátelo como paro cardíaco e inicie RCP", "Gírelo de lado y espere", "Dé solo respiraciones de rescate"], "a": 1, "w": "Los jadeos agónicos no son respiración efectiva. Una persona sin respuesta que jadea está en paro cardíaco, y confundir esos jadeos con respiración es la causa más común de RCP retrasada."}, {"q": "¿Cuál es la frecuencia correcta de compresiones para toda edad?", "o": ["60 a 80 por minuto", "80 a 100 por minuto", "100 a 120 por minuto", "Lo más rápido posible"], "a": 2, "w": "100 a 120 por minuto en adultos, niños y bebés. Por encima de 120 el tórax no puede volver a llenarse entre compresiones."}, {"q": "¿Qué tan profundas deben ser las compresiones en un adulto?", "o": ["Alrededor de 1 pulgada", "Al menos 2 pulgadas y no más de 2.4 pulgadas", "Al menos 3 pulgadas", "Lo que se sienta cómodo"], "a": 1, "w": "Al menos 2 pulgadas (5 cm), sin exceder 2.4 pulgadas. Cerca de un tercio de la profundidad del tórax en niños (unas 2 pulgadas) y 1.5 pulgadas en bebés."}, {"q": "Dos rescatadores dan RCP a un niño de 4 años. ¿Qué proporción de compresiones y ventilaciones deben usar?", "o": ["30 por 2", "15 por 2", "5 por 1", "Solo compresiones"], "a": 1, "w": "La RCP de dos rescatadores en niños y bebés usa 15 por 2. Un solo rescatador usa 30 por 2 en toda edad."}, {"q": "¿Cuál es el error de técnica más común en las compresiones?", "o": ["Comprimir demasiado rápido", "Apoyarse sobre el pecho y no permitir el retroceso completo", "Pararse del lado equivocado", "Usar dos manos en un niño"], "a": 1, "w": "El retroceso incompleto del tórax impide que la sangre regrese al corazón. Deje que el pecho vuelva por completo entre compresiones."}, {"q": "Está solo con un residente adulto que no responde y tiene su teléfono. ¿Qué hace?", "o": ["Salir a buscar ayuda", "Poner el teléfono en altavoz, llamar al 911 y empezar las compresiones", "Dar dos minutos de RCP antes de llamar", "Buscar primero al enfermero"], "a": 1, "w": "En un adulto, active la respuesta de emergencia de inmediato — el altavoz le permite hacer ambas cosas — y empiece las compresiones sin demora."}, {"q": "¿Cada cuánto deben cambiar los rescatadores durante la RCP y cuánto debe tardar el cambio?", "o": ["Cada 10 minutos, tomando el tiempo que haga falta", "Cada 2 minutos, en menos de 5 segundos", "Solo cuando estén agotados", "Nunca — cambiar interrumpe la RCP"], "a": 1, "w": "Cambie aproximadamente cada 2 minutos y mantenga el relevo por debajo de 5 segundos. La calidad de las compresiones baja en los primeros minutos."}, {"q": "Una residente que responde se agarra la garganta y no puede emitir ningún sonido. ¿Qué hace?", "o": ["Animarla a toser", "Dar compresiones abdominales arriba del ombligo", "Hacer un barrido con el dedo a ciegas", "Acostarla e iniciar compresiones"], "a": 1, "w": "El silencio y la falta de movimiento de aire indican obstrucción grave. Dé compresiones abdominales; use compresiones en el pecho si está embarazada o es demasiado grande para abrazarla."}, {"q": "¿Cuánto debe durar cada respiración de rescate y con cuánto volumen?", "o": ["Dos segundos, con todo el aire posible", "Cerca de un segundo, solo lo suficiente para ver elevarse el pecho", "Tres soplos rápidos", "Hasta sentir resistencia"], "a": 1, "w": "Un segundo por respiración, lo suficiente para ver el pecho elevarse. Ventilar en exceso llena el estómago de aire, provoca vómito y reduce el regreso de sangre al corazón."}, {"q": "Encuentra a un residente en paro cardíaco y no hay ningún DNRO disponible de inmediato. ¿Qué hace?", "o": ["Esperar a que localicen el expediente", "Iniciar RCP y activar el 911", "Suponer que es DNR por su edad", "Preguntar primero a la familia"], "a": 1, "w": "Lo predeterminado es siempre reanimar. La RCP se omite solo cuando se confirma de inmediato un DNRO válido."}]}, "aed": {"body": [{"t": "h", "v": "1. Qué hace la desfibrilación"}, {"t": "p", "v": "La mayoría de los paros cardíacos súbitos en adultos empiezan con un ritmo eléctrico desorganizado — fibrilación ventricular o taquicardia ventricular sin pulso. El músculo del corazón tiembla en lugar de bombear. Un desfibrilador entrega una descarga que detiene toda la actividad eléctrica por un instante para que el marcapasos propio del corazón pueda reiniciar un ritmo organizado. La RCP mantiene la perfusión del cerebro y del corazón hasta que llega esa descarga; la descarga es lo que restablece un ritmo."}, {"t": "p", "v": "El tiempo es todo. La supervivencia de un paro desfibrilable es más alta en los primeros minutos y baja entre siete y diez por ciento por minuto. Un DEA usado dentro de los tres a cinco minutos del desplome, junto con RCP inmediata, produce tasas de supervivencia de hasta cincuenta a setenta por ciento. Después de diez minutos, la supervivencia es poco frecuente."}, {"t": "h", "v": "2. Usar un DEA — la secuencia"}, {"t": "ul", "v": ["<strong>Enciéndalo.</strong> Algunos equipos se encienden al abrir la tapa. Después haga lo que el aparato le indique; todos los DEA lo guían paso a paso.", "<strong>Descubra el pecho.</strong> Corte o rompa la ropa, incluido un sostén con varilla. Seque el pecho si está mojado.", "<strong>Coloque los parches</strong> sobre piel descubierta: uno debajo de la clavícula derecha y el otro en el lado izquierdo del pecho, debajo y hacia el costado del pezón izquierdo, sobre las costillas. Los diagramas vienen impresos en los parches.", "<strong>Que todos se separen</strong> mientras analiza. Nadie toca a la persona, incluido usted. Dígalo en voz alta y mire.", "<strong>Descargue si lo indica.</strong> Confirme que todos están separados y presione el botón, o en un equipo totalmente automático manténgase separado mientras entrega la descarga.", "<strong>Reanude las compresiones de inmediato</strong> después de la descarga — no se detenga a verificar el pulso. Continúe la RCP dos minutos hasta que el DEA indique el siguiente análisis.", "Si no se aconseja descarga, reanude la RCP de inmediato. “No se aconseja descarga” no significa que la persona esté bien.", "<strong>Deje los parches puestos y el DEA conectado</strong> hasta que los paramédicos tomen el control."]}, {"t": "h", "v": "3. Variaciones en la colocación de los parches"}, {"t": "ul", "v": ["<strong>Niños menores de 8 años o de menos de unas 55 libras</strong> — use parches pediátricos o el modo pediátrico si el equipo lo tiene. Si no lo tiene, <strong>use los parches de adulto antes que no desfibrilar</strong>. Colóquelos de modo que no se toquen ni se traslapen; la posición pecho y espalda funciona.", "<strong>Bebés</strong> — se prefiere un desfibrilador manual, luego un DEA con atenuador de dosis, luego un DEA estándar. Nunca deje de dar una descarga por falta de equipo pediátrico.", "<strong>Marcapasos o desfibrilador implantado</strong> — se ve como un bulto duro, normalmente debajo de la clavícula izquierda. Coloque el parche al menos a una pulgada de distancia.", "<strong>Parche de medicamento</strong> — retírelo con la mano enguantada y limpie la piel antes de colocar un parche en esa zona. Un parche de nitroglicerina puede hacer arco eléctrico y quemar.", "<strong>Pecho con mucho vello</strong> — presione los parches con firmeza. Si el equipo indica revisar los parches, arránquelos de un tirón para quitar el vello y coloque el juego de repuesto.", "<strong>Tejido mamario</strong> — coloque el parche izquierdo al costado o por debajo del seno, sobre la pared del tórax, no sobre el seno."]}, {"t": "h", "v": "4. Situaciones de seguridad"}, {"t": "ul", "v": ["<strong>Agua</strong> — saque a la persona del agua estancada y seque el pecho. Un poco de sudor o de lluvia no es razón para retrasar. La nieve y una superficie húmeda son seguras.", "<strong>Superficies metálicas</strong> — la persona puede estar acostada sobre metal; solo asegúrese de que nadie la esté tocando.", "<strong>Oxígeno</strong> — aleje la mascarilla o la cánula al menos tres o cuatro pies del pecho antes de descargar, por riesgo de incendio.", "<strong>Embarazo</strong> — desfibrile normalmente. Salvar a la madre es la forma de salvar al feto.", "<strong>Trauma o joyas visibles</strong> — evite colocar los parches sobre joyas metálicas, pero no pierda tiempo quitando collares.", "El DEA no descargará a alguien que no necesita descarga. Analiza el ritmo y se niega si el ritmo no es desfibrilable."]}, {"t": "h", "v": "5. Mantener el DEA listo"}, {"t": "ul", "v": ["Revise el indicador de estado según el calendario, normalmente cada semana, y documéntelo. Una luz verde o una marca de verificación significa listo; un pitido o una luz roja significa darle servicio ya.", "Vigile las fechas de vencimiento de los parches y de la batería. Los parches adhesivos vencidos no conducen de forma confiable.", "Mantenga junto al equipo un juego de parches de repuesto, una rasuradora, tijeras de trauma, una toalla y guantes.", "Sepa dónde está cada DEA del edificio sin tener que pensarlo, y asegúrese de que esté sin llave y sin obstáculos.", "Después de cualquier uso, reemplace los parches, revise la batería y reporte el evento para que se puedan descargar los datos para los paramédicos y la revisión médica."]}, {"t": "note", "v": "La Ley del Buen Samaritano de Florida y la Ley de Supervivencia al Paro Cardíaco otorgan protecciones de inmunidad a quien usa un DEA de buena fe. Dudar es un riesgo legal y humano mayor que actuar."}], "quiz": [{"q": "Inmediatamente después de que el DEA entrega una descarga, ¿qué hace?", "o": ["Verificar el pulso", "Reanudar las compresiones de inmediato", "Esperar a que el DEA vuelva a analizar", "Retirar los parches"], "a": 1, "w": "Reanude las compresiones de inmediato sin verificar el pulso. El DEA indicará el siguiente análisis después de unos dos minutos de RCP."}, {"q": "¿Dónde van los parches de adulto del DEA?", "o": ["Los dos en el lado izquierdo del pecho", "Debajo de la clavícula derecha y en el pecho izquierdo, debajo y al costado del pezón", "Solo en la espalda", "Sobre el estómago y el cuello"], "a": 1, "w": "Un parche debajo de la clavícula derecha y el otro en la pared inferior izquierda del tórax, al costado del pezón. Los diagramas vienen impresos en los parches."}, {"q": "Un niño de 5 años está en paro cardíaco y solo hay parches de adulto. ¿Qué hace?", "o": ["No usar el DEA", "Usar los parches de adulto, colocados de modo que no se traslapen", "Cortar los parches de adulto a la mitad", "Esperar a que los paramédicos traigan parches pediátricos"], "a": 1, "w": "Nunca deje de desfibrilar por falta de equipo pediátrico. Use los parches de adulto sin que se toquen entre sí; la posición pecho y espalda funciona."}, {"q": "El DEA dice 'no se aconseja descarga'. ¿Qué significa?", "o": ["La persona se recuperó", "Detener la RCP", "El ritmo no es desfibrilable — reanude la RCP de inmediato", "El equipo está averiado"], "a": 2, "w": "Un ritmo no desfibrilable sigue requiriendo RCP. Reanude las compresiones enseguida y deje que el DEA vuelva a analizar en su momento."}, {"q": "Un residente en paro tiene un parche de nitroglicerina donde debe ir un parche del DEA. ¿Qué hace?", "o": ["Colocar el parche del DEA encima", "Retirar el parche de medicamento con la mano enguantada, limpiar la piel y luego colocar el parche", "Omitir ese parche", "No usar el DEA"], "a": 1, "w": "Un parche de medicamento puede hacer arco eléctrico, quemar la piel y bloquear la entrega de energía. Retírelo, limpie la zona y coloque el parche."}, {"q": "Un residente se desploma en un baño con agua en el piso. ¿Qué es correcto?", "o": ["Nunca usar un DEA cerca del agua", "Sacarlo del agua estancada, secar el pecho y luego desfibrilar", "Descargar donde está", "Esperar a que el piso se seque"], "a": 1, "w": "Saque a la persona del agua estancada y seque el pecho. Un poco de sudor o lluvia no es razón para retrasar."}, {"q": "El oxígeno está funcionando por mascarilla cuando el DEA aconseja una descarga. ¿Qué debe hacer?", "o": ["Dejarlo donde está", "Alejar el oxígeno al menos tres o cuatro pies del pecho", "Subir el flujo", "Nada — el oxígeno no es un problema"], "a": 1, "w": "El oxígeno que fluye libremente cerca de los parches es un riesgo de incendio durante una descarga. Aleje el dispositivo varios pies antes de descargar."}, {"q": "Un residente tiene un desfibrilador implantado debajo de la clavícula izquierda. ¿Cómo cambia eso la colocación de los parches?", "o": ["No desfibrilar", "Colocar el parche al menos a una pulgada del dispositivo", "Colocar el parche directamente sobre el dispositivo", "Usar solo parches pediátricos"], "a": 1, "w": "Mantenga el parche a una pulgada del dispositivo implantado para que la energía no se desvíe por él, y luego desfibrile normalmente."}]}, "firstaid": {"body": [{"t": "h", "v": "1. Antes de tocar a nadie"}, {"t": "ul", "v": ["<strong>Primero la seguridad de la escena.</strong> Usted no puede ayudar desde el piso. Busque derrames, electricidad, fuego, una persona agresiva, tráfico.", "<strong>Precauciones estándar.</strong> Guantes siempre, protección ocular si puede salpicar sangre, higiene de manos después.", "<strong>Pida ayuda pronto.</strong> En un centro, mande a una persona específica por el enfermero y el botiquín de emergencia. Llame al 911 ante cualquier cosa que le genere duda; a nadie se le critica por llamar.", "<strong>No mueva a nadie</strong> salvo que esté en peligro donde se encuentra o que deba moverlo para poder atenderlo.", "<strong>Quédese con la persona y siga hablándole</strong>, aunque no pueda responder. Después documente lo que vio y lo que hizo."]}, {"t": "p", "v": "Llame al 911 sin dudar ante: falta de respuesta, dificultad para respirar, dolor o presión en el pecho, señales de derrame cerebral, sangrado incontrolable, una convulsión de más de cinco minutos o una primera convulsión, una quemadura grave, sospecha de fractura de cadera o lesión de columna, una reacción alérgica grave, o cualquier golpe en la cabeza con confusión, vómito o con anticoagulantes de por medio."}, {"t": "h", "v": "2. Sangrado"}, {"t": "ul", "v": ["Aplique presión directa firme con la mano enguantada y un apósito limpio, justo sobre la herida.", "No levante el apósito para mirar. Agregue capas encima y siga presionando.", "Si el sangrado es potencialmente mortal y no se detiene en una extremidad, coloque un torniquete alto y apretado por encima de la herida, ajústelo hasta que el sangrado se detenga y anote la hora. Un torniquete duele; eso es lo esperado.", "No retire un objeto empalado. Estabilícelo en su lugar y acolchone alrededor.", "Sangrado nasal: siéntese derecho, inclínese un poco hacia adelante, pinche la parte blanda de la nariz por 10 a 15 minutos sin soltar para revisar. Inclinarse hacia atrás manda la sangre al estómago.", "Los residentes con anticoagulantes sangran mucho más tiempo por heridas menores. Escale temprano."]}, {"t": "h", "v": "3. Caídas, huesos y golpes en la cabeza"}, {"t": "ul", "v": ["No levante a un residente que se cayó hasta que haya sido evaluado. Pregunte qué pasó y si algo le duele; observe si una pierna se ve más corta o rotada hacia afuera, lo que sugiere fractura de cadera.", "Manténgalo quieto y abrigado, apoye la lesión en la posición en que la encontró y aplique frío a una lesión cerrada por unos 20 minutos.", "Sospeche lesión de columna después de cualquier caída de altura, una lesión al zambullirse, o cualquier caída con dolor de cuello o adormecimiento. No mueva la cabeza ni el cuello.", "Ante un golpe en la cabeza, vigile y reporte: dolor de cabeza que empeora, vómitos repetidos, somnolencia, confusión, pupilas desiguales, líquido claro por la nariz o el oído, debilidad o una convulsión. Cualquier persona con anticoagulantes que se golpee la cabeza necesita evaluación aunque se vea bien.", "Toda caída no presenciada se trata como posible golpe en la cabeza. Toda caída se documenta y se reporta."]}, {"t": "h", "v": "4. Derrame cerebral — el tiempo es cerebro"}, {"t": "p", "v": "Use <strong>BE FAST</strong>: <strong>B</strong> (balance) pérdida súbita del equilibrio o la coordinación; <strong>E</strong> (eyes) pérdida súbita de la visión o visión doble; <strong>F</strong> (face) un lado de la cara se cae al sonreír; <strong>A</strong> (arms) un brazo baja solo al levantar los dos; <strong>S</strong> (speech) habla arrastrada, palabras equivocadas, o no puede repetir una frase sencilla; <strong>T</strong> (time) anote la hora exacta en que empezaron los síntomas, o la última vez que se sabe que la persona estaba bien."}, {"t": "ul", "v": ["Llame al 911 de inmediato. Los medicamentos para disolver el coágulo y la extracción del coágulo tienen límite de tiempo, y la hora de inicio determina lo que el hospital puede ofrecer.", "No dé nada por la boca — ni comida, ni agua, ni medicamentos. La capacidad de tragar suele estar afectada.", "No deje que nadie “espere a ver si pasa”. Los síntomas que se resuelven fueron igualmente una advertencia de un derrame mucho mayor por venir.", "Anote la hora y dígala a los paramédicos. Ese solo dato es lo más valioso que usted entregará."]}, {"t": "h", "v": "5. Dolor de pecho, respiración y reacción alérgica"}, {"t": "ul", "v": ["<strong>Infarto</strong> — presión, opresión o sensación de llenura en el pecho, que puede extenderse al brazo, la mandíbula o la espalda, con falta de aire, sudoración, náusea o mareo. Las mujeres, los adultos mayores y las personas con diabetes con frecuencia no tienen dolor de pecho y en cambio presentan fatiga, náusea o falta de aire. Llame al 911, mantenga a la persona quieta y tranquila, afloje la ropa apretada y ayude con su propia nitroglicerina prescrita si la política lo permite.", "<strong>Crisis de asma o EPOC</strong> — siéntela derecha, guíela a respirar despacio, ayude con su propio inhalador prescrito según la política, y llame al 911 si no puede hablar en oraciones completas, si usa los músculos del cuello y los hombros para respirar, o si se está poniendo azul.", "<strong>Anafilaxia</strong> — ronchas, hinchazón de labios, lengua o garganta, sibilancias, opresión en la garganta, vómito, mareo o desplome. Llame al 911 y aplique sin demora el autoinyector de epinefrina prescrito de la persona: cara externa del muslo, sostenido en su lugar como indique el dispositivo, y anote la hora. La epinefrina se agota; puede hacer falta una segunda dosis y la persona debe ir al hospital aunque mejore."]}, {"t": "h", "v": "6. Convulsiones, diabetes y temperatura"}, {"t": "ul", "v": ["<strong>Convulsión</strong> — proteja la cabeza, retire objetos duros, no la sujete y <strong>nunca le ponga nada en la boca</strong>. Tome el tiempo. Cuando pare el temblor, gírela de lado. Llame al 911 si dura más de cinco minutos, si se repite, si es la primera convulsión, si ocurre en el agua, si sigue a un golpe en la cabeza, o si la persona no despierta.", "<strong>Azúcar baja</strong> — temblores, sudoración, palidez, confusión, irritabilidad, habla arrastrada, hambre. Si está despierta y puede tragar con seguridad, dé 15 gramos de azúcar rápida: media taza de jugo o refresco regular, gel o tabletas de glucosa, o una cucharada de miel. Vuelva a evaluar en 15 minutos y repita si es necesario, y después dé un refrigerio con proteína. <strong>Nunca dé nada por la boca a alguien que no esté completamente despierto</strong> — llame al 911.", "<strong>Azúcar alta</strong> — sed, orinar con frecuencia, aliento con olor dulce a fruta, respiración profunda y rápida, somnolencia. Llame al 911.", "<strong>Golpe de calor</strong> — piel caliente, confusión, desplome, a menudo sin sudoración. Llame al 911 y enfríe con agresividad: mueva a la sombra o al aire acondicionado, retire la ropa, aplique agua fría y compresas de hielo en el cuello, las axilas y la ingle.", "<strong>Hipotermia</strong> — lleve a la persona a un lugar cálido, retire la ropa mojada, cúbrala y muévala con suavidad. Los adultos mayores desarrollan hipotermia incluso dentro de la casa."]}, {"t": "h", "v": "7. Quemaduras, envenenamiento y heridas"}, {"t": "ul", "v": ["<strong>Quemaduras</strong> — enfríe con agua corriente limpia y fresca de 10 a 20 minutos. Sin hielo, sin mantequilla, sin ungüentos. Cubra sin apretar con un apósito limpio que no se adhiera. Quite anillos y relojes antes de que empiece la hinchazón. Llame al 911 ante quemaduras grandes, profundas, blancas o carbonizadas, o que afecten la cara, las manos, los pies, los genitales o una articulación, y ante cualquier quemadura eléctrica o por inhalación.", "<strong>Exposición a químicos</strong> — sacuda primero el polvo seco, después enjuague con agua corriente por al menos 20 minutos, retirando la ropa contaminada. Revise la Hoja de Datos de Seguridad.", "<strong>Lesión ocular</strong> — enjuague del ángulo interno hacia afuera por 15 a 20 minutos si es un químico. Nunca retire un objeto incrustado; cubra ambos ojos y busque atención.", "<strong>Envenenamiento o error de medicación</strong> — llame al Centro de Control de Envenenamiento al <strong>1-800-222-1222</strong>. No provoque el vómito.", "<strong>Amputación o tejido desprendido</strong> — controle el sangrado, envuelva la parte en gasa limpia y húmeda, séllela en una bolsa y coloque esa bolsa sobre hielo. Nunca ponga el tejido directamente sobre el hielo.", "<strong>Diente arrancado</strong> — tómelo por la corona, manténgalo húmedo en leche o solución salina y busque atención dental dentro de la hora."]}], "quiz": [{"q": "Una residente está teniendo una convulsión. ¿Qué debe hacer?", "o": ["Ponerle una cuchara entre los dientes", "Sujetarla para que no se mueva", "Proteger su cabeza, retirar objetos, tomar el tiempo y girarla de lado al terminar", "Echarle agua fría en la cara"], "a": 2, "w": "Nunca sujete a la persona ni le ponga nada en la boca. Proteja la cabeza, despeje el área, tome el tiempo y colóquela de lado después."}, {"q": "¿Qué representa la T en BE FAST?", "o": ["Temperatura", "Tiempo — anote exactamente cuándo empezaron los síntomas", "Temblor", "Tos"], "a": 1, "w": "La hora de inicio, o la última vez que se supo que la persona estaba bien, determina qué tratamientos para el derrame puede ofrecer el hospital."}, {"q": "Una residente con señales de derrame cerebral pide un vaso de agua. ¿Qué hace?", "o": ["Darle pequeños sorbos", "No dar nada por la boca y llamar al 911", "Darle agua con sus pastillas de la mañana", "Dejar que ella decida"], "a": 1, "w": "La capacidad de tragar suele estar afectada en el derrame cerebral. Nada por la boca, incluidos medicamentos, y llame al 911 de inmediato."}, {"q": "¿Cómo debe tratar una quemadura?", "o": ["Aplicar mantequilla o ungüento", "Cubrirla con hielo", "Enfriar con agua corriente limpia y fresca de 10 a 20 minutos, luego cubrir sin apretar", "Dejarla descubierta y seca"], "a": 2, "w": "Agua corriente fresca de 10 a 20 minutos. El hielo causa más daño al tejido y los productos grasosos atrapan el calor."}, {"q": "Una residente con diabetes está confundida, sudorosa y temblorosa, pero despierta y puede tragar. ¿Qué le da?", "o": ["Nada hasta que llegue el enfermero", "Unos 15 gramos de azúcar rápida, como media taza de jugo", "Una barra de proteína", "Insulina"], "a": 1, "w": "Trate con unos 15 gramos de azúcar de acción rápida, reevalúe en 15 minutos y después dé un refrigerio que contenga proteína."}, {"q": "Encuentra a una residente sin respuesta y sospecha azúcar baja. ¿Debe ponerle gel de glucosa en la boca?", "o": ["Sí, se absorbe por la mejilla", "No — nada por la boca si no está completamente despierta; llame al 911", "Sí, con un poco de agua", "Solo si la familia da permiso"], "a": 1, "w": "Dar cualquier cosa por la boca a una persona que no está completamente despierta implica riesgo de aspiración. Llame al 911 y deje que los paramédicos la traten."}, {"q": "La sangre está atravesando el apósito de una herida profunda en el antebrazo. ¿Qué hace?", "o": ["Retirar el apósito para ver la herida", "Agregar más apósitos encima y mantener presión directa firme", "Lavar la herida con alcohol", "Solo elevar el brazo y esperar"], "a": 1, "w": "Levantar el apósito interrumpe la formación del coágulo. Agregue capas y siga presionando; escale a un torniquete si el sangrado es potencialmente mortal."}, {"q": "Una residente presenta hinchazón de labios y lengua, ronchas y sibilancias después del almuerzo. ¿Cuál es la prioridad?", "o": ["Darle un antihistamínico y observar", "Llamar al 911 y aplicar su autoinyector de epinefrina prescrito sin demora", "Acostarla plana a descansar", "Ofrecerle agua"], "a": 1, "w": "Esto es anafilaxia. La epinefrina en la cara externa del muslo es el tratamiento, y debe ser trasladada aunque mejore, porque la reacción puede regresar."}, {"q": "Una residente se cae y su pierna derecha se ve más corta y rotada hacia afuera. ¿Qué hace?", "o": ["Ayudarla a levantarse y sentarla en una silla", "Mantenerla quieta y abrigada, apoyar la pierna como está y llamar al 911", "Jalar la pierna para alinearla", "Pedirle que camine para ver si pasa"], "a": 1, "w": "Esa presentación sugiere fractura de cadera. No mueva ni enderece la extremidad; inmovilice como la encontró y llame a los paramédicos."}, {"q": "Un residente que toma anticoagulantes se golpea la cabeza pero dice que se siente bien. ¿Qué es correcto?", "o": ["No hacer nada, porque se siente bien", "Necesita evaluación médica de todos modos, y debe ser vigilado y reportado", "Solo aplicar hielo y documentarlo", "Volver a revisarlo mañana"], "a": 1, "w": "La anticoagulación hace que el sangrado intracraneal tardío sea un riesgo real. Cualquier golpe en la cabeza con anticoagulantes necesita evaluación aunque no haya síntomas."}]}, "bls": {"body": [{"t": "h", "v": "1. Qué separa el BLS del proveedor de la RCP del rescatador común"}, {"t": "p", "v": "De un profesional de la salud se esperan cuatro cosas que no se esperan de un rescatador común: evaluar el pulso, ventilar con bolsa-mascarilla, trabajar como equipo coordinado y medir la calidad de la reanimación mientras ocurre. La mecánica de las compresiones es idéntica. La diferencia está en la evaluación, el equipo y el trabajo en equipo."}, {"t": "h", "v": "2. La secuencia de evaluación del proveedor"}, {"t": "ul", "v": ["<strong>Verifique la seguridad de la escena.</strong>", "<strong>Verifique la respuesta</strong> — toque y grite.", "<strong>Active el sistema de respuesta de emergencia</strong> y traiga el DEA o el carro de paro. En un centro, active el código y mande a una persona específica.", "<strong>Evalúe respiración y pulso al mismo tiempo, por no más de 10 segundos.</strong> Carótida en adultos y niños, braquial en bebés.", "<strong>Decida:</strong> sin pulso y sin respiración normal → inicie RCP empezando con compresiones. Con pulso pero sin respiración normal → dé respiraciones de rescate, una cada 6 segundos (10 por minuto), y reevalúe el pulso cada 2 minutos. Con pulso y respiración presentes → vigile, posicione y trate el problema de fondo.", "<strong>Conecte el desfibrilador</strong> en cuanto llegue y siga sus indicaciones, minimizando la interrupción de las compresiones."]}, {"t": "note", "v": "Si a los 10 segundos no tiene certeza de si hay pulso, empiece las compresiones. Retrasar la RCP causa mucho más daño que dar compresiones a alguien con pulso débil."}, {"t": "h", "v": "3. Los indicadores de calidad de los que usted es responsable"}, {"t": "ul", "v": ["Frecuencia de 100 a 120 por minuto.", "Profundidad de al menos 2 pulgadas (5 cm) en adultos, alrededor de un tercio del tórax en niños y bebés.", "Retroceso completo del tórax; sin apoyarse.", "Fracción de compresión torácica mayor al 60 por ciento — idealmente 80 por ciento — del tiempo total del código.", "Interrupciones por debajo de 10 segundos, incluidas las del análisis del ritmo y la intubación.", "Evitar la ventilación excesiva.", "Rotar al compresor cada 2 minutos, coordinado con la verificación del ritmo para que el cambio no cueste tiempo adicional.", "Use dispositivos de retroalimentación y capnografía cuando existan. Juzgue la calidad con el monitor, no con su impresión."]}, {"t": "h", "v": "4. Proporciones y vía aérea"}, {"t": "ul", "v": ["<strong>Adulto, uno o dos rescatadores: 30 compresiones por 2 respiraciones.</strong>", "<strong>Niño o bebé, un rescatador: 30 por 2. Dos o más rescatadores: 15 por 2.</strong>", "<strong>Con una vía aérea avanzada colocada</strong> (tubo endotraqueal, dispositivo supraglótico): compresiones continuas sin pausas, con una respiración cada 6 segundos.", "<strong>Técnica de bolsa-mascarilla</strong> — use la técnica E-C con un rescatador o, mejor, la técnica de dos rescatadores: uno sostiene la mascarilla con ambas manos para lograr el sello mientras el otro comprime la bolsa. Comprima durante cerca de un segundo, solo hasta ver elevarse el pecho. Dos tercios de las fallas con bolsa-mascarilla son fallas de sello, no de compresión de la bolsa.", "Considere una vía aérea orofaríngea o nasofaríngea en una persona sin respuesta y sin reflejo nauseoso, para aliviar la obstrucción por tejidos blandos.", "No hiperventile. Las respiraciones en exceso suben la presión intratorácica y reducen la perfusión coronaria y cerebral."]}, {"t": "h", "v": "5. Trabajar como equipo"}, {"t": "ul", "v": ["Todo código efectivo tiene papeles claros: compresor, ventilador, operador del desfibrilador, encargado del tiempo y del registro, acceso vascular y medicamentos, y líder del equipo.", "Use <strong>comunicación de circuito cerrado</strong>: el líder da una instrucción específica a una persona nombrada, esa persona la repite y avisa cuando está hecha.", "Cualquiera puede y debe hablar ante una preocupación de seguridad o un problema de calidad. “Tus compresiones se están volviendo superficiales, déjame relevarte” es buen cuidado, no una crítica.", "Quien registra anuncia los intervalos de 2 minutos para que las verificaciones del ritmo, los relevos y los tiempos de medicación se mantengan en horario.", "Comenten lo ocurrido después de cada evento. Qué salió bien, qué fue lento, qué vamos a cambiar."]}, {"t": "h", "v": "6. Situaciones especiales de reanimación"}, {"t": "ul", "v": ["<strong>Sobredosis de opioides</strong> — si no responde, con respiración anormal pero con pulso, dé respiraciones de rescate y naloxona, y active la respuesta de emergencia. Si no hay pulso, la RCP tiene prioridad; la naloxona no reinicia un corazón.", "<strong>Ahogamiento</strong> — el paro es hipóxico, así que la ventilación importa. Dé respiraciones temprano y no retrase la RCP para drenar agua de los pulmones.", "<strong>Embarazo</strong> — comprima en la posición estándar y, cuando sea posible, alivie la presión sobre los grandes vasos desplazando manualmente el útero hacia la izquierda de la mujer. Priorice reanimar a la madre.", "<strong>Obstrucción de la vía aérea por cuerpo extraño que deja de responder</strong> — inicie RCP y mire dentro de la boca cada vez que abra la vía aérea, retirando un objeto solo si lo puede ver.", "<strong>Paro por hipotermia</strong> — continúe la reanimación; el recalentamiento es parte del tratamiento y los resultados pueden ser buenos incluso tras esfuerzos prolongados.", "<strong>Trauma</strong> — controle el sangrado catastrófico mientras reanima; las compresiones por sí solas no compensan una circulación vacía."]}, {"t": "h", "v": "7. Después del paro y documentación"}, {"t": "ul", "v": ["Si regresa el ritmo y el pulso, apoye la vía aérea, dé oxígeno, coloque a la persona de lado si la respiración es adecuada, vigile de forma continua y prepare el traslado.", "No retire los parches del desfibrilador.", "Documente la hora del desplome, la hora en que empezó la RCP, la hora de la primera descarga, el número de descargas, los medicamentos, quiénes estuvieron presentes y el resultado. Los tiempos son de lo que depende la revisión de calidad.", "En un centro residencial, verifique el estado de reanimación antes y documente lo que encontró. Un DNRO de Florida válido en papel amarillo indica que no se debe dar RCP; sin esa confirmación, reanime."]}, {"t": "h", "v": "8. Mantener las destrezas"}, {"t": "p", "v": "Las destrezas de BLS se deterioran de forma medible dentro de tres a seis meses, mucho antes de que venza el intervalo de certificación de dos años. Practicar de forma breve y frecuente en un maniquí con un dispositivo de retroalimentación conserva las destrezas mucho mejor que una sola clase anual. Pida tiempo de práctica; es la intervención de calidad más económica del edificio."}], "quiz": [{"q": "¿Cuánto tiempo puede tardar un proveedor en verificar respiración y pulso?", "o": ["No más de 10 segundos", "Al menos 30 segundos", "Hasta tener certeza", "Dos minutos completos"], "a": 0, "w": "Verifique respiración y pulso al mismo tiempo por no más de 10 segundos. Si no tiene certeza, empiece las compresiones."}, {"q": "Un adulto tiene pulso pero no respira normalmente. ¿Qué hace?", "o": ["Iniciar compresiones", "Dar una respiración de rescate cada 6 segundos y reevaluar el pulso cada 2 minutos", "Dar 30 por 2", "Nada, solo vigilar"], "a": 1, "w": "Con pulso y respiración inadecuada, ventile a unas 10 respiraciones por minuto — una cada 6 segundos — y reevalúe el pulso cada 2 minutos."}, {"q": "Con una vía aérea avanzada colocada, ¿cómo se da la RCP?", "o": ["30 por 2 como siempre", "15 por 2", "Compresiones continuas con una res
